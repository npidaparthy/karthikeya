— पश्यतां कृते।","scriptures_title":"उद्धृतानि शास्त्राणि","scriptures_subtitle":"अस्मिन् जालपुटे उद्धृतानां पवित्रग्रन्थानां संक्षिप्तः परिचयः","primer_title":"संस्कृतलिपिपरिचयः","primer_subtitle":"तिस्रः लिपयः, एका भाषा — अस्य जालपुटस्य पठनविधिः","primer_intro":"भारतदेशे संस्कृतं बहुलिपिषु लिख्यते। अस्मिन् जालपुटे प्रत्येकः संस्कृतश्लोकः युगपत् तिसृषु लिपिषु दर्श्यते — यतो हि अस्माकं दर्शकाः भिन्नसम्प्रदायेभ्यः भिन्नज्ञानस्तरैश्च आगच्छन्ति।","backgrounds":[{"id":"home","section":"गृहम्","pattern_name":"पद्ममण्डलम्","pattern_why":"अष्टदलपद्मं वैदिकसम्प्रदाये पवित्रताया दैवीयविकासस्य च अत्यन्तपवित्रं प्रतीकम्। तत् पङ्कात् निर्मलसौन्दर्येण विकसति — तथैव कार्तिकेयः साधारणबाल्यात् असाधारणपाण्डित्येन विकसितः।","sloka_dev":"पद्मं पवित्रं पवितान् पुनीहि ।\nतव लक्ष्मी राजसि मातरिश्वन् ॥","sloka_te":"పద్మం పవిత్రం పవితాన్ పునీహి ।\nతవ లక్ష్మీ రాజసి మాతరిశ్వన్ ॥","sloka_iast":"padmaṃ pavitraṃ pavitān punīhi |\ntava lakṣmī rājasi mātariśvan ||","meaning_en":"O pure lotus, purify the pure ones. Your radiance, O divine wind, reigns supreme.","meaning_te":"ఓ పవిత్రమైన పద్మా, పవిత్రులను మరింత పవిత్రం చేయి.","meaning_sa":"हे पवित्रपद्म, पवित्रान् पुनर्विशुद्धान् कुरु। हे मातरिश्वन्, तव लक्ष्मीः श्रेष्ठत्वेन विराजते।","source_en":"Ṛgveda — lotus as symbol of creation and purity","source_te":"ఋగ్వేదం — సృష్టి మరియు పవిత్రతకు పద్మం","source_sa":"ऋग्वेदः — सृष्टेः पवित्रतायाश्च प्रतीकरूपेण पद्मः","scripture_intro":"ऋग्वेदः विश्वे पुरातनतमेषु पवित्रग्रन्थेषु अन्यतमः, ३५०० वर्षेभ्यः पूर्वं निर्मितः। तस्मिन् १०२८ सूक्तानि सन्ति।"},{"id":"about","section":"परिचयः","pattern_name":"नक्षत्रक्षेत्रम्","pattern_why":"वैदिकज्योतिषस्य २७ नक्षत्राणि जनस्य जन्मस्वभावं विधिं प्रतिभाश्च सूचयन्ति। बालस्य कथा — सः कः, कुतः आगतः — नक्षत्रेषु लिखिता। एतत् नमूनं कार्तिकेयस्य असाधारणप्रतिभाः आकस्मिकाः नासन् अपितु विधिनिर्धारिताः इति भावनां सम्मानयति।","sloka_dev":"जन्म कर्म च मे दिव्यम् एवं यो वेत्ति तत्त्वतः ।\nत्यक्त्वा देहं पुनर्जन्म नैति मामेति सोऽर्जुन ॥","sloka_te":"జన్మ కర్మ చ మే దివ్యమ్ ఏవం యో వేత్తి తత్త్వతః ।\nత్యక్త్వా దేహం పునర్జన్మ నైతి మామేతి సోఽర్జున ॥","sloka_iast":"janma karma ca me divyam evaṃ yo vetti tattvataḥ |\ntyaktvā dehaṃ punarjanma naiti māmeti so'rjuna ||","meaning_en":"One who truly understands the divine nature of My birth and actions does not take birth again — they come to Me.","meaning_te":"నా జన్మ మరియు కర్మల దివ్య స్వభావాన్ని నిజంగా అర్థం చేసుకున్నవాడు మళ్ళీ జన్మించడు.","meaning_sa":"यः मम जन्मकर्मणोः दिव्यस्वरूपं तत्त्वतः जानाति, सः पुनर्जन्म न लभते — मामेव प्राप्नोति।","source_en":"Bhagavad Gītā 4.9","source_te":"భగవద్గీత 4.9","source_sa":"भगवद्गीता ४.९ — ज्ञानकर्मसंन्यासयोगः","scripture_intro":"भगवद्गीता कुरुक्षेत्रे अर्जुनकृष्णयोः ७०० श्लोकात्मिका संवादः। कार्तिकेयेण सर्वे ७०० श्लोकाः कण्ठस्थाः, मैसूरु-दत्तपीठात् स्वर्णपदकं च प्राप्तम्।"},{"id":"profile","section":"प्रोफाइल्","pattern_name":"संस्कृतश्लोकरेखाः","pattern_why":"पृष्ठभूमौ संस्कृतश्लोकानां मृद्वीरेखाः सन्ति — कार्तिकेयस्य महत्तमं साधनं तस्य स्मृतौ विद्यमानं जीवन्तज्ञानम् इति सत्यं सम्मानयन्त्यः। वैदिकसम्प्रदाये मौखिकेन प्रसारितं ज्ञानं (श्रुतिः) लिखितज्ञानात् पवित्रतरं मन्यते।","sloka_dev":"विद्या ददाति विनयं विनयाद् याति पात्रताम् ।\nपात्रत्वात् धनमाप्नोति धनात् धर्मं ततः सुखम् ॥","sloka_te":"విద్యా దదాతి వినయం వినయాద్ యాతి పాత్రతామ్ ।\nపాత్రత్వాత్ ధనమాప్నోతి ధనాత్ ధర్మం తతః సుఖమ్ ॥","sloka_iast":"vidyā dadāti vinayaṃ vinayād yāti pātratām |\npātratāt dhanamāpnoti dhanāt dharmaṃ tataḥ sukham ||","meaning_en":"Knowledge gives humility; from humility comes worthiness; from worthiness wealth; from wealth dharma; from dharma happiness.","meaning_te":"విద్య వినయాన్ని ఇస్తుంది; వినయం నుండి పాత్రత; పాత్రత నుండి సంపద; సంపద నుండి ధర్మం; ధర్మం నుండి సుఖం.","meaning_sa":"विद्या विनयं ददाति; विनयात् पात्रता जायते; पात्रतायाः धनम्; धनात् धर्मः; धर्मात् सुखम्।","source_en":"Hitopadeśa 1.1","source_te":"హితోపదేశ 1.1","source_sa":"हितोपदेशः १.१ — ज्ञानसाहित्यस्य प्रारम्भश्लोकः","scripture_intro":"हितोपदेशः नारायणपण्डितेन विरचितः संस्कृतग्रन्थः, पशुकथानि ज्ञानश्लोकाश्च धारयति। तस्य प्रारम्भश्लोकः विद्याविषये अत्यन्तप्रसिद्धः संस्कृतसूक्तिः अस्ति।"},{"id":"credits","section":"कृतज्ञता","pattern_name":"परस्परवलयानि","pattern_why":"गुरुकुलसम्प्रदायः स्वीकरोति यत् विद्यार्थी एकाकी न शिक्षते। गुरोः ज्ञानम्, मातापित्रोः समर्थनम्, समाजस्य प्रोत्साहनम् — सर्वाणि ज्ञानप्रसारणस्य शृङ्खलायां परस्परसंयुक्तानि वलयानि।","sloka_dev":"सं गच्छध्वं सं वदध्वं सं वो मनांसि जानताम् ।\nदेवा भागं यथा पूर्वे सञ्जानाना उपासते ॥","sloka_te":"సం గచ్ఛధ్వం సం వదధ్వం సం వో మనాంసి జానతామ్ ।\nదేవా భాగం యథా పూర్వే సఞ్జానానా ఉపాసతే ॥","sloka_iast":"saṃ gacchadhvaṃ saṃ vadadhvaṃ saṃ vo manāṃsi jānatām |\ndevā bhāgaṃ yathā pūrve sañjānānā upāsate ||","meaning_en":"Come together, speak together, let your minds be in harmony.","meaning_te":"కలిసి రండి, కలిసి మాట్లాడండి, మీ మనసులు సమరసంగా ఉండనీయండి.","meaning_sa":"एकत्र आगच्छत, एकत्र वदत, यूयं मनसा सह जानीत। यथा पूर्वे देवाः एकत्र उपासन्ते।","source_en":"Ṛgveda X.191.2 — Saṃjñāna Sūkta","source_te":"ఋగ్వేదం X.191.2 — సంజ్ఞాన సూక్తం","source_sa":"ऋग्वेदः X.१९१.२ — सञ्ज्ञानसूक्तम्, ऐक्यस्य समरसतायाश्च स्तोत्रम्","scripture_intro":"ऋग्वेदस्य सञ्ज्ञानसूक्तं (X.१९१) मनोवाक्कर्मणां ऐक्यम् आह्वयत् गाढसामाजिकसमरसतायाः स्तोत्रम् अस्ति।"},{"id":"events","section":"कार्यक्रमाः","pattern_name":"कालचक्रम्","pattern_why":"कार्तिकेयस्य यात्रायां प्रत्येकः मैलस्तम्भः महाकालचक्रे एकः क्षणः। स्वर्णपदकम्, पठनानि, प्रदर्शनानि — एतस्मिन् चक्रे सर्वाणि एकैकाराः।","sloka_dev":"कालोऽस्मि लोकक्षयकृत् प्रवृद्धो\nलोकान् समाहर्तुमिह प्रवृत्तः ।","sloka_te":"కాలోఽస్మి లోకక్షయకృత్ ప్రవృద్ధో\nలోకాన్ సమాహర్తుమిహ ప్రవృత్తః ।","sloka_iast":"kālo'smi lokakṣayakṛt pravṛddho\nlokān samāhartum iha pravṛttaḥ |","meaning_en":"I am Time, the great destroyer of worlds, fully developed, come to consume all these worlds.","meaning_te":"నేను కాలాన్ని, లోకాలను సంహరించడానికి వచ్చాను.","meaning_sa":"अहं कालः, लोकानां क्षयकर्ता, परिणतः, एतान् सर्वान् लोकान् संहर्तुम् प्रवृत्तः।","source_en":"Bhagavad Gītā 11.32","source_te":"భగవద్గీత 11.32","source_sa":"भगवद्गीता ११.३२ — विश्वरूपदर्शनयोगः","scripture_intro":"भगवद्गीतायाः एकादशेऽध्याये अत्यन्ताद्भुतः क्षणः अस्ति — अर्जुनस्य कृष्णस्य विश्वरूपदर्शनम्। श्लोके ३२ कृष्णः स्वयं कालत्वेन प्रकटते।"},{"id":"parayana","section":"पारायणम्","pattern_name":"ओंकारतरङ्गवलयानि","pattern_why":"पवित्राक्षरं OM (प्रणवः) सर्वसृष्टेः उद्भवस्थानं आदिमशब्दः इति उच्यते। कार्तिकेयः यदा पारायणं करोति — विष्णुसहस्रनाम, ललितासहस्रनाम, भगवद्गीता वा — तदा सः मानवकण्ठस्य विश्वशब्दस्य च मध्ये तत् सम्बन्धं पुनःस्थापयति।","sloka_dev":"ॐ तत्सदिति निर्देशो ब्रह्मणस्त्रिविधः स्मृतः ।\nब्राह्मणास्तेन वेदाश्च यज्ञाश्च विहिताः पुरा ॥","sloka_te":"ఓం తత్సదితి నిర్దేశో బ్రహ్మణస్త్రివిధః స్మృతః ।\nబ్రాహ్మణాస్తేన వేదాశ్చ యజ్ఞాశ్చ విహితాః పురా ॥","sloka_iast":"oṃ tat sad iti nirdeśo brahmaṇas trividhaḥ smṛtaḥ |\nbrāhmaṇās tena vedāś ca yajñāś ca vihitāḥ purā ||","meaning_en":"OM, TAT, SAT — the three designations of Brahman. By these the Vedas and sacred rites were established.","meaning_te":"ఓం, తత్, సత్ — బ్రహ్మనకు మూడు సంకేతాలు. వీటి ద్వారానే వేదాలు ఏర్పాటయ్యాయి.","meaning_sa":"ओम्, तत्, सत् — इति ब्रह्मणः त्रिविधः निर्देशः। एतैरेव वेदाः यज्ञाश्च विहिताः।","source_en":"Bhagavad Gītā 17.23","source_te":"భగవద్గీత 17.23","source_sa":"भगवद्गीता १७.२३ — श्रद्धात्रयविभागयोगः","scripture_intro":"वैदिकसम्प्रदायः OM-शब्दात् एव विश्वं सृष्टम् इति मन्यते। पारायणम् व्यक्तिगतकण्ठं विश्वशब्देन पुनःसंयोजयति। माण्डूक्योपनिषत् आह: 'सर्वं ह्येतद् ब्रह्म' — सर्वमपि OM एव।"},{"id":"support","section":"सहायता","pattern_name":"पुष्पयज्ञनमूनम्","pattern_why":"वैदिकसम्प्रदाये यज्ञः केवलं अग्निकर्म नास्ति — परेषां कल्याणाय भक्त्या क्रियमाणं यत् कर्म तदपि यज्ञः। युवविद्वांसस्य यात्रां समर्थयितुं स्वयमेव यज्ञः।","sloka_dev":"सहयज्ञाः प्रजाः सृष्ट्वा पुरोवाच प्रजापतिः ।\nअनेन प्रसविष्यध्वम् एष वोऽस्त्विष्टकामधुक् ॥","sloka_te":"సహయజ్ఞాః ప్రజాః సృష్ట్వా పురోవాచ ప్రజాపతిః ।\nఅనేన ప్రసవిష్యధ్వమ్ ఏష వోఽస్త్విష్టకామధుక్ ॥","sloka_iast":"sahayajñāḥ prajāḥ sṛṣṭvā purovāca prajāpatiḥ |\nanena prasaviṣyadhvam eṣa vo'stv iṣṭakāmadhuk ||","meaning_en":"Having created humanity with yajña, the Creator declared: By this shall you flourish.","meaning_te":"యజ్ఞముతో ప్రజలను సృష్టించి, ప్రజాపతి చెప్పాడు: దీని ద్వారా వర్ధిల్లండి.","meaning_sa":"यज्ञेन सह प्रजाः सृष्ट्वा प्रजापतिः उक्तवान्: 'अनेन यूयं समृद्धिं प्राप्स्यथ।'","source_en":"Bhagavad Gītā 3.10","source_te":"భగవద్గీత 3.10","source_sa":"भगवद्गीता ३.१० — कर्मयोगः","scripture_intro":"भगवद्गीतायाः तृतीयेऽध्याये कर्मयोगः — निष्कामकर्ममार्गः — प्रतिपाद्यते। श्लोकाः १०-१६ यज्ञस्य विश्वसूत्रं वर्णयन्ति।"},{"id":"testimonials","section":"अभिप्रायाः","pattern_name":"उद्धरणचापाः","pattern_why":"वैदिकसम्प्रदाये साक्षात्कृतगुरोः वाक् (गुरुवाक्यम्) स्वयमेव शास्त्रस्य एका रूपम्। समवेदं-शङ्खमुखशर्मादयः महापण्डिताः यदा कार्तिकेयविषये वदन्ति, तदा तेषां वाक् सम्प्रदायस्य भारं वहति।","sloka_dev":"सत्यमेव जयते नानृतं\nसत्येन पन्था विततो देवयानः ।","sloka_te":"సత్యమేవ జయతే నానృతం\nసత్యేన పంథా వితత్ దేవయానః ।","sloka_iast":"satyam eva jayate nānṛtaṃ\nsatyena panthā vitato devayānaḥ |","meaning_en":"Truth alone triumphs, not falsehood. Through truth is the divine path laid.","meaning_te":"సత్యమే జయిస్తుంది. సత్యం ద్వారానే దైవానికి మార్గం.","meaning_sa":"सत्यमेव विजयते, न असत्यम्। सत्येन एव देवयानः मार्गः विस्तृतः।","source_en":"Muṇḍaka Upaniṣad 3.1.6 — motto of the Government of India","source_te":"ముండక ఉపనిషత్ 3.1.6 — భారత ప్రభుత్వ నినాదం","source_sa":"मुण्डकोपनिषत् ३.१.६ — भारतसर्वकारस्य आदर्शवाक्यम्","scripture_intro":"मुण्डकोपनिषत् प्रधानोपनिषत्सु अन्यतमा, अथर्ववेदस्य भागः। 'परा विद्या' (आत्मज्ञानम्) 'अपरा विद्या' (लौकिकज्ञानम्) च अयोः भेदं वर्णयति।"},{"id":"youtube","section":"यूट्यूब्","pattern_name":"श्रुतितरङ्गाः","pattern_why":"'वेद' इति पदं 'विद्' (ज्ञातुम्) इति मूलात् जातम्। वेदाः श्रुतिः — सहस्रवर्षाणि यावत् लेखनात् पूर्वं मौखिकेन प्रसारिताः। कार्तिकेयस्य यूट्यूब्-वाहिनी एतस्याः श्रुतिपरम्परायाः आधुनिकं प्रवाहनम्।","sloka_dev":"श्रुतिः स्मृतिश्च वेदोक्तं धर्मं विद्यां तथैव च ।\nसर्वं वेदात् प्रसिद्ध्यति वेदो हि परमं प्रमाणम् ॥","sloka_te":"శ్రుతిః స్మృతిశ్చ వేదోక్తం ధర్మం విద్యాం తథైవ చ ।\nసర్వం వేదాత్ ప్రసిద్ధ్యతి వేదో హి పరమం ప్రమాణమ్ ॥","sloka_iast":"śrutiḥ smṛtiś ca vedoktaṃ dharmaṃ vidyāṃ tathaiva ca |\nsarvaṃ vedāt prasiddhyati vedo hi paramaṃ pramāṇam ||","meaning_en":"Śruti and Smṛti, dharma and knowledge — all known through the Veda. The Veda is the supreme authority.","meaning_te":"శ్రుతి మరియు స్మృతి — ఇవన్నీ వేదం ద్వారా తెలుసు. వేదమే అత్యున్నత ప్రమాణం.","meaning_sa":"श्रुतिः स्मृतिश्च, धर्मं विद्यां च — सर्वं वेदात् ज्ञायते। वेदः परमं प्रमाणम्।","source_en":"Based on Manusmṛti 2.10","source_te":"మనుస్మృతి 2.10 ఆధారంగా","source_sa":"मनुस्मृतेः २.१० आधारेण","scripture_intro":"वैदिकसम्प्रदायः श्रुतिम् (शाश्वतवेदाः) स्मृतिम् (इतिहासपुराणादयः) च विभजति। कार्तिकेयस्य यूट्यूब्-वाहिनी उभयोः सम्मानं करोति।"},{"id":"contact","section":"सम्पर्कः","pattern_name":"सन्धिनमूनम्","pattern_why":"संस्कृतव्याकरणे सन्धिः शब्दानां संयोजनम् — द्वयोः पदयोः मिलने यत् सुन्दरं विलयनं जायते। सम्पर्कः द्वयोः जीवनयोः क्षणिकस्पर्शः। कार्तिकेयाय प्रेषितः प्रत्येकः सन्देशः सम्प्रदायस्य महाजाले एकः लघुसंयोगः।","sloka_dev":"सर्वे भवन्तु सुखिनः । सर्वे सन्तु निरामयाः ।\nसर्वे भद्राणि पश्यन्तु । मा कश्चिद्दुःखभाग् भवेत् ॥","sloka_te":"సర్వే భవంతు సుఖినః । సర్వే సంతు నిరామయాః ।\nసర్వే భద్రాణి పశ్యంతు । మా కశ్చిద్దుఃఖభాగ్ భవేత్ ॥","sloka_iast":"sarve bhavantu sukhinaḥ | sarve santu nirāmayāḥ |\nsarve bhadrāṇi paśyantu | mā kaścid duḥkhabhāg bhavet ||","meaning_en":"May all be happy. May all be free from disease. May all see what is auspicious. May none suffer.","meaning_te":"అందరూ సుఖంగా ఉండుగాక. ఎవ్వరూ దుఃఖం పొందకుండుగాక.","meaning_sa":"सर्वे सुखिनः भवन्तु। सर्वे निरामयाः भवन्तु। सर्वे भद्राणि पश्यन्तु। कोऽपि दुःखभाक् न भवेत्।","source_en":"Bṛhadāraṇyaka Upaniṣad — universal peace prayer","source_te":"బృహదారణ్యక ఉపనిషత్ — విశ్వ శాంతి ప్రార్థన","source_sa":"बृहदारण्यकोपनिषत् — सर्वलोककल्याणप्रार्थना, शान्तिमन्त्रः","scripture_intro":"बृहदारण्यकोपनिषत् सर्वोपनिषत्सु बृहत्तमा पुरातनतमाश्च अन्यतमा, शुक्लयजुर्वेदस्य भागः। तस्याः शान्तिमन्त्रः — 'सर्वे भवन्तु सुखिनः' — अत्यन्तप्रियः संस्कृतप्रार्थनाशब्दः।"}],"scriptures":[{"id":"gita","name":"श्रीमद्भगवद्गीता","name_te":"శ్రీమద్ భగవద్గీత","name_dev":"श्रीमद्भगवद्गीता","verses":"७०० श्लोकाः · १८ अध्यायाः","part_of":"महाभारतम्, षष्ठपर्व (भीष्मपर्व)","period":"क्रि.पू. ४०० – क्रि.श. २०० मध्ये निर्मिता","intro_en":"The Bhagavad Gītā is a 700-verse dialogue. Karthikeya has memorised all 700 verses.","intro_te":"భగవద్గీత 700 శ్లోకాల సంభాషణ. కార్తికేయ మొత్తం కంఠస్థం చేసాడు.","key_teachings":["कर्मयोगः — निष्कामकर्म","ज्ञानयोगः — ज्ञानमार्गः","भक्तियोगः — भक्तिमार्गः","राजयोगः — ध्यानमार्गः","धर्मः — धर्मबद्धकर्तव्यम्"],"quoted_verses":["४.७ — धर्मक्षीणे अहम् अवतरामि (गृहम्)","४.९ — मम जन्मकर्म दिव्यम् (परिचयः)","११.३२ — कालः अस्मि (कार्यक्रमाः)","१७.२३ — OM TAT SAT (पारायणम्)","३.१० — यज्ञेन सृष्टिः (सहायता)"]},{"id":"rigveda","name":"ऋग्वेदः","name_te":"ఋగ్వేదం","name_dev":"ऋग्वेदः","verses":"१०,५५२ मन्त्राः · १,०२८ सूक्तानि · १० मण्डलानि","part_of":"चतुर्षु वेदेषु पुरातनतमः","period":"क्रि.पू. १५००–१२०० (विश्वे पुरातनतमेषु धर्मग्रन्थेषु अन्यतमः)","intro_en":"The Ṛgveda is the world's oldest collection of sacred hymns.","intro_te":"ఋగ్వేదం పవిత్ర సూక్తాల పురాతన సంకలనం.","key_teachings":["अग्निसूक्तम् — पवित्राग्निः","पुरुषसूक्तम् — विश्वसृष्टिः","नासदीयसूक्तम् — विश्वोद्भवः","सञ्ज्ञानसूक्तम् — ऐक्यं समरसता च (X.१९१)"],"quoted_verses":["X.१९१.२ — एकत्र आगच्छत (कृतज्ञता)","पद्मप्रतीकाः — पवित्रता सृष्टिश्च (गृहम्)"]},{"id":"upanishads","name":"उपनिषदः","name_te":"ఉపనిషత్తులు","name_dev":"उपनिषदः","verses":"१०८ उपनिषदः · १३ मुख्योपनिषदः","part_of":"वेदानां दार्शनिकभागः (वेदान्तः)","period":"क्रि.पू. ८००–२०० मध्ये निर्मिताः","intro_en":"The Upaniṣads are the philosophical heart of the Vedas.","intro_te":"ఉపనిషత్తులు వేదాల తాత్విక హృదయం.","key_teachings":["तत्त्वमसि — त्वमेव तत् (छान्दोग्य)","अहं ब्रह्मास्मि — अहं ब्रह्म (बृहदारण्यक)","सत्यं ज्ञानमनन्तं ब्रह्म (तैत्तिरीय)","ओं इत्येतदक्षरम् (माण्डूक्य)"],"quoted_verses":["मुण्डक ३.१.६ — सत्यमेव जयते (अभिप्रायाः)","बृहदारण्यक — सर्वे भवन्तु सुखिनः (सम्पर const LANGS=["en","te","sa"];

function s(id,v){const e=document.getElementById(id);if(e&&v!=null)e.innerHTML=v;}
function ph(id,v){const e=document.getElementById(id);if(e)e.placeholder=v||"";}
function ytThumb(url){
  if(!url) return '';
  const vm = url.match(/(?:youtu\.be\/|v=)([A-Za-z0-9_-]{11})/);
  if(vm) return `https://img.youtube.com/vi/${vm[1]}/hqdefault.jpg`;
  return '';
}

// ── LANGUAGE SWITCH ───────────────────────────────────────────────────────────
function setLang(lang){
  CL=lang;
  T=ALL[lang]||ALL.en;
  // Body font class + html lang attribute (fixes browser validation language)
  const b=document.getElementById("body");
  b.classList.remove("te","sa");
  if(lang==="te") b.classList.add("te");
  if(lang==="sa") b.classList.add("sa");
  // Update <html lang> so browser native UI (e.g. validation) uses correct language
  document.documentElement.lang = lang==="te" ? "te" : lang==="sa" ? "sa" : "en";
  // Lang pill highlight
  document.querySelectorAll(".lbtn").forEach(btn=>
    btn.classList.toggle("active", btn.dataset.lang===lang));
  // Settings panel lang highlight
  document.querySelectorAll(".slb").forEach((btn,i)=>
    btn.classList.toggle("active", LANGS[i]===lang));
  document.documentElement.lang={en:"en",te:"te",sa:"sa"}[lang]||"en";
  renderAll();
  try{localStorage.setItem("kp-lang",lang);}catch(e){}
}

function goTo(id){document.getElementById(id)?.scrollIntoView({behavior:"smooth"});}
function mNav(id){document.getElementById("mobNav").classList.remove("open");setTimeout(()=>goTo(id),80);}

// Active nav highlight via IntersectionObserver
const secIds=["home","about","profile","credits","events","parayana","support","testimonials","youtube","contact","wisdom"];
secIds.forEach(id=>{
  const el=document.getElementById(id);
  if(!el) return;
  new IntersectionObserver(entries=>{
    if(entries[0].isIntersecting)
      document.querySelectorAll(".nl").forEach(a=>{
        const isCurrent = a.getAttribute("data-nav")===id;
        a.classList.toggle("active", isCurrent);
        isCurrent ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current");
      });
  },{threshold:.3}).observe(el);
});

function setFS(v){
  v=parseInt(v,10);
  document.documentElement.style.fontSize=v+"px";
  // Telugu & Devanagari need slightly larger base for readability
  const teStyle=document.getElementById("teSaStyle")||createTeSaStyle();
  teStyle.textContent=`body.te{font-size:${((v+2)/v).toFixed(4)}em!important}body.sa{font-size:${((v+2)/v).toFixed(4)}em!important}`;
  document.getElementById("fsv").textContent=v;
  try{localStorage.setItem("kp-fs",v);}catch(e){}
}
function createTeSaStyle(){
  const s=document.createElement("style");
  s.id="teSaStyle";
  document.head.appendChild(s);
  return s;
}

// ── CONTACT FORM — Google Apps Script submission ─────────────────────────────
// Replace YOUR_SCRIPT_URL with your deployed Apps Script Web App URL
// (see SETUP.md for instructions)
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxa0hLe7kRV3jhmTdvHNf9P8rVntm8wEAa7Xrz0f51mT8LJwrxRtD2Q0yU-m-UsTUrY3A/exec";

function submitForm(e) {
  e.preventDefault();
  const form    = e.target;
  const btn     = document.getElementById("fbt");
  const thanks  = document.getElementById("ftk");
  const errMsg  = document.getElementById("fterr");

  // Read values
  const name    = document.getElementById("fn").value.trim();
  const email   = document.getElementById("fe").value.trim();
  const subject = document.getElementById("fs2").value.trim();
  const message = document.getElementById("fm").value.trim();

  // Custom validation — clear previous errors
  clearFormErrors();
  let valid = true;
  if (!name)    { showFieldError("fn",  T.contact && T.contact.err_name    || "Please enter your name");    valid = false; }
  if (!email)   { showFieldError("fe",  T.contact && T.contact.err_email   || "Please enter a valid email"); valid = false; }
  if (!message) { showFieldError("fm",  T.contact && T.contact.err_message || "Please enter your message"); valid = false; }
  if (!valid) return;

  // Show loading state
  if (btn) { btn.disabled = true; btn.textContent = "⏳ Sending…"; }
  if (thanks) thanks.style.display = "none";
  if (errMsg) errMsg.style.display = "none";

  // If no URL configured yet, simulate success gracefully
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === "YOUR_SCRIPT_URL") {
    setTimeout(() => {
      if (btn) { btn.disabled = false; btn.textContent = T.contact && T.contact.form_submit || "Send Message ✉"; }
      if (thanks) thanks.style.display = "block";
      form.reset();
    }, 800);
    return;
  }

  // Send to Google Apps Script
  fetch(APPS_SCRIPT_URL, {
    method:  "POST",
    mode:    "no-cors",   // Apps Script requires no-cors
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, email, subject, message, lang: CL })
  })
  .then(() => {
    // no-cors means we can't read the response — assume success
    if (btn) { btn.disabled = false; btn.textContent = T.contact && T.contact.form_submit || "Send Message ✉"; }
    if (thanks) thanks.style.display = "block";
    form.reset();
  })
  .catch(err => {
    console.error("Form submission error:", err);
    if (btn) { btn.disabled = false; btn.textContent = T.contact && T.contact.form_submit || "Send Message ✉"; }
    if (errMsg) errMsg.style.display = "block";
  });
}

let galIdx = 0;
let galTotal = 0;
let galTimer = null;
const GAL_INTERVAL = 4500; // ms between auto-advances

function buildGallery() {
  const strip  = document.getElementById("galleryStrip");
  const dotsEl = document.getElementById("galleryDots");
  const hint   = document.getElementById("galleryHint");
  if (!strip || !dotsEl) return;

  galTotal = GALLERY_SLIDES.length;
  strip.innerHTML  = "";
  dotsEl.innerHTML = "";

  // Set strip width = total slides × 280px so translateX works perfectly
  strip.style.width = (GALLERY_SLIDES.length * 280) + "px";

  GALLERY_SLIDES.forEach((slide, i) => {
    // Slide — image only (no inner caption; caption is in the card below)
    const div = document.createElement("div");
    div.className = "gallery-slide";
    div.setAttribute("data-idx", i);

    const img = document.createElement("img");
    img.src = slide.src;
    img.alt = slide.title_en || "";
    img.loading = "lazy";
    if(slide.pos) img.style.objectPosition = slide.pos;
    div.appendChild(img);
    strip.appendChild(div);

    // Dot
    const dot = document.createElement("div");
    dot.className = "gdot" + (i===0?" active":"");
    dot.setAttribute("data-idx", i);
    dot.onclick = () => { resetGalTimer(); galGoTo(i); };
    dotsEl.appendChild(dot);
  });

  if (galTotal <= 1) {
    hint.classList.add("show");
    dotsEl.style.display = "none";
    document.getElementById("galleryPrev").style.display = "none";
    document.getElementById("galleryNext").style.display = "none";
  }

  galGoTo(0, false);
  startGalTimer();
  updateGalCaptions();
}

function galGoTo(idx, animate=true) {
  galIdx = ((idx % galTotal) + galTotal) % galTotal;
  const strip = document.getElementById("galleryStrip");
  if (strip) {
    if (!animate) strip.style.transition = "none";
    strip.style.transform = `translateX(-${galIdx * 280}px)`;
    if (!animate) requestAnimationFrame(() => { strip.style.transition = ""; });
  }
  document.querySelectorAll(".gdot").forEach((d,i) =>
    d.classList.toggle("active", i === galIdx));
  // Update caption card for new slide
  updateGalCaptions();
}

function galleryNav(dir) {
  resetGalTimer();
  galGoTo(galIdx + dir);
}

function startGalTimer() {
  if (galTotal <= 1) return;
  galTimer = setInterval(() => galGoTo(galIdx + 1), GAL_INTERVAL);
}
function resetGalTimer() {
  clearInterval(galTimer);
  startGalTimer();
}

// Pause on hover
function initGalHover() {
  const wrap = document.getElementById("galleryWrap");
  if (!wrap) return;
  wrap.addEventListener("mouseenter", () => clearInterval(galTimer));
  wrap.addEventListener("mouseleave", () => { clearInterval(galTimer); startGalTimer(); });
  // Touch swipe support
  let tx = 0;
  wrap.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, {passive:true});
  wrap.addEventListener("touchend",   e => {
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 40) galleryNav(dx < 0 ? 1 : -1);
  }, {passive:true});
}

// Update the caption card for the current slide and language
function updateGalCaptions() {
  const langKey = CL === "te" ? "te" : CL === "sa" ? "sa" : "en";
  const slide   = GALLERY_SLIDES[galIdx] || GALLERY_SLIDES[0];
  if (!slide) return;
  const tEl = document.getElementById("galCapTitle");
  const dEl = document.getElementById("galCapDesc");
  if (tEl) tEl.textContent = slide["title_" + langKey] || slide.title_en || "";
  if (dEl) dEl.textContent = slide["desc_"  + langKey] || slide.desc_en  || "";
}

// Keyboard navigation when gallery is in view
document.addEventListener("keydown", e => {
  const wrap = document.getElementById("galleryWrap");
  if (!wrap) return;
  const r = wrap.getBoundingClientRect();
  if (r.top < window.innerHeight && r.bottom > 0) {
    if (e.key === "ArrowLeft")  galleryNav(-1);
    if (e.key === "ArrowRight") galleryNav(1);
  }
});

// Apply background pattern when section comes into view
const bgObserver = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const id = e.target.id;
      const bg = SEC_BG[id];
      if (bg) e.target.style.backgroundImage = bg;
    }
  });
}, {threshold: 0.1});

function initSectionBgs() {
  Object.keys(SEC_BG).forEach(id => {
    const el = document.getElementById(id);
    if (el) bgObserver.observe(el);
  });
  // Set home immediately
  const home = document.getElementById('home');
  if (home && SEC_BG.home) home.style.backgroundImage = SEC_BG.home;
}

// ── Info buttons on each section ─────────────────────────────────────────────
function addInfoButtons() {
  const W = T.wisdom || {};
  const bgs = W.backgrounds || [];
  bgs.forEach(bg => {
    const el = document.getElementById(bg.id);
    if (!el) return;
    // Remove old button if any
    const old = el.querySelector('.sec-info-btn');
    if (old) old.remove();
    const btn = document.createElement('button');
    btn.className = 'sec-info-btn';
    btn.setAttribute('aria-label', 'Quote & inspiration for this section');
    btn.innerHTML = '📖';

function openQP(sectionId) {

// ── Form field error helpers ─────────────────────────────────────────────────
function showFieldError(fieldId, msg) {
  const field = document.getElementById(fieldId);
  if (!field) return;
  field.style.borderColor = "#c44040";
  // Insert error message after the field if not already there
  const errId = fieldId + "_err";
  let errEl = document.getElementById(errId);
  if (!errEl) {
    errEl = document.createElement("p");
    errEl.id = errId;
    errEl.style.cssText = "font-size:0.639rem;color:#c44040;margin-top:-6px;margin-bottom:2px;font-style:italic;";
    field.parentNode.insertBefore(errEl, field.nextSibling);
  }
  errEl.textContent = msg;
  errEl.style.display = "block";
  // Clear on input
  field.addEventListener("input", () => {
    field.style.borderColor = "";
    errEl.style.display = "none";
  }, { once: true });
}

function clearFormErrors() {
  ["fn","fe","fs2","fm"].forEach(id => {
    const f = document.getElementById(id);
    if (f) f.style.borderColor = "";
    const e = document.getElementById(id + "_err");
    if (e) e.style.display = "none";
  });
}

// SCROLL PROGRESS BAR
// ═══════════════════════════════════════════════════════════════════
function updateScrollBar() {
  const bar  = document.getElementById("scrollBar");
  const topBtn = document.getElementById("topBtn");
  if (!bar) return;
  const scrollTop    = document.documentElement.scrollTop || document.body.scrollTop;
  const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
  const pct = scrollHeight > 0 ? (scrollTop / scrollHeight * 100) : 0;
  bar.style.width = pct + "%";
  // Show back-to-top after 300px scroll
  if (topBtn) topBtn.classList.toggle("visible", scrollTop > 300);
}
window.addEventListener("scroll", updateScrollBar, { passive: true });

// ═══════════════════════════════════════════════════════════════════
// SECTION ENTRANCE ANIMATIONS
// ═══════════════════════════════════════════════════════════════════
function initEntranceAnimations() {
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add("revealed");
        observer.unobserve(e.target);
      }
    });
  }, { threshold: 0.02, rootMargin: "0px 0px -40px 0px" });

  document.querySelectorAll(".sec-animate").forEach(el => observer.observe(el));

  // Fallback: reveal any section still hidden after 2.5s
  // (handles edge cases where IntersectionObserver doesn't fire)
  setTimeout(() => {
    document.querySelectorAll(".sec-animate:not(.revealed)").forEach(el => {
      el.classList.add("revealed");
    });
  }, 2500);
}
