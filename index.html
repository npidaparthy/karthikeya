<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Karthikeya Pidaparthy — Samskruti</title>
  <meta name="description" content="Karthikeya Pidaparthy — Sanskrit scholar, Bhagavad Gita memoriser, Sanskrit Olympiad winner, Sydney Australia."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#fdf8f0;--surf:#fff9ef;--gold:#c8860a;--gold-l:#f0c84a;--gold-d:#8b5e06;
      --mar:#7a1a2e;--mar-l:#c4405a;--tx:#2c1a0e;--txm:#6b4c30;--txs:#a07850;
      --bd:rgba(200,134,10,.25);--bds:rgba(200,134,10,.5);
      --sh:0 4px 24px rgba(122,26,46,.08);--shl:0 12px 48px rgba(122,26,46,.15);
      --nh:70px;--fs:16px;--r:12px;--tr:.28s cubic-bezier(.4,0,.2,1);
    }
    [data-theme=dark]{
      --bg:#1a0f07;--surf:#231408;--gold:#f0c84a;--gold-l:#fde68a;--gold-d:#c8860a;
      --mar:#e06080;--mar-l:#f4a0b8;--tx:#fdf0d8;--txm:#d4a870;--txs:#a07850;
      --bd:rgba(240,200,74,.2);--bds:rgba(240,200,74,.4);
      --sh:0 4px 24px rgba(0,0,0,.4);--shl:0 12px 48px rgba(0,0,0,.6);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;font-size:var(--fs)}
    body{font-family:'EB Garamond',Georgia,serif;background:var(--bg);color:var(--tx);line-height:1.7;transition:background var(--tr),color var(--tr)}
    .te{font-family:'Noto Sans Telugu',sans-serif}
    .dev{font-family:'Noto Sans Devanagari',sans-serif}
    .cin{font-family:'Cinzel',serif}

    /* ── NAV ── */
    #nav{position:fixed;top:0;left:0;right:0;z-index:1000;height:var(--nh);
      background:var(--surf);border-bottom:1px solid var(--bd);box-shadow:var(--sh);
      display:flex;align-items:center;padding:0 1.25rem;gap:.5rem;transition:background var(--tr)}
    .logo-btn{display:flex;align-items:center;gap:.65rem;border:none;background:none;
      cursor:pointer;padding:0;text-decoration:none;flex-shrink:0}
    .logo-img{width:42px;height:42px;border-radius:50%}
    .logo-txt{display:flex;flex-direction:column;line-height:1.15;text-align:left}
    .logo-nm{font-family:'Cinzel',serif;font-size:14.5px;font-weight:600;color:var(--gold);letter-spacing:.04em}
    .logo-tg{font-size:10.5px;color:var(--txs);font-style:italic;letter-spacing:.05em}
    .nav-links{display:flex;list-style:none;margin-left:auto;align-items:center}
    .nav-links a{display:block;padding:.3rem .6rem;font-family:'Cinzel',serif;font-size:11px;
      color:var(--txm);text-decoration:none;letter-spacing:.04em;white-space:nowrap;
      border-bottom:2px solid transparent;transition:color var(--tr),border-color var(--tr)}
    .nav-links a:hover,.nav-links a.act{color:var(--gold);border-bottom-color:var(--gold)}
    .nav-r{display:flex;align-items:center;gap:.35rem;margin-left:.6rem;flex-shrink:0}
    .ib{background:none;border:1px solid var(--bd);border-radius:7px;width:32px;height:32px;
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      color:var(--txm);font-size:14px;transition:all var(--tr)}
    .ib:hover{border-color:var(--gold);color:var(--gold)}
    #langToggle{background:none;border:1px solid var(--bd);border-radius:7px;
      padding:.22rem .55rem;cursor:pointer;font-family:'Cinzel',serif;font-size:11px;
      color:var(--txm);transition:all var(--tr);white-space:nowrap}
    #langToggle:hover{border-color:var(--gold);color:var(--gold)}
    .ham{display:none}

    /* ── SETTINGS ── */
    .so{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.45)}
    .so.on{display:block}
    .sp{position:fixed;top:var(--nh);right:0;bottom:0;width:290px;background:var(--surf);
      border-left:1px solid var(--bds);padding:1.6rem 1.4rem;overflow-y:auto;z-index:2001;
      transform:translateX(100%);transition:transform var(--tr)}
    .sp.on{transform:translateX(0)}
    .sp h3{font-family:'Cinzel',serif;font-size:14px;color:var(--gold);
      margin-bottom:1.4rem;letter-spacing:.05em}
    .sg{margin-bottom:1.4rem}
    .sg label{display:block;font-size:11.5px;color:var(--txm);margin-bottom:.4rem;font-style:italic}
    .sg input[type=range]{width:100%;accent-color:var(--gold)}
    .swatches{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.35rem}
    .sw{width:24px;height:24px;border-radius:50%;cursor:pointer;
      border:2px solid transparent;transition:transform .2s}
    .sw:hover,.sw.on{transform:scale(1.25);border-color:var(--tx)}
    .tr-row{display:flex;gap:.35rem;margin-top:.35rem}
    .to{flex:1;padding:.3rem;border:1px solid var(--bd);border-radius:7px;cursor:pointer;
      font-size:11px;text-align:center;color:var(--txm);background:none;
      font-family:'Cinzel',serif;transition:all var(--tr)}
    .to.on,.to:hover{border-color:var(--gold);color:var(--gold);background:rgba(200,134,10,.07)}
    .lb-row{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.35rem}
    .lb{padding:.22rem .55rem;border:1px solid var(--bd);border-radius:7px;cursor:pointer;
      font-size:11.5px;color:var(--txm);background:none;font-family:'Cinzel',serif;
      transition:all var(--tr)}
    .lb.on,.lb:hover{border-color:var(--gold);color:var(--gold);background:rgba(200,134,10,.07)}

    /* ── MAIN ── */
    main{padding-top:var(--nh)}
    .sec{padding:4.5rem 0}
    .alt{background:var(--surf)}
    .ct{max-width:1100px;margin:0 auto;padding:0 2rem}
    .st{font-family:'Cinzel',serif;font-size:clamp(20px,2.8vw,28px);
      color:var(--gold-d);margin-bottom:.35rem;letter-spacing:.03em}
    [data-theme=dark] .st{color:var(--gold)}
    .dv{width:52px;height:3px;background:linear-gradient(90deg,var(--gold),transparent);
      margin:.5rem 0 2rem;border-radius:2px}

    /* ── HERO ── */
    #home{min-height:100vh;display:flex;align-items:center;background:var(--surf);
      position:relative;overflow:hidden}
    .hpat{position:absolute;inset:0;opacity:.04;
      background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l4 12h12l-10 8 4 12-10-8-10 8 4-12-10-8h12z' fill='%23c8860a'/%3E%3C/svg%3E")}
    .hi{display:flex;align-items:center;gap:3.5rem;position:relative;padding:2rem 0}
    .hphoto{flex-shrink:0;width:260px;height:260px;border-radius:50%;
      border:4px solid var(--gold);box-shadow:0 0 0 8px rgba(200,134,10,.1),var(--shl);
      overflow:hidden;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,var(--gold-l) 0%,var(--mar) 100%)}
    .hphoto svg{width:100%;height:100%}
    .hgreet{font-size:11.5px;letter-spacing:.13em;color:var(--mar);text-transform:uppercase;
      margin-bottom:.55rem;font-family:'Cinzel',serif}
    [data-theme=dark] .hgreet{color:var(--mar-l)}
    .hname{font-family:'Cinzel',serif;font-size:clamp(28px,4.5vw,50px);font-weight:700;
      color:var(--gold-d);line-height:1.1;margin-bottom:.35rem}
    [data-theme=dark] .hname{color:var(--gold-l)}
    .hsub{font-size:1.08rem;color:var(--mar);font-style:italic;margin-bottom:1.1rem}
    [data-theme=dark] .hsub{color:var(--mar-l)}
    .hdesc{max-width:510px;color:var(--txm);font-size:1rem;margin-bottom:1.5rem;line-height:1.75}
    .hbadges{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:1.5rem}
    .badge{padding:.26rem .8rem;border-radius:100px;border:1px solid var(--bds);
      font-size:11px;color:var(--gold-d);background:rgba(200,134,10,.07);
      font-family:'Cinzel',serif;letter-spacing:.03em}
    [data-theme=dark] .badge{color:var(--gold-l)}
    .hcta{display:flex;gap:.8rem;flex-wrap:wrap}
    .bp{padding:.65rem 1.75rem;border-radius:var(--r);background:var(--gold);color:#fff;
      font-family:'Cinzel',serif;font-size:12px;letter-spacing:.07em;text-decoration:none;
      border:none;cursor:pointer;transition:all var(--tr)}
    .bp:hover{background:var(--gold-d);transform:translateY(-2px);box-shadow:var(--sh)}
    .bo{padding:.65rem 1.75rem;border-radius:var(--r);border:1px solid var(--bds);
      color:var(--gold);font-family:'Cinzel',serif;font-size:12px;letter-spacing:.07em;
      text-decoration:none;background:none;cursor:pointer;transition:all var(--tr)}
    .bo:hover{background:rgba(200,134,10,.08);transform:translateY(-2px)}
    .scroll-hint{position:absolute;bottom:1.75rem;left:50%;transform:translateX(-50%);
      font-size:11px;color:var(--txs);display:flex;flex-direction:column;align-items:center;
      gap:.3rem;animation:bob 2s infinite}
    @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(6px)}}

    /* ── ABOUT ── */
    .agrid{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem;align-items:start}
    .qb{border-left:3px solid var(--gold);padding-left:1rem;margin:1.25rem 0}
    .qb .qs{font-size:1rem;color:var(--gold-d);margin-bottom:.2rem}
    [data-theme=dark] .qb .qs{color:var(--gold)}
    .qb .qi{font-size:12px;color:var(--txs);margin-bottom:.15rem}
    .qb .qt{font-family:'Noto Sans Telugu',sans-serif;font-size:.83rem;color:var(--txm)}
    .qb .qe{font-style:italic;font-size:.83rem;color:var(--txs)}
    .ac{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);
      padding:1.25rem;margin-bottom:.8rem;transition:box-shadow var(--tr)}
    .ac:hover{box-shadow:var(--sh)}
    .ac h4{font-family:'Cinzel',serif;color:var(--gold-d);font-size:12.5px;
      margin-bottom:.5rem;letter-spacing:.04em}
    [data-theme=dark] .ac h4{color:var(--gold)}
    .ac p{font-size:.86rem;color:var(--txm);line-height:1.8}

    /* ── PROFILE ── */
    .agr{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1.2rem}
    .acard{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);
      padding:1.4rem 1.5rem;transition:all var(--tr);position:relative;overflow:hidden}
    .acard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
      background:linear-gradient(90deg,var(--gold),var(--mar))}
    .acard:hover{transform:translateY(-4px);box-shadow:var(--shl)}
    .ai{font-size:26px;margin-bottom:.55rem}
    .at{font-family:'Cinzel',serif;font-size:13.5px;color:var(--gold-d);margin-bottom:.3rem}
    [data-theme=dark] .at{color:var(--gold)}
    .ad{font-size:12.5px;color:var(--txm);line-height:1.7}
    .ay{margin-top:.55rem;font-size:10.5px;color:var(--txs);font-style:italic}

    /* ── CREDITS ── */
    .cgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.8rem}
    .ci{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:.85rem 1rem}
    .cn{font-family:'Cinzel',serif;font-size:13px;color:var(--gold-d)}
    [data-theme=dark] .cn{color:var(--gold)}
    .cr{font-size:11.5px;color:var(--txs);font-style:italic;margin-top:.15rem}

    /* ── EVENTS ── */
    .tl{position:relative;padding-left:1.85rem}
    .tl::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;
      background:linear-gradient(to bottom,var(--gold),transparent)}
    .tli{position:relative;margin-bottom:2rem}
    .tld{position:absolute;left:-1.85rem;top:.28rem;width:13px;height:13px;
      border-radius:50%;background:var(--gold);border:2px solid var(--surf);
      box-shadow:0 0 0 3px rgba(200,134,10,.2)}
    .tldate{font-size:11px;color:var(--txs);font-style:italic;margin-bottom:.2rem}
    .tltit{font-family:'Cinzel',serif;font-size:14px;color:var(--gold-d);margin-bottom:.3rem}
    [data-theme=dark] .tltit{color:var(--gold)}
    .tldesc{font-size:13px;color:var(--txm);line-height:1.7}

    /* ── PARAYANA ── */
    .pgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1.2rem}
    .pc{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);
      padding:1.5rem;transition:box-shadow var(--tr)}
    .pc:hover{box-shadow:var(--sh)}
    .pc h3{font-family:'Cinzel',serif;color:var(--gold-d);font-size:14.5px;margin-bottom:.6rem}
    [data-theme=dark] .pc h3{color:var(--gold)}
    .stabs{display:flex;gap:.3rem;margin-bottom:.6rem}
    .stab{padding:.18rem .5rem;border-radius:6px;font-size:10.5px;border:1px solid var(--bd);
      cursor:pointer;color:var(--txs);background:none;transition:all var(--tr)}
    .stab.on,.stab:hover{border-color:var(--gold);color:var(--gold);background:rgba(200,134,10,.07)}
    .sv{font-size:14px;color:var(--mar);line-height:2;white-space:pre-line}
    [data-theme=dark] .sv{color:var(--mar-l)}
    .sv.iast{font-style:italic;font-size:12.5px;color:var(--txm)}
    .sattr{font-size:11.5px;color:var(--txs);font-style:italic;margin-top:.55rem;line-height:1.5}

    /* ── SUPPORT ── */
    .spgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.2rem}
    .spc{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);
      padding:1.6rem;text-align:center;transition:all var(--tr)}
    .spc:hover{box-shadow:var(--sh);transform:translateY(-3px)}
    .spi{font-size:30px;margin-bottom:.8rem}
    .spc h3{font-family:'Cinzel',serif;color:var(--gold-d);font-size:14.5px;margin-bottom:.6rem}
    [data-theme=dark] .spc h3{color:var(--gold)}
    .spc p{font-size:12.5px;color:var(--txm);line-height:1.75}

    /* ── TESTIMONIALS ── */
    .tegr{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1.2rem}
    .tec{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);
      padding:1.5rem;transition:box-shadow var(--tr)}
    .tec:hover{box-shadow:var(--sh)}
    .qm{font-family:'Cinzel',serif;font-size:52px;color:var(--gold);
      opacity:.18;line-height:.75;margin-bottom:.35rem}
    .tetx{font-style:italic;color:var(--txm);font-size:.95rem;line-height:1.8;margin-bottom:.8rem}
    .teby{font-family:'Cinzel',serif;font-size:12px;color:var(--gold-d)}
    [data-theme=dark] .teby{color:var(--gold)}
    .tero{font-size:11px;color:var(--txs);font-style:italic}

    /* ── YOUTUBE ── */
    .yt-ch{display:flex;align-items:center;gap:.7rem;background:var(--bg);
      border:1px solid var(--bd);border-radius:var(--r);padding:1rem 1.3rem;
      text-decoration:none;color:var(--tx);transition:all var(--tr);margin-bottom:1.25rem}
    .yt-ch:hover{border-color:var(--gold);box-shadow:var(--sh)}
    .yt-chn{font-family:'Cinzel',serif;font-size:13.5px;color:var(--gold-d)}
    [data-theme=dark] .yt-chn{color:var(--gold)}
    .yt-chs{font-size:11px;color:var(--txs)}
    .yt-bh{display:flex;align-items:center;gap:.9rem;background:var(--surf);
      border:2px solid var(--bds);border-radius:var(--r);padding:1.1rem 1.4rem;
      text-decoration:none;color:var(--tx);transition:all var(--tr);margin-bottom:1.6rem}
    .yt-bh:hover{border-color:var(--gold);box-shadow:var(--shl)}
    .yt-bhi{font-size:32px}
    .yt-bht{font-family:'Cinzel',serif;font-size:15px;color:var(--gold-d);margin-bottom:.2rem}
    [data-theme=dark] .yt-bht{color:var(--gold)}
    .yt-bhd{font-size:12.5px;color:var(--txm)}
    .yt-gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.2rem}
    .yt-c{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);
      overflow:hidden;cursor:pointer;transition:all var(--tr)}
    .yt-c:hover{transform:translateY(-4px);box-shadow:var(--shl)}
    .yt-th{width:100%;aspect-ratio:16/9;
      background:linear-gradient(135deg,var(--mar) 0%,var(--gold-d) 100%);
      display:flex;align-items:center;justify-content:center;
      font-size:38px;color:rgba(255,255,255,.85)}
    .yt-inf{padding:.85rem 1rem}
    .yt-vt{font-family:'Cinzel',serif;font-size:13px;color:var(--tx);margin-bottom:.25rem}
    .yt-vm{font-size:11.5px;color:var(--txs)}

    /* ── CONTACT ── */
    .cogr{display:grid;grid-template-columns:1fr 1fr;gap:2.75rem}
    .cof{display:flex;flex-direction:column;gap:.8rem}
    .cof input,.cof textarea{width:100%;padding:.65rem .9rem;background:var(--surf);
      border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);
      font-family:'EB Garamond',serif;font-size:var(--fs);outline:none;
      transition:border-color var(--tr)}
    .cof input:focus,.cof textarea:focus{border-color:var(--gold)}
    .cof textarea{min-height:115px;resize:vertical}
    .coii{display:flex;gap:.6rem;align-items:flex-start;margin-bottom:.8rem}
    .coic{color:var(--gold);font-size:16px;margin-top:2px}

    /* ── FOOTER ── */
    footer{background:var(--surf);border-top:1px solid var(--bd);
      text-align:center;padding:1.6rem 1rem;font-size:12.5px;color:var(--txs)}
    .fsa{font-size:15px;color:var(--gold-d);margin-bottom:.35rem;font-family:'Noto Sans Devanagari',sans-serif}
    [data-theme=dark] .fsa{color:var(--gold)}

    /* ── MOBILE MENU ── */
    .mob{display:none;position:fixed;inset:0;top:var(--nh);z-index:999;
      background:var(--surf);flex-direction:column;padding:1.5rem;gap:.35rem;overflow-y:auto}
    .mob.on{display:flex}
    .mob a{font-family:'Cinzel',serif;font-size:16px;color:var(--tx);text-decoration:none;
      padding:.6rem 0;border-bottom:1px solid var(--bd);letter-spacing:.05em}
    .mob a:hover{color:var(--gold)}

    /* ── FADE UP ── */
    .fu{opacity:0;transform:translateY(18px);transition:opacity .5s,transform .5s}
    .fu.vis{opacity:1;transform:none}
    .fu:nth-child(2){transition-delay:.07s}
    .fu:nth-child(3){transition-delay:.14s}
    .fu:nth-child(4){transition-delay:.21s}
    .fu:nth-child(5){transition-delay:.28s}
    .fu:nth-child(6){transition-delay:.35s}

    /* ── RESPONSIVE ── */
    @media(max-width:900px){
      .nav-links{display:none}.ham{display:flex}
      .hi{flex-direction:column;text-align:center;gap:1.75rem;padding:1.5rem 0}
      .hphoto{width:190px;height:190px}
      .hbadges,.hcta{justify-content:center}
      .agrid,.cogr{grid-template-columns:1fr}
    }
    @media(max-width:580px){
      .ct{padding:0 1rem}.sec{padding:3rem 0}
    }
  </style>
</head>
<body>

<!-- SETTINGS OVERLAY -->
<div class="so" id="so" onclick="if(event.target===this)closeS()"></div>
<div class="sp" id="sp">
  <h3 id="s-title">⚙ Settings</h3>
  <div class="sg">
    <label id="s-thlbl">Theme</label>
    <div class="tr-row">
      <button class="to on" id="tL" onclick="setTheme('light')">☀ Light</button>
      <button class="to" id="tD" onclick="setTheme('dark')">☽ Dark</button>
    </div>
  </div>
  <div class="sg">
    <label>Font Size — <span id="fsv">16</span>px</label>
    <input type="range" min="13" max="22" value="16" id="fsr" oninput="setFS(this.value)"/>
  </div>
  <div class="sg">
    <label id="s-aclbl">Accent Colour</label>
    <div class="swatches">
      <div class="sw on"  style="background:#c8860a" onclick="setAcc('#c8860a','#8b5e06','#f0c84a',this)"></div>
      <div class="sw"     style="background:#b07020" onclick="setAcc('#b07020','#7a4e15','#e0a020',this)"></div>
      <div class="sw"     style="background:#7a1a2e" onclick="setAcc('#7a1a2e','#55111e','#c4405a',this)"></div>

ribution": "Opening śloka — performed at Sydney Murugan Temple"}, {"id": "ls", "title": "Lalitā Sahasranāma", "te": "శ్రీమాతా శ్రీమహారాజ్ఞీ శ్రీమత్సింహాసనేశ్వరీ ।\nచిదగ్నికుండసంభూతా దేవకార్యసముద్యతా ॥", "dev": "श्रीमाता श्रीमहाराज्ञी श्रीमत्सिंहासनेश्वरी ।\nचिदग्निकुण्डसम्भूता देवकार्यसमुद्यता ॥", "iast": "śrīmātā śrīmahārājñī śrīmatsinhāsaneśvarī |\ncidagnikuṇḍasambhūtā devakāryasamudyatā ||", "attribution": "Opening nāmas — performed at Sydney Murugan Temple"}, {"id": "sl", "title": "Soundaryalaharī · 100 Verses", "te": "శివః శక్త్యా యుక్తో యది భవతి శక్తః ప్రభవితుం\nన చేదేవం దేవో న ఖలు కుశలః స్పందితుమపి ।", "dev": "शिवः शक्त्या युक्तो यदि भवति शक्तः प्रभवितुं\nन चेदेवं देवो न खलु कुशलः स्पन्दितुमपि ।", "iast": "śivaḥ śaktyā yukto yadi bhavati śaktaḥ prabhavituṁ\nna cedevaṁ devo na khalu kuśalaḥ spanditum api |", "attribution": "Opening verse by Ādi Śaṅkarācārya — Navarātri, Ayyappa Temple"}, {"id": "sg", "title": "Saṅkaṭanāśana Ganeśa Stotram", "te": "ప్రణమ్య శిరసా దేవం గౌరీపుత్రం వినాయకమ్ ।\nభక్తావాసం స్మరేన్నిత్యమాయుఃకామార్థసిద్ధయే ॥", "dev": "प्रणम्य शिरसा देवं गौरीपुत्रं विनायकम् ।\nभक्तावासं स्मरेन्नित्यमायुःकामार्थसिद्धये ॥", "iast": "praṇamya śirasā devaṁ gaurīputraṁ vināyakam |\nbhaktāvāsaṁ smaren nityam āyuḥkāmārthasiddhaye ||", "attribution": "Offered in person to Vaddiparti Padmakar, Samavedam Shanmukha Sharma & Madugula Naga Phani Sharma"}]}, "support": {"section_title": "Support & Sponsor", "intro": "Encouraging Karthikeya's spiritual and academic journey is a noble act of dharma. Your support helps him participate in competitions, attend events, and create more content.", "cards": [{"icon": "🙏", "title": "Blessings & Encouragement", "desc": "Send your blessings, words of encouragement, or share his achievements with your community. Every message inspires him forward."}, {"icon": "📚", "title": "Sponsor Education", "desc": "Support Sanskrit exam registrations, study materials, books, and participation in competitions across Australia and India."}, {"icon": "🎬", "title": "Subscribe & Share", "desc": "Subscribe to his YouTube channel @samskruti.info.1 and share his videos to spread the beauty of Sanskrit and Sanātana Dharma."}, {"icon": "🤝", "title": "Invite to Events", "desc": "Invite Karthikeya to perform pārāyaṇa, give a talk, or participate in competitions and festivals at your temple or organisation."}]}, "testimonials": {"section_title": "Testimonials", "list": [{"text": "Karthikeya's recitation of Śivapadams was remarkable. The clarity of pronunciation and the depth of feeling in one so young is truly a blessing. May he continue to illuminate the tradition.", "by": "Samavedam Shanmukha Sharma", "role": "Renowned Telugu Scholar & Poet · Sydney Visit"}, {"text": "It is heartening to see the next generation embracing Sanskrit with such commitment. His performance in the Olympiad reflects both natural talent and disciplined practice.", "by": "Central Sanskrit University", "role": "Sanskrit Olympiad — Australia Rank 1"}, {"text": "During Navarātri, Karthikeya's pārāyaṇa of Soundaryalaharī filled the temple with a sacred vibration. Such dedication from a 10-year-old is truly divine grace.", "by": "Sydney Ayyappa Temple", "role": "Navarātri Pārāyaṇa"}]}, "youtube": {"section_title": "YouTube Channel", "channel_name": "Samskruti · @samskruti.info.1", "channel_sub": "Sanskrit · Telugu · Devotional · Pārāyaṇa · Discourses", "channel_url": "https://www.youtube.com/@samskruti.info.1", "bharatam_title": "Bhāratam Laghu Prasaṅgālu", "bharatam_desc": "Short discourses on the Mahābhārata — watch the full playlist", "bharatam_url": "https://www.youtube.com/watch?v=xB1CT8539J0&list=PL-V59KU-Q6hdZckKaiR-W8U7WNjyCiUiZ", "videos": [{"title": "Bhagavad Gītā Pārāyaṇa", "meta": "700 Verses · Karthikeya Pidaparthy"}, {"title": "Sanskrit Recitations", "meta": "Stotras · Sahasranāmas · Hymns"}, {"title": "Bhāratam Laghu Prasaṅgālu", "meta": "Mahābhārata Discourses · Series"}]}, "contact": {"section_title": "Contact", "intro": "To invi const LANGS = ['en','te','sa'];
const LLBL  = {en:'EN',te:'తె',sa:'सं'};
let CL = 'en';   // current lang
let T  = {};     // current translation object

// ── SWITCH LANGUAGE ──────────────────────────────────────────
function switchLang(lang, btn) {
  CL = lang;
  T  = ALL[lang] || ALL['en'];
  // update settings panel buttons
  document.querySelectorAll('.lb').forEach(b => b.classList.remove('on'));
  if (btn) btn.classList.add('on');
  // update nav quick-toggle label
  document.getElementById('langToggle').textContent = LLBL[lang];
  // set html lang attr
  document.documentElement.lang = {en:'en', te:'te', sa:'sa'}[lang] || 'en';
  renderAll();
  localStorage.setItem('kp-lang', lang);
}

function cycleLang() {
  const idx = (LANGS.indexOf(CL) + 1) % LANGS.length;
  const btns = document.querySelectorAll('.lb');
  switchLang(LANGS[idx], btns[idx]);
}

  rNav(); rHero(); rAbout(); rProfile(); rCredits();
  rEvents(); rParayana(); rSupport(); rTestimonials();
  rYouTube(); rContact(); rFooter(); rSettings();
  reObsFU();
}

function showSc(btn, id, idx) {
  btn.parentElement.querySelectorAll('.stab').forEach((t,i) => {

    const v = document.getElementById('v'+id+i);
    if(v) v.style.display = i===idx ? '' : 'none';

}

// ── THEME ────────────────────────────────────────────────────
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t==='dark'?'dark':'');
  document.getElementById('tL').classList.toggle('on', t==='light');
  document.getElementById('tD').classList.toggle('on', t==='dark');
  localStorage.setItem('kp-theme', t);
}

// ── FONT SIZE ────────────────────────────────────────────────
function setFS(v) {
  document.documentElement.style.setProperty('--fs', v+'px');
  document.getElementById('fsv').textContent = v;
  localStorage.setItem('kp-fs', v);
}

// ── ACCENT COLOUR ────────────────────────────────────────────
function setAcc(g, gd, gl, el) {
  const r = document.documentElement;
  r.style.setProperty('--gold', g);
  r.style.setProperty('--gold-d', gd);
  r.style.setProperty('--gold-l', gl);
  document.querySelectorAll('.sw').forEach(s => s.classList.remove('on'));
  if(el) el.classList.add('on');
}

// ── NAVIGATION ───────────────────────────────────────────────
function goSec(id) { document.getElementById(id)?.scrollIntoView({behavior:'smooth'}); }
function mNav(id)  { document.getElementById('mob').classList.remove('on'); setTimeout(()=>goSec(id),80); }
function toggleMob(){ document.getElementById('mob').classList.toggle('on'); }

// ── ACTIVE NAV HIGHLIGHT ─────────────────────────────────────
const secIds = ['home','about','profile','credits','events','parayana','support','testimonials','youtube','contact'];
new IntersectionObserver(entries => {
  entries.forEach(e => {
    if(e.isIntersecting)
      document.querySelectorAll('[data-n]').forEach(a =>
        a.classList.toggle('act', a.getAttribute('data-n')===e.target.id));
  });
}, {threshold:0.35}).observe || secIds.forEach(id => {
  const el = document.getElementById(id); if(el)
  new IntersectionObserver(entries => {
    if(entries[0].isIntersecting)
      document.querySelectorAll('[data-n]').forEach(a =>
        a.classList.toggle('act', a.getAttribute('data-n')===id));
  }, {threshold:0.35}).observe(el);
});
// correct approach:
secIds.forEach(id => {
  const el = document.getElementById(id); if(!el) return;
  new IntersectionObserver(entries => {
    if(entries[0].isIntersecting)
      document.querySelectorAll('[data-n]').forEach(a =>
        a.classList.toggle('act', a.getAttribute('data-n')===id));
  }, {threshold:0.35}).observe(el);
});

// ── CONTACT FORM ─────────────────────────────────────────────
function subForm(e) {
  e.preventDefault();
  const tk = document.getElementById('ftk');
  if(tk) tk.style.display='block';
  e.target.reset();
}

// ── FADE-UP OBSERVER ─────────────────────────────────────────
function reObsFU() {
  const obs = new IntersectionObserver(entries =>
    entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('vis'); }),
    {threshold:0.07});
  document.querySelectorAll('.fu').forEach(el => { el.classList.remove('vis'); obs.observe(el); });
}

// ── INIT ─────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  // Restore theme
  const th = localStorage.getItem('kp-theme');
  if(th) setTheme(th);
  // Restore font size
  const fs = localStorage.getItem('kp-fs');
  if(fs) { setFS(fs); document.getElementById('fsr').value=fs; }
  // Restore language — default en
  const lg = localStorage.getItem('kp-lang') || 'en';
  const lbBtns = document.querySelectorAll('.lb');
  const li = LANGS.indexOf(lg);
  switchLang(lg, li>=0 ? lbBtns[li] : lbBtns[0]);
});
</script>
