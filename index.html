<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Karthikeya Pidaparthy — Samskruti</title>
<meta name="description" content="Karthikeya Pidaparthy — Sanskrit scholar, Bhagavad Gita Gold Medalist, Sanskrit Olympiad 1st in Australia. Sydney, Australia."/>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Noto+Sans+Telugu:wght@300;400;500;600&family=Noto+Sans+Devanagari:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── Accent / gold ── */
  --gold:#c07808;--gold-l:#f0b030;--gold-xl:#faedc8;
  --mar:#6b1528;--mar-l:#c4405a;
  /* ── Text colours ── Rāmāyaṇam (default) — deep amber ink on warm parchment */
  --tx-head:#280c00;          /* headings — deep ink */
  --tx:#1e0a00;               /* body text — near black, warm toned */
  --txm:#3a1800;              /* medium body */
  --txs:#7a4818;              /* secondary / captions — amber-brown */
  --txf:#b07838;              /* faint / placeholders */
  /* ── Backgrounds ── */
  --bg:#fdf3d0;--surf:#fffadf;--surf2:#fffef0;
  /* ── Footer ── */
  --ft-bg:#120600;            /* near-black for footer */
  --ft-tx:#faedc8;            /* cream footer text */
  --ft-tx2:rgba(250,237,200,.65); /* dim footer secondary */
  /* ── Borders / shadows ── */
  --bd:#c0780822;--bds:#c0780855;
  --sh:0 2px 14px rgba(100,60,0,.10);
  --shl:0 8px 32px rgba(100,60,0,.18);
  /* ── Font ── */
  --font-body:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-head:'Cinzel',serif;
  --font-deco:'Cinzel Decorative',serif;
  --font-te:'Noto Sans Telugu',sans-serif;
  --font-dev:'Noto Sans Devanagari',sans-serif;
}
html{scroll-behavior:smooth;font-size:1.125rem}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.75}
body.te{font-family:'Noto Sans Telugu',sans-serif;font-size:1.0556rem}
body.sa{font-family:'Noto Sans Devanagari',sans-serif;font-size:1.0556rem}

/* NAV */
#nav{position:sticky;top:0;z-index:100;height:64px;background:rgba(250,245,235,.97);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;padding:0 1.5rem;gap:8px;box-shadow:var(--sh)}
.logo-btn{display:flex;align-items:center;gap:8px;border:none;background:none;cursor:pointer;flex-shrink:0}
.logo-om{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--gold-xl),#f5d090);
  border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;
  font-family:'Noto Sans Devanagari',sans-serif;font-size:1.0556rem;color:var(--gold);flex-shrink:0}
.logo-nm{font-family:'Cinzel Decorative',serif;font-size:0.7222rem;font-weight:700;color:var(--gold);
  letter-spacing:.04em;line-height:1.2;display:block}
.logo-tg{font-size:0.556rem;color:var(--txs);letter-spacing:.04em;display:block}
.nav-links{display:flex;margin-left:auto;align-items:center;overflow:hidden;gap:0}
.nl{
  padding:4px 10px;
  font-family:var(--font-head);
  font-size:0.639rem;
  color:var(--txs);
  letter-spacing:.05em;
  white-space:nowrap;
  cursor:pointer;
  border:1px solid transparent;
  background:transparent;
  border-radius:20px;          /* pill shape */
  transition:all .18s ease;
  margin:0 1px;
  line-height:1.6;
}
.nl:hover{
  color:var(--gold);
  background:var(--gold-xl);
  border-color:var(--bds);
  transform:scale(1.05);
}
.nl.active{
  color:#fff;
  background:var(--gold);
  border-color:var(--gold);
  font-weight:600;
  box-shadow:0 2px 8px rgba(184,115,10,.35);
}
.nav-r{display:flex;align-items:center;gap:6px;margin-left:8px;flex-shrink:0}
/* Language pill — 3 visible buttons */
.lang-pill{display:flex;border:1px solid var(--bds);border-radius:20px;overflow:hidden;flex-shrink:0}
.lbtn{padding:4px 10px;font-family:'Cinzel',serif;font-size:0.667rem;letter-spacing:.06em;
  cursor:pointer;border:none;border-right:1px solid var(--bd);
  background:transparent;color:var(--txs);transition:all .2s;font-weight:400}
.lbtn:last-child{border-right:none}
.lbtn.active{background:var(--gold);color:#fff;font-weight:700}
.lbtn:not(.active):hover{background:var(--gold-xl);color:var(--gold)}
.ib{width:32px;height:32px;border-radius:8px;border:1px solid var(--bd);
  background:none;cursor:pointer;font-size:0.7778rem;color:var(--txs);
  display:flex;align-items:center;justify-content:center;transition:all .2s}
.ib:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-xl)}
#settBtn{width:38px;height:38px;font-size:1.1rem}
.hamburger{display:none}

/* MOBILE NAV */
.mob-nav{display:none;position:fixed;inset:0;top:64px;z-index:90;
  background:var(--surf);flex-direction:column;padding:1.5rem;gap:.3rem;overflow-y:auto}
.mob-nav.open{display:flex}
.mob-nav .nl{font-size:0.9444rem;padding:.6rem 0;border-bottom:1px solid var(--bd);letter-spacing:.06em}

/* SETTINGS PANEL */
.s-overlay{display:none;position:fixed;inset:0;z-index:200}
.s-overlay.open{display:block}
.s-panel{position:fixed;top:64px;right:0;width:255px;background:var(--surf);
  border-left:2px solid var(--bds);padding:18px 16px;
  box-shadow:-4px 0 20px rgba(0,0,0,.1);height:calc(100vh - 64px);
  overflow-y:auto;z-index:201;transform:translateX(100%);transition:transform .25s}
.s-panel.open{transform:translateX(0)}
.s-panel h3{font-family:'Cinzel',serif;font-size:0.75rem;color:var(--gold);
  margin-bottom:16px;letter-spacing:.05em}
.sg{margin-bottom:16px}
.sg label{display:block;font-size:0.667rem;color:var(--txs);margin-bottom:6px;font-style:italic}
.sg input[type=range]{width:100%;accent-color:var(--gold);cursor:pointer}
.slang-row{display:flex;flex-direction:column;gap:5px}
.slb{padding:7px 11px;border:1px solid var(--bd);border-radius:8px;cursor:pointer;
  text-align:left;font-size:0.6944rem;font-family:'Cinzel',serif;
  background:transparent;color:var(--txs);transition:all .2s;
  display:flex;align-items:center;gap:8px}
.slb:hover{border-color:var(--bds);color:var(--gold);background:var(--gold-xl)}
.slb.active{border-color:var(--gold);background:var(--gold);color:#fff;font-weight:700}
.color-swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;max-width:220px}
.sw{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .2s}
.sw:hover,.sw.active{transform:scale(1.28);border-color:var(--tx)}

/* LAYOUT */
main{padding-top:0}
.sec{padding:52px 0;background:var(--bg)}
.sec.alt{background:var(--surf)}
.ct{max-width:1080px;margin:0 auto;padding:0 1.75rem}
.st{font-family:'Cinzel',serif;font-size:clamp(19px,2.5vw,27px);
  color:var(--tx-head);letter-spacing:.03em;margin-bottom:8px}
.dv{width:52px;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-l),transparent);
  margin-bottom:28px;border-radius:2px}

/* HERO */
#home{min-height:100vh;display:flex;align-items:center;padding-top:64px;
  background:linear-gradient(155deg,var(--surf) 60%,var(--gold-xl) 100%);position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;opacity:.05;
  background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l4 12h12l-10 8 4 12-10-8-10 8 4-12-10-8h12z' fill='%23b8730a'/%3E%3C/svg%3E")}
.hero-inner{display:flex;align-items:center;gap:52px;padding:2.5rem 0;position:relative}
.avatar-ring{flex-shrink:0;width:250px;height:250px;border-radius:50%;
  border:4px solid var(--gold);box-shadow:0 16px 48px rgba(122,77,6,.18);
  overflow:hidden;background:linear-gradient(135deg,var(--gold-xl),#f0b040)}
.avatar-ring svg,.avatar-ring img{width:100%;height:100%;object-fit:cover;display:block}
.hgreet{font-family:'Cinzel',serif;font-size:0.667rem;letter-spacing:.18em;color:var(--mar);
  text-transform:uppercase;margin-bottom:10px}
.hname{font-family:'Cinzel Decorative',serif;font-size:clamp(26px,4vw,46px);
  font-weight:700;color:var(--tx-head);line-height:1.1;margin-bottom:8px}
.hloc{font-family:'Cinzel',serif;font-size:0.7222rem;color:var(--mar);font-style:italic;margin-bottom:16px}
.hdesc{max-width:510px;color:var(--txm);font-size:0.8056rem;margin-bottom:20px;line-height:1.85}
.hbadges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:20px}
.badge{padding:3px 11px;border-radius:100px;border:1px solid var(--bds);font-size:0.667rem;
  color:var(--tx-head);background:var(--gold-xl);font-family:'Cinzel',serif;letter-spacing:.03em}
.hcta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn-pri{padding:9px 22px;border-radius:10px;background:var(--gold);color:#fff;border:none;
  font-family:'Cinzel',serif;font-size:0.694rem;letter-spacing:.07em;cursor:pointer;
  box-shadow:0 2px 10px rgba(184,115,10,.4);transition:all .2s}
.btn-pri:hover{background:#7a4d06;transform:translateY(-2px)}
.btn-out{padding:9px 22px;border-radius:10px;border:1.5px solid var(--bds);color:var(--gold);
  font-family:'Cinzel',serif;font-size:0.694rem;letter-spacing:.07em;
  background:none;cursor:pointer;text-decoration:none;display:inline-block;transition:all .2s}
.btn-out:hover{background:var(--gold-xl);transform:translateY(-2px)}

/* ABOUT */
.agrid{display:grid;grid-template-columns:1.1fr 1fr;gap:2.75rem;align-items:start}
.qb{border-left:3px solid var(--gold);padding:11px 14px;
  background:linear-gradient(90deg,var(--gold-xl),transparent);
  border-radius:0 10px 10px 0;margin-top:14px}
.qb p{margin-bottom:3px}
.acard{border:1px solid var(--bd);border-radius:12px;padding:15px 18px;margin-bottom:10px;
  background:var(--surf2);transition:all .2s}
.acard:hover{transform:translateX(4px);box-shadow:var(--sh)}
.acard h4{font-family:'Cinzel',serif;color:var(--tx-head);font-size:0.6944rem;margin-bottom:6px;letter-spacing:.05em}
.acard p{font-size:0.6944rem;color:var(--txm);line-height:1.8}

/* PROFILE */
.journey-box{background:var(--surf2);border:1px solid var(--bd);border-radius:14px;
  padding:26px 30px;margin-bottom:28px;border-left:4px solid var(--gold)}
.journey-box h3{font-family:'Cinzel',serif;color:var(--tx-head);font-size:0.8889rem;margin-bottom:12px}
.journey-text{font-size:0.75rem;color:var(--txm);line-height:1.92;white-space:pre-line}
.exam-section{margin-bottom:28px}
.exam-section h4{font-family:'Cinzel',serif;font-size:0.7778rem;color:var(--tx-head);margin-bottom:10px}
.exam-table{width:100%;border-collapse:collapse;font-size:0.7222rem;
  border-radius:10px;overflow:hidden;border:1px solid var(--bd)}
.exam-table th{background:var(--gold);color:#fff;font-family:'Cinzel',serif;font-size:10px;
  padding:9px 12px;text-align:left;letter-spacing:.06em}
.exam-table td{padding:9px 12px;border-bottom:1px solid var(--bd);color:var(--txm)}
.exam-table tr:last-child td{border-bottom:none}
.exam-table tr:nth-child(even) td{background:var(--surf2)}
.exam-table .score{font-family:'Cinzel',serif;font-weight:700;color:var(--gold)}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:12px}
.ach-card{background:var(--surf2);border:1px solid var(--bd);border-radius:12px;
  padding:17px 19px;position:relative;overflow:hidden;transition:all .2s}
.ach-card:hover{transform:translateY(-4px);box-shadow:var(--shl);border-color:var(--bds)}
.ach-icon{font-size:1.3333rem;margin-bottom:6px}
.ach-title{font-family:'Cinzel',serif;font-size:0.7222rem;color:var(--tx-head);margin-bottom:5px;line-height:1.4}
.ach-desc{font-size:0.6667rem;color:var(--txm);line-height:1.75}
.ach-year{margin-top:8px;font-size:10.5px;color:var(--txf);font-style:italic;
  padding-top:7px;border-top:1px solid var(--bd)}
.cert-section{margin-top:32px}
.cert-section h3{font-family:'Cinzel',serif;font-size:0.7778rem;color:var(--tx-head);margin-bottom:14px}
.cert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.cert-ph{aspect-ratio:4/3;border:2px dashed var(--bds);border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;background:var(--gold-xl);cursor:pointer;transition:all .2s}
.cert-ph:hover{background:#f5d898;border-color:var(--gold)}
.cert-ph-lbl{font-size:10.5px;font-family:'Cinzel',serif;text-align:center;
  padding:0 6px;color:rgba(122,77,6,.7)}

/* CREDITS */
.cgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.ci{background:var(--surf2);border:1px solid var(--bd);border-radius:10px;
  padding:10px 12px;transition:all .2s}
.ci:hover{border-color:var(--bds);transform:translateY(-2px)}
.ci-name{font-family:'Cinzel',serif;font-size:0.6944rem;color:var(--tx-head);margin-bottom:2px}
.ci-role{font-size:11.5px;color:var(--txs);font-style:italic;line-height:1.5}

/* EVENTS TIMELINE */
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:5px;top:0;bottom:0;width:2px;
  background:linear-gradient(to bottom,var(--gold),var(--mar-l),transparent)}
.tli{position:relative;margin-bottom:26px}
.tl-dot{position:absolute;left:-22px;top:5px;width:12px;height:12px;border-radius:50%;
  background:var(--gold);border:2px solid var(--bg);box-shadow:0 0 0 3px rgba(184,115,10,.25)}
.tl-date{font-size:11px;color:var(--txf);font-style:italic;margin-bottom:2px;letter-spacing:.04em}
.tl-title{font-family:'Cinzel',serif;font-size:0.75rem;color:var(--tx-head);margin-bottom:4px}
.tl-desc{font-size:0.6944rem;color:var(--txm);line-height:1.75}
.tl-ph{margin-top:8px;height:40px;border:2px dashed var(--bds);border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:11.5px;
  font-family:'Cinzel',serif;color:rgba(184,115,10,.6);background:var(--gold-xl)}

/* PARAYANA */
.pgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.pc{background:var(--surf2);border:1px solid var(--bd);border-radius:12px;padding:18px 17px}
.pc h3{font-family:'Cinzel',serif;color:var(--tx-head);font-size:0.7778rem;margin-bottom:8px}
.stabs{display:flex;gap:4px;margin-bottom:8px}
.stab{padding:3px 9px;border-radius:20px;font-size:10.5px;font-family:'Cinzel',serif;
  cursor:pointer;border:1px solid var(--bds);background:transparent;color:var(--txs);transition:all .2s}
.stab.active{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:700}
.stab:not(.active):hover{border-color:var(--gold);color:var(--gold);background:var(--gold-xl)}
.sv{color:var(--mar);line-height:2.1;white-space:pre-line;font-size:0.7778rem}
.sv.sv-te{font-family:'Noto Sans Telugu',sans-serif}
.sv.sv-dev{font-family:'Noto Sans Devanagari',sans-serif}
.sv.sv-iast{font-style:italic;font-size:0.6944rem;color:var(--txm);line-height:1.9}
.sattr{font-size:11.5px;color:var(--txs);font-style:italic;margin-top:8px;
  padding-top:7px;border-top:1px solid var(--bd);line-height:1.55}

/* SUPPORT */
.spgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.spc{background:var(--surf2);border:1px solid var(--bd);border-radius:12px;
  padding:22px;text-align:center;transition:all .2s}
.spc:hover{box-shadow:var(--sh);transform:translateY(-3px);border-color:var(--bds)}
.spc .spi{font-size:1.6667rem;margin-bottom:10px}
.spc h3{font-family:'Cinzel',serif;color:var(--tx-head);font-size:0.7778rem;margin-bottom:8px}
.spc p{font-size:0.6944rem;color:var(--txm);line-height:1.8}

/* TESTIMONIALS */
.tegr{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.tec{background:var(--surf2);border:1px solid var(--bd);border-radius:12px;padding:22px;transition:box-shadow .2s}
.tec:hover{box-shadow:var(--sh)}
.tec-qm{font-family:'Cinzel Decorative',serif;font-size:3.0rem;color:var(--gold);
  opacity:.15;line-height:.75;margin-bottom:6px}
.tec-text{font-style:italic;color:var(--txm);font-size:0.75rem;line-height:1.85;margin-bottom:10px}
.tec-by{font-family:'Cinzel',serif;font-size:0.6667rem;color:var(--tx-head);margin-bottom:2px}
.tec-role{font-size:11.5px;color:var(--txs);font-style:italic}

/* YOUTUBE */
.yt-ch{display:flex;align-items:center;gap:10px;background:var(--surf2);
  border:1.5px solid var(--bds);border-radius:12px;padding:14px 18px;
  text-decoration:none;color:inherit;margin-bottom:14px;transition:all .2s}
.yt-ch:hover{border-color:var(--gold);transform:translateY(-2px)}
.yt-chn{font-family:'Cinzel',serif;font-size:0.75rem;color:var(--tx-head);margin-bottom:2px}
.yt-chs{font-size:11.5px;color:var(--txs)}
.yt-bh{display:flex;align-items:center;gap:12px;
  background:linear-gradient(135deg,var(--gold-xl),var(--surf2));
  border:2px solid var(--bds);border-radius:12px;padding:16px 20px;
  text-decoration:none;color:inherit;margin-bottom:22px;transition:all .2s}
.yt-bh:hover{border-color:var(--gold);transform:translateY(-3px)}
.yt-bht{font-family:'Cinzel',serif;font-size:0.8611rem;color:var(--tx-head);margin-bottom:2px}
.yt-bhd{font-size:0.7222rem;color:var(--txm)}
.ytgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px}
.yt-card{background:var(--surf2);border:1px solid var(--bd);border-radius:12px;
  overflow:hidden;text-decoration:none;color:inherit;display:block;transition:all .2s}
.yt-card:hover{transform:translateY(-4px);box-shadow:var(--shl)}
.yt-th{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,var(--mar),var(--gold));
  display:flex;align-items:center;justify-content:center;font-size:2.0rem;color:rgba(255,255,255,.85);
  position:relative;overflow:hidden}
.yt-th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.92}
.yt-th span{position:relative;z-index:1;width:48px;height:48px;background:rgba(0,0,0,.55);
  border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.yt-inf{padding:10px 12px}
.yt-vt{font-family:'Cinzel',serif;font-size:0.6944rem;color:var(--tx);margin-bottom:3px}
.yt-vm{font-size:11.5px;color:var(--txs)}

/* CONTACT */
.cogr{display:grid;grid-template-columns:1fr 1.1fr;gap:2.75rem}
.cof{display:flex;flex-direction:column;gap:10px}
.cof input,.cof textarea{width:100%;padding:9px 13px;background:var(--surf2);
  border:1.5px solid var(--bd);border-radius:10px;
  font-size:0.7778rem;font-family:inherit;color:var(--tx);outline:none;transition:border-color .2s}
.cof input:focus,.cof textarea:focus{border-color:var(--gold)}
.cof textarea{min-height:110px;resize:vertical}

/* ── FOOTER ── */
footer{
  background:var(--ft-bg);
  border-top:2px solid var(--gold);
  padding:16px 24px;
  transition:all .3s ease;
}
.ft-inner{display:flex;align-items:center;gap:1rem;max-width:1080px;margin:0 auto}
.ft-left{flex:1;text-align:left}
.ft-mid{flex:1;text-align:center}
.ft-right{flex:1;text-align:right}
footer.fixed-footer{
  position:fixed;bottom:0;left:0;right:0;
  z-index:90;
  padding:8px 24px;
  border-top:1.5px solid var(--gold);
  box-shadow:0 -4px 24px rgba(0,0,0,.3);
}
footer.fixed-footer .ft-sa{font-size:0.778rem;margin-bottom:0}
footer.fixed-footer .ft-ia{display:none}
footer.fixed-footer .ft-cp{font-size:0.611rem}
/* Extra body padding when footer is fixed */
body.footer-fixed{padding-bottom:52px}
.ft-sa{

/* ═══════════════════════════ HERO GALLERY ═══════════════════════════════ */
/* ══════════════════════ HERO GALLERY ════════════════════════════════════ */

/* Outer wrapper — extra bottom padding reserves room for caption card */
.hero-gallery{
  flex-shrink:0;
  width:280px;
  padding-bottom:130px;
  position:relative;
}

/* ── Circular clip ring ── */
.gallery-track-wrap{
  width:280px;height:280px;
  border-radius:50%;
  overflow:hidden;
  position:relative;
  /* One ring, perfectly centred */
  border:4px solid var(--gold);
  box-shadow:0 16px 48px rgba(122,77,6,.22);
  background:var(--gold-xl);
  cursor:pointer;
}

/* ── Sliding strip (holds all slides side by side) ── */
.gallery-strip{
  display:flex;
  width:100%;height:100%;
  transition:transform .7s cubic-bezier(.45,0,.35,1);
  will-change:transform;
}

/* ── Individual slide ── */
.gallery-slide{
  min-width:280px;width:280px;height:280px;
  position:relative;flex-shrink:0;
  overflow:hidden;
}
.gallery-slide img{
  width:100%;height:100%;
  object-fit:cover;
  object-position:center center;
  display:block;
  transition:transform .5s ease;
}
/* Subtle zoom on hover */
.hero-gallery:hover .gallery-slide img{transform:scale(1.04);}

/* ── Caption card — sits BELOW the circle, never clipped ── */
.gallery-caption-card{
  position:absolute;
  /* top = circle(280) + border(4) + outer-shadow(8) + gap(10) */
  top:302px;
  left:50%;
  transform:translateX(-50%) translateY(8px);
  width:310px;
  background:rgba(20,8,2,.92);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(232,168,48,.45);
  border-radius:14px;
  padding:13px 18px 15px;
  opacity:0;
  transition:opacity .3s ease,transform .3s ease;
  pointer-events:none;
  z-index:30;
  box-shadow:0 10px 28px rgba(0,0,0,.35);
  text-align:center;
}
/* Show on gallery hover */
.hero-gallery:hover .gallery-caption-card{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
/* Upward pointing triangle (border) */
.gallery-caption-card::before{
  content:'';
  position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:9px solid transparent;
  border-right:9px solid transparent;
  border-bottom:9px solid rgba(232,168,48,.45);
}
/* Upward pointing triangle (fill) */
.gallery-caption-card::after{
  content:'';
  position:absolute;top:-7px;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:7px solid transparent;
  border-right:7px solid transparent;
  border-bottom:7px solid rgba(20,8,2,.92);
}
.caption-title{
  font-family:'Cinzel',serif;font-size:0.7222rem;font-weight:700;
  color:#faedc8;letter-spacing:.06em;margin-bottom:5px;line-height:1.3;
}
.caption-desc{
  font-size:0.6667rem;color:rgba(250,237,200,.84);line-height:1.65;
}

/* ── Dot indicators ── */
.gallery-dots{
  display:flex;justify-content:center;gap:7px;
  margin-top:14px;
  position:relative;z-index:5;
}
.gdot{
  width:7px;height:7px;border-radius:50%;
  background:var(--gold-xl);border:1.5px solid var(--bds);
  cursor:pointer;transition:all .25s;flex-shrink:0;
}
.gdot.active{background:var(--gold);border-color:var(--gold);transform:scale(1.28);}

/* ── Prev / Next arrows ── */
.gallery-arrow{
  position:absolute;
  top:140px;transform:translateY(-50%);     /* centred on 280px circle */
  width:30px;height:30px;border-radius:50%;
  background:rgba(250,237,200,.92);
  border:1.5px solid var(--bds);
  cursor:pointer;font-size:0.7778rem;color:var(--tx-head);
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;z-index:10;
  opacity:0;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.hero-gallery:hover .gallery-arrow{opacity:1;}
.gallery-arrow:hover{background:var(--gold);color:#fff;border-color:var(--gold);}
.gallery-arrow.prev{left:-15px;}
.gallery-arrow.next{right:-15px;}

/* ── "Add photos" hint (shown when only 1 slide) ── */
.gallery-add-hint{
  display:none;
  font-size:10.5px;color:var(--txf);text-align:center;
  font-style:italic;margin-top:10px;letter-spacing:.03em;
  position:relative;z-index:5;
}
.gallery-add-hint.show{display:block;}

/* ════════════════════════════════════════════════════════════════════════ */

/* ═══════════════════════ SECTION BACKGROUNDS ════════════════════════════ */
/* Each section gets a unique SVG pattern as a subtle background */
.sec{transition:background 0.8s ease}

/* Info button — floats top-right of each section */
.sec-info-btn{
  position:absolute;top:18px;right:20px;
  width:30px;height:30px;border-radius:50%;
  background:var(--gold-xl);border:1.5px solid var(--bds);
  cursor:pointer;font-size:13px;color:var(--gold);
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;z-index:10;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  opacity:0.7;
}
.sec-info-btn:hover{opacity:1;background:var(--gold);color:#fff;transform:scale(1.1)}
.sec{position:relative}

/* Quote tooltip panel */
.quote-panel{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0.92);
  width:min(560px,90vw);
  background:rgba(12,5,2,.96);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(232,168,48,.4);
  border-radius:18px;padding:28px 32px 24px;
  z-index:500;
  opacity:0;pointer-events:none;
  transition:opacity .3s ease,transform .3s ease;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  max-height:85vh;overflow-y:auto;
}
.quote-panel.open{opacity:1;pointer-events:all;transform:translate(-50%,-50%) scale(1)}
.qp-overlay{
  position:fixed;inset:0;z-index:499;background:rgba(0,0,0,.5);
  display:none;backdrop-filter:blur(3px);
}
.qp-overlay.open{display:block}
.qp-close{
  position:absolute;top:14px;right:16px;
  background:none;border:none;color:rgba(250,237,200,.6);
  font-size:20px;cursor:pointer;transition:color .2s;line-height:1;
  padding:4px 8px;
}
.qp-close:hover{color:#faedc8}
.qp-section-tag{
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:.15em;
  color:var(--gold);text-transform:uppercase;margin-bottom:10px;
  opacity:.8;
}
.qp-pattern-name{
  font-family:'Cinzel Decorative',serif;font-size:16px;
  color:#faedc8;margin-bottom:6px;line-height:1.3;
}
.qp-why{
  font-size:13px;color:rgba(250,237,200,.78);line-height:1.75;
  margin-bottom:18px;padding-bottom:18px;
  border-bottom:1px solid rgba(232,168,48,.2);
}
.qp-sloka-tabs{display:flex;gap:5px;margin-bottom:10px}
.qp-stab{
  padding:3px 9px;border-radius:16px;font-size:10px;
  font-family:'Cinzel',serif;cursor:pointer;border:1px solid rgba(232,168,48,.3);
  background:transparent;color:rgba(250,237,200,.6);transition:all .2s;
}
.qp-stab.active{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:700}
.qp-sloka{
  font-size:14.5px;line-height:2.1;white-space:pre-line;
  color:#faedc8;margin-bottom:12px;min-height:60px;
}
.qp-sloka.dev{font-family:'Noto Sans Devanagari',sans-serif}
.qp-sloka.tel{font-family:'Noto Sans Telugu',sans-serif}
.qp-sloka.ias{font-style:italic;font-size:12.5px;color:rgba(250,237,200,.7);line-height:1.9}
.qp-meaning{
  font-size:12.5px;color:rgba(250,237,200,.72);
  line-height:1.7;margin-bottom:14px;
  padding:10px 14px;background:rgba(232,168,48,.08);
  border-radius:8px;border-left:2px solid var(--gold);
}
.qp-source{
  font-size:11px;color:rgba(232,168,48,.7);font-style:italic;
  margin-bottom:10px;letter-spacing:.03em;
}
.qp-scripture{
  font-size:11.5px;color:rgba(250,237,200,.55);line-height:1.65;
  border-top:1px solid rgba(232,168,48,.15);padding-top:12px;margin-top:4px;
}
.qp-wisdom-link{
  display:inline-flex;align-items:center;gap:5px;margin-top:12px;
  font-family:'Cinzel',serif;font-size:11px;color:var(--gold);
  cursor:pointer;border:none;background:none;
  letter-spacing:.06em;opacity:.85;transition:opacity .2s;
  text-decoration:none;
}
.qp-wisdom-link:hover{opacity:1}

/* ═══════════════════════ WISDOM TAB ═══════════════════════════════════════ */
.wisdom-sec{padding:52px 0;background:var(--bg)}
.wisdom-hero{
  background:linear-gradient(160deg,rgba(20,8,2,.95) 0%,rgba(40,20,5,.92) 100%);
  padding:52px 0 44px;margin-bottom:44px;
  border-bottom:1px solid var(--bd);
}
.wisdom-hero-inner{max-width:1080px;margin:0 auto;padding:0 1.75rem;text-align:center}
.wisdom-hero h1{
  font-family:'Cinzel Decorative',serif;font-size:clamp(24px,3.5vw,38px);
  color:#faedc8;margin-bottom:10px;letter-spacing:.04em;
}
.wisdom-hero p{
  font-size:1rem;color:rgba(250,237,200,.72);max-width:680px;
  margin:0 auto;line-height:1.85;
}
.wisdom-tabs{
  display:flex;gap:6px;justify-content:center;flex-wrap:wrap;
  margin:22px 0 0;
}
.wtab{
  padding:6px 18px;border-radius:20px;font-family:'Cinzel',serif;
  font-size:11px;letter-spacing:.07em;cursor:pointer;
  border:1px solid rgba(232,168,48,.35);
  background:transparent;color:rgba(250,237,200,.65);transition:all .2s;
}
.wtab.active,.wtab:hover{
  background:var(--gold);color:#fff;border-color:var(--gold);font-weight:700;
}

/* Wisdom content panels */
.wisdom-panel{display:none}
.wisdom-panel.active{display:block}

/* Background inspiration cards */
.bg-cards-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:20px;margin-top:8px;
}
.bg-card{
  background:var(--surf2);border:1px solid var(--bd);
  border-radius:14px;overflow:hidden;transition:all .2s;
}
.bg-card:hover{box-shadow:var(--shl);transform:translateY(-3px)}
.bg-card-header{
  padding:16px 20px 0;display:flex;align-items:flex-start;
  justify-content:space-between;gap:10px;
}
.bg-card-pattern{
  width:44px;height:44px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;background:var(--gold-xl);
  border:1px solid var(--bd);
}
.bg-card-meta{flex:1}
.bg-card-section{
  font-size:10px;color:var(--txf);font-family:'Cinzel',serif;
  letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px;
}
.bg-card-name{
  font-family:'Cinzel',serif;font-size:14px;color:var(--tx-head);
  line-height:1.3;
}
[data-theme=dark] .bg-card-name{color:var(--gold)}
.bg-card-why{
  font-size:12.5px;color:var(--txm);line-height:1.75;
  padding:12px 20px 0;
}
.bg-card-sloka-wrap{
  margin:12px 20px 0;padding:12px 14px;
  background:rgba(20,8,2,.85);border-radius:10px;
}
.bg-card-sloka-tabs{display:flex;gap:4px;margin-bottom:8px}
.bc-stab{
  padding:2px 7px;border-radius:14px;font-size:9.5px;
  font-family:'Cinzel',serif;cursor:pointer;
  border:1px solid rgba(232,168,48,.3);
  background:transparent;color:rgba(250,237,200,.6);transition:all .2s;
}
.bc-stab.active{background:var(--gold);color:#fff;border-color:var(--gold)}
.bc-sloka{
  font-size:13px;line-height:2;white-space:pre-line;color:#faedc8;
}
.bc-sloka.dev{font-family:'Noto Sans Devanagari',sans-serif}
.bc-sloka.tel{font-family:'Noto Sans Telugu',sans-serif}
.bc-sloka.ias{font-style:italic;font-size:11.5px;color:rgba(250,237,200,.7);line-height:1.85}
.bg-card-meaning{
  font-size:11.5px;color:rgba(250,237,200,.7);line-height:1.65;
  padding:8px 14px;
  border-top:1px solid rgba(232,168,48,.15);margin-top:6px;
}
.bg-card-source{
  font-size:10.5px;color:rgba(232,168,48,.65);font-style:italic;
  padding:0 20px 8px;margin-top:4px;
}
.bg-card-scripture{
  font-size:11px;color:var(--txs);line-height:1.6;
  padding:10px 20px 16px;
  border-top:1px solid var(--bd);margin-top:4px;
}

/* Scripture cards */
.scripture-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:16px;margin-top:8px;
}
.scripture-card{
  background:var(--surf2);border:1px solid var(--bd);border-radius:14px;
  padding:22px 22px 18px;transition:all .2s;
}
.scripture-card:hover{box-shadow:var(--sh);border-color:var(--bds)}
.sc-name{font-family:'Cinzel',serif;font-size:15px;color:var(--tx-head);margin-bottom:3px}
[data-theme=dark] .sc-name{color:var(--gold)}
.sc-dev{font-family:'Noto Sans Devanagari',sans-serif;font-size:13px;
  color:var(--txs);margin-bottom:8px}
.sc-meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.sc-pill{
  font-size:10px;padding:2px 8px;border-radius:20px;
  background:var(--gold-xl);border:1px solid var(--bd);
  color:var(--tx-head);font-family:'Cinzel',serif;letter-spacing:.04em;
}
.sc-intro{font-size:12.5px;color:var(--txm);line-height:1.75;margin-bottom:10px}
.sc-teachings h5{
  font-family:'Cinzel',serif;font-size:10.5px;color:var(--txf);
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;
}
.sc-teachings ul{padding-left:14px}
.sc-teachings li{font-size:11.5px;color:var(--txm);margin-bottom:3px;line-height:1.5}
.sc-quoted{margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)}
.sc-quoted h5{font-family:'Cinzel',serif;font-size:10px;color:var(--gold);
  letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.sc-quoted-item{font-size:11px;color:var(--txs);font-style:italic;
  margin-bottom:3px;line-height:1.5;padding-left:8px;
  border-left:2px solid var(--bds);}

/* Script primer cards */
.script-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:16px;margin-top:8px;
}
.script-card{
  background:var(--surf2);border:1px solid var(--bd);border-radius:14px;
  padding:20px 22px;transition:all .2s;
}
.script-card:hover{box-shadow:var(--sh)}
.scrp-name{font-family:'Cinzel',serif;font-size:14.5px;color:var(--tx-head);margin-bottom:2px}
[data-theme=dark] .scrp-name{color:var(--gold)}
.scrp-local{font-size:18px;color:var(--gold-d);margin-bottom:8px;
  font-family:'Noto Sans Devanagari',sans-serif}
.scrp-example{
  font-size:16px;color:var(--mar);line-height:1.8;
  padding:8px 12px;background:var(--gold-xl);
  border-radius:8px;margin:8px 0 10px;
  font-family:'Noto Sans Devanagari',sans-serif;
}
.scrp-note{font-size:12px;color:var(--txm);line-height:1.7}
.scrp-meta{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.scrp-meta-row{display:flex;gap:6px;font-size:11px;color:var(--txs)}
.scrp-meta-label{font-family:'Cinzel',serif;letter-spacing:.04em;
  color:var(--gold-d);min-width:70px;flex-shrink:0}
/* ════════════════════════════════════════════════════════════════════════ */

/* ── SCROLL PROGRESS BAR ── */
#scrollBar{
  position:fixed;top:0;left:0;height:3px;width:0%;
  background:linear-gradient(90deg,var(--gold),var(--gold-l),var(--gold));
  z-index:1000;transition:width .05s linear;
  box-shadow:0 0 8px var(--gold);
}

/* ── BACK TO TOP BUTTON ── */
#topBtn{
  position:fixed;bottom:24px;right:20px;
  width:44px;height:44px;border-radius:50%;
  background:var(--gold);
  border:2px solid var(--gold-l);
  color:#fff;font-family:var(--font-dev);
  font-size:1.111rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:all .3s ease;
  box-shadow:0 4px 16px rgba(184,115,10,.4);
  z-index:95;
}
#topBtn.visible{opacity:1;pointer-events:all;}
#topBtn:hover{background:var(--mar);border-color:var(--mar-l);transform:scale(1.1);}

/* ── SECTION ENTRANCE ANIMATION ── */
.sec-animate{
  opacity:0;
  transform:translateY(28px);
  transition:opacity .65s ease, transform .65s ease;
}
.sec-animate.revealed{
  opacity:1;
  transform:translateY(0);
}

/* ── THEMES ── */
/* Each theme overrides CSS vars; JS applies data-theme attr to <html> */

[data-theme="ivory"]{
  /* Bhāgavatam — Vishnu's conch white, sapphire-deep ink; feels pure, sacred, oceanic */
  --bg:#eef4ff;--surf:#f6f9ff;--surf2:#fbfcff;
  --tx:#060e38;--txm:#162068;--txs:#3a50a0;--txf:#7888c8;
  --tx-head:#080e48;
  --bd:#1e3a9022;--bds:#1e3a9055;
  --sh:0 2px 14px rgba(20,40,120,.08);
  --shl:0 8px 32px rgba(20,40,120,.14);
  --ft-bg:#04081e;--ft-tx:#e0e8ff;--ft-tx2:rgba(220,230,255,.6);
}
[data-theme="sandalwood"]{
  /* Mahābhāratam — ochre earth, forest dark; the great epic of dharma and war */
  --bg:#eedcac;--surf:#f8eec8;--surf2:#fdf6e4;
  --tx:#120600;--txm:#2e1000;--txs:#6a3808;--txf:#a86828;
  --tx-head:#1c0800;
  --bd:#8a480822;--bds:#8a480855;
  --sh:0 2px 14px rgba(80,30,0,.12);
  --shl:0 8px 32px rgba(80,30,0,.20);
  --ft-bg:#100400;--ft-tx:#faedc8;--ft-tx2:rgba(250,237,200,.65);
}
[data-theme="midnight"]{
  /* Durgā Saptaśatī — cosmic night, fierce gold flame; power and protection */
  --bg:#08041c;--surf:#100828;--surf2:#180e34;
  --tx:#fdf8ee;--txm:#f0e0a0;--txs:#c8a850;--txf:#806830;
  --tx-head:#fff8d8;
  --gold:#f8c020;--gold-l:#ffe040;--gold-xl:rgba(248,192,32,.18);
  --mar:#d82040;--mar-l:#f05080;
  --bd:rgba(248,192,32,.20);--bds:rgba(248,192,32,.45);
  --sh:0 2px 14px rgba(248,192,32,.08);
  --shl:0 8px 32px rgba(248,192,32,.16);
  --ft-bg:#040210;--ft-tx:#fff8d8;--ft-tx2:rgba(255,248,216,.55);
}
[data-theme="lotus"]{
  /* Soundaryalaharī — divine rose, magenta-deep; Śakti, beauty and grace */
  --bg:#fcd8ec;--surf:#fdeef6;--surf2:#fff6fb;
  --tx:#180020;--txm:#380848;--txs:#840858;--txf:#c04888;
  --tx-head:#220030;
  --bd:#88006022;--bds:#88006055;
  --sh:0 2px 14px rgba(120,0,80,.10);
  --shl:0 8px 32px rgba(120,0,80,.18);
  --ft-bg:#100018;--ft-tx:#fcd8ec;--ft-tx2:rgba(252,216,236,.65);
}
/* Rāmāyaṇam = default (:root), no extra class needed */

/* ── THEME GRID ── */
.theme-grid{display:flex;flex-direction:column;gap:5px}
.thbtn{
  display:flex;align-items:center;gap:8px;
  padding:6px 10px;border:1px solid var(--bd);border-radius:8px;
  cursor:pointer;background:transparent;color:var(--txs);
  font-size:0.722rem;font-family:var(--font-head);
  text-align:left;transition:all .2s;letter-spacing:.04em;
}
.thbtn:hover{border-color:var(--bds);color:var(--gold);background:var(--gold-xl)}
.thbtn.active{border-color:var(--gold);background:var(--gold);color:#fff;font-weight:700}
.th-swatch{
  width:18px;height:18px;border-radius:50%;flex-shrink:0;
  display:inline-block;
}

/* ── TOGGLE SWITCH ── */
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.toggle-btn{
  width:44px;height:24px;border-radius:12px;
  background:var(--bd);border:1.5px solid var(--bds);
  cursor:pointer;position:relative;flex-shrink:0;
  transition:all .25s;padding:0;
}
.toggle-btn[aria-checked="true"]{
  background:var(--gold);border-color:var(--gold);
}
.toggle-knob{
  position:absolute;top:2px;left:2px;
  width:16px;height:16px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);
  transition:transform .25s ease;display:block;
}
.toggle-btn[aria-checked="true"] .toggle-knob{transform:translateX(20px)}

/* ── Contact form field groups ── */
.cf-group{display:flex;flex-direction:column;gap:3px}
.cf-label{
  font-size:0.611rem;font-family:var(--font-head);
  color:var(--txs);letter-spacing:.05em;
  text-transform:uppercase;
}
</style>
