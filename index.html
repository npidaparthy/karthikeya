<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Karthikeya Pidaparthy — Samskruti</title>
<meta name="description" content="Karthikeya Pidaparthy — Sanskrit scholar, Bhagavad Gita Gold Medalist, Sanskrit Olympiad 1st in Australia. Sydney, Australia."/>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Sans+Telugu:wght@300;400;500;600&family=Noto+Sans+Devanagari:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#b8730a;--gold-l:#e8a830;--gold-xl:#faedc8;--mar:#6b1528;--mar-l:#c4405a;
  --tx:#2c1a0e;--txm:#6b4820;--txs:#a07850;--txf:#c8a878;
  --bg:#faf5eb;--surf:#fff9ef;--surf2:#fffbf3;
  --bd:#b8730a22;--bds:#b8730a55;
  --sh:0 2px 14px rgba(122,77,6,.08);--shl:0 8px 32px rgba(122,77,6,.14);}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:'Cormorant Garamond',Georgia,serif;background:var(--bg);color:var(--tx);line-height:1.75}
body.te{font-family:'Noto Sans Telugu',sans-serif;font-size:17px}
body.sa{font-family:'Noto Sans Devanagari',sans-serif;font-size:17px}

/* NAV */
#nav{position:sticky;top:0;z-index:100;height:64px;background:rgba(250,245,235,.97);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;padding:0 1.5rem;gap:8px;box-shadow:var(--sh)}
.logo-btn{display:flex;align-items:center;gap:8px;border:none;background:none;cursor:pointer;flex-shrink:0}
.logo-om{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--gold-xl),#f5d090);
  border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;
  font-family:'Noto Sans Devanagari',sans-serif;font-size:19px;color:var(--gold);flex-shrink:0}
.logo-nm{font-family:'Cinzel Decorative',serif;font-size:13px;font-weight:700;color:var(--gold);
  letter-spacing:.04em;line-height:1.2;display:block}
.logo-tg{font-size:9.5px;color:var(--txs);letter-spacing:.04em;display:block}
.nav-links{display:flex;margin-left:auto;align-items:center;overflow:hidden;gap:0}
.nl{padding:3px 6px;font-family:'Cinzel',serif;font-size:9.5px;color:var(--txs);letter-spacing:.05em;
  white-space:nowrap;cursor:pointer;border:none;background:none;
  border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.nl:hover,.nl.active{color:var(--gold);border-bottom-color:var(--gold)}
.nav-r{display:flex;align-items:center;gap:6px;margin-left:8px;flex-shrink:0}
/* Language pill — 3 visible buttons */
.lang-pill{display:flex;border:1px solid var(--bds);border-radius:20px;overflow:hidden;flex-shrink:0}
.lbtn{padding:4px 10px;font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:.06em;
  cursor:pointer;border:none;border-right:1px solid var(--bd);
  background:transparent;color:var(--txs);transition:all .2s;font-weight:400}
.lbtn:last-child{border-right:none}
.lbtn.active{background:var(--gold);color:#fff;font-weight:700}
.lbtn:not(.active):hover{background:var(--gold-xl);color:var(--gold)}
.ib{width:32px;height:32px;border-radius:8px;border:1px solid var(--bd);
  background:none;cursor:pointer;font-size:14px;color:var(--txs);
  display:flex;align-items:center;justify-content:center;transition:all .2s}
.ib:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-xl)}
.hamburger{display:none}

/* MOBILE NAV */
.mob-nav{display:none;position:fixed;inset:0;top:64px;z-index:90;
  background:var(--surf);flex-direction:column;padding:1.5rem;gap:.3rem;overflow-y:auto}
.mob-nav.open{display:flex}
.mob-nav .nl{font-size:17px;padding:.6rem 0;border-bottom:1px solid var(--bd);letter-spacing:.06em}

/* SETTINGS PANEL */
.s-overlay{display:none;position:fixed;inset:0;z-index:200}
.s-overlay.open{display:block}
.s-panel{position:fixed;top:64px;right:0;width:255px;background:var(--surf);
  border-left:2px solid var(--bds);padding:18px 16px;
  box-shadow:-4px 0 20px rgba(0,0,0,.1);height:calc(100vh - 64px);
  overflow-y:auto;z-index:201;transform:translateX(100%);transition:transform .25s}
.s-panel.open{transform:translateX(0)}
.s-panel h3{font-family:'Cinzel',serif;font-size:13.5px;color:var(--gold);
  margin-bottom:16px;letter-spacing:.05em}
.sg{margin-bottom:16px}
.sg label{display:block;font-size:11px;color:var(--txs);margin-bottom:6px;font-style:italic}
.sg input[type=range]{width:100%;accent-color:var(--gold);cursor:pointer}
.slang-row{display:flex;flex-direction:column;gap:5px}
.slb{padding:7px 11px;border:1px solid var(--bd);border-radius:8px;cursor:pointer;
  text-align:left;font-size:12.5px;font-family:'Cinzel',serif;
  background:transparent;color:var(--txs);transition:all .2s;
  display:flex;align-items:center;gap:8px}
.slb:hover{border-color:var(--bds);color:var(--gold);background:var(--gold-xl)}
.slb.active{border-color:var(--gold);background:var(--gold);color:#fff;font-weight:700}
.color-swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .2s}
.sw:hover,.sw.active{transform:scale(1.28);border-color:var(--tx)}

/* LAYOUT */
main{padding-top:0}
.sec{padding:52px 0;background:var(--bg)}
.sec.alt{background:var(--surf)}
.ct{max-width:1080px;margin:0 auto;padding:0 1.75rem}
.st{font-family:'Cinzel',serif;font-size:clamp(19px,2.5vw,27px);
  color:#7a4d06;letter-spacing:.03em;margin-bottom:8px}
.dv{width:52px;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-l),transparent);
  margin-bottom:28px;border-radius:2px}

/* HERO */
#home{min-height:100vh;display:flex;align-items:center;padding-top:64px;
  background:linear-gradient(155deg,var(--surf) 60%,var(--gold-xl) 100%);position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;opacity:.05;
  background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l4 12h12l-10 8 4 12-10-8-10 8 4-12-10-8h12z' fill='%23b8730a'/%3E%3C/svg%3E")}
.hero-inner{display:flex;align-items:center;gap:52px;padding:2.5rem 0;position:relative}
.avatar-ring{flex-shrink:0;width:250px;height:250px;border-radius:50%;
  border:4px solid var(--gold);box-shadow:0 0 0 8px var(--gold-xl),0 16px 48px rgba(122,77,6,.18);
  overflow:hidden;background:linear-gradient(135deg,var(--gold-xl),#f0b040)}
.avatar-ring svg,.avatar-ring img{width:100%;height:100%;object-fit:cover;display:block}
.hgreet{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.18em;color:var(--mar);
  text-transform:uppercase;margin-bottom:10px}
.hname{font-family:'Cinzel Decorative',serif;font-size:clamp(26px,4vw,46px);
  font-weight:700;color:#7a4d06;line-height:1.1;margin-bottom:8px}
.hloc{font-family:'Cinzel',serif;font-size:13px;color:var(--mar);font-style:italic;margin-bottom:16px}
.hdesc{max-width:510px;color:var(--txm);font-size:14.5px;margin-bottom:20px;line-height:1.85}
.hbadges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:20px}
.badge{padding:3px 11px;border-radius:100px;border:1px solid var(--bds);font-size:10.5px;
  color:#7a4d06;background:var(--gold-xl);font-family:'Cinzel',serif;letter-spacing:.03em}
.hcta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn-pri{padding:9px 22px;border-radius:10px;background:var(--gold);color:#fff;border:none;
  font-family:'Cinzel',serif;font-size:11.5px;letter-spacing:.07em;cursor:pointer;
  box-shadow:0 2px 10px rgba(184,115,10,.4);transition:all .2s}
.btn-pri:hover{background:#7a4d06;transform:translateY(-2px)}
.btn-out{padding:9px 22px;border-radius:10px;border:1.5px solid var(--bds);color:var(--gold);
  font-family:'Cinzel',serif;font-size:11.5px;letter-spacing:.07em;
  background:none;cursor:pointer;text-decoration:none;display:inline-block;transition:all .2s}
.btn-out:hover{background:var(--gold-xl);transform:translateY(-2px)}

/* ABOUT */
.agrid{display:grid;grid-template-columns:1.1fr 1fr;gap:2.75rem;align-items:start}
.qb{border-left:3px solid var(--gold);padding:11px 14px;
  background:linear-gradient(90deg,var(--gold-xl),transparent);
  border-radius:0 10px 10px 0;margin-top:14px}
.qb p{margin-bottom:3px}
.acard{border:1px solid var(--bd);border-radius:12px;padding:15px 18px;margin-bottom:10px;
  background:var(--surf2);transition:all .2s}
.acard:hover{transform:translateX(4px);box-shadow:var(--sh)}
.acard h4{font-family:'Cinzel',serif;color:#7a4d06;font-size:12.5px;margin-bottom:6px;letter-spacing:.05em}
.acard p{font-size:12.5px;color:var(--txm);line-height:1.8}

/* PROFILE */
.journey-box{background:var(--surf2);border:1px solid var(--bd);border-radius:14px;
  padding:26px 30px;margin-bottom:28px;border-left:4px solid var(--gold)}
.journey-box h3{font-family:'Cinzel',serif;color:#7a4d06;font-size:16px;margin-bottom:12px}
.journey-text{font-size:13.5px;color:var(--txm);line-height:1.92;white-space:pre-line}
.exam-section{margin-bottom:28px}
.exam-section h4{font-family:'Cinzel',serif;font-size:14px;color:#7a4d06;margin-bottom:10px}
.exam-table{width:100%;border-collapse:collapse;font-size:13px;
  border-radius:10px;overflow:hidden;border:1px solid var(--bd)}
.exam-table th{background:var(--gold);color:#fff;font-family:'Cinzel',serif;font-size:10px;
  padding:9px 12px;text-align:left;letter-spacing:.06em}
.exam-table td{padding:9px 12px;border-bottom:1px solid var(--bd);color:var(--txm)}
.exam-table tr:last-child td{border-bottom:none}
.exam-table tr:nth-child(even) td{background:#faf5eb}
.exam-table .score{font-family:'Cinzel',serif;font-weight:700;color:var(--gold)}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:12px}
.ach-card{background:var(--surf2);border:1px solid var(--bd);border-radius:12px;
  padding:17px 19px;position:relative;overflow:hidden;transition:all .2s}
.ach-card:hover{transform:translateY(-4px);box-shadow:var(--shl);border-color:var(--bds)}
.ach-icon{font-size:24px;margin-bottom:6px}
.ach-title{font-family:'Cinzel',serif;font-size:13px;color:#7a4d06;margin-bottom:5px;line-height:1.4}
.ach-desc{font-size:12px;color:var(--txm);line-height:1.75}
.ach-year{margin-top:8px;font-size:10.5px;color:var(--txf);font-style:italic;
  padding-top:7px;border-top:1px solid var(--bd)}
.cert-section{margin-top:32px}
.cert-section h3{font-family:'Cinzel',serif;font-size:14px;color:#7a4d06;margin-bottom:14px}
.cert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.cert-ph{aspect-ratio:4/3;border:2px dashed var(--bds);border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;background:var(--gold-xl);cursor:pointer;transition:all .2s}
.cert-ph:hover{background:#f5d898;border-color:var(--gold)}
.cert-ph-lbl{font-size:10.5px;font-family:'Cinzel',serif;text-align:center;
  padding:0 6px;color:rgba(122,77,6,.7)}

/* CREDITS */
.cgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.ci{background:var(--surf2);border:1px solid var(--bd);border-radius:10px;
  padding:10px 12px;transition:all .2s}
.ci:hover{border-color:var(--bds);transform:translateY(-2px)}
.ci-name{font-family:'Cinzel',serif;font-size:12.5px;color:#7a4d06;margin-bottom:2px}
.ci-role{font-size:11.5px;color:var(--txs);font-style:italic;line-height:1.5}

/* EVENTS TIMELINE */
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:5px;top:0;bottom:0;width:2px;
  background:linear-gradient(to bottom,var(--gold),var(--mar-l),transparent)}
.tli{position:relative;margin-bottom:26px}
.tl-dot{position:absolute;left:-22px;top:5px;width:12px;height:12px;border-radius:50%;
  background:var(--gold);border:2px solid var(--bg);box-shadow:0 0 0 3px rgba(184,115,10,.25)}
.tl-date{font-size:11px;color:var(--txf);font-style:italic;margin-bottom:2px;letter-spacing:.04em}
.tl-title{font-family:'Cinzel',serif;font-size:13.5px;color:#7a4d06;margin-bottom:4px}
.tl-desc{font-size:12.5px;color:var(--txm);line-height:1.75}
.tl-ph{margin-top:8px;height:40px;border:2px dashed var(--bds);border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:11.5px;
  font-family:'Cinzel',serif;color:rgba(184,115,10,.6);background:var(--gold-xl)}

/* PARAYANA */
.pgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.pc{background:var(--surf2);border:1px solid var(--bd);border-radius:12px;padding:18px 17px}
.pc h3{font-family:'Cinzel',serif;color:#7a4d06;font-size:14px;margin-bottom:8px}
.stabs{display:flex;gap:4px;margin-bottom:8px}
.stab{padding:3px 9px;border-radius:20px;font-size:10.5px;font-family:'Cinzel',serif;
  cursor:pointer;border:1px solid var(--bds);background:transparent;color:var(--txs);transition:all .2s}
.stab.active{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:700}
.stab:not(.active):hover{border-color:var(--gold);color:var(--gold);background:var(--gold-xl)}
.sv{color:var(--mar);line-height:2.1;white-space:pre-line;font-size:14px}
.sv.sv-te{font-family:'Noto Sans Telugu',sans-serif}
.sv.sv-dev{font-family:'Noto Sans Devanagari',sans-serif}
.sv.sv-iast{font-style:italic;font-size:12.5px;color:var(--txm);line-height:1.9}
.sattr{font-size:11.5px;color:var(--txs);font-style:italic;margin-top:8px;
  padding-top:7px;border-top:1px solid var(--bd);line-height:1.55}

/* SUPPORT */
.spgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.spc{background:var(--surf2);border:1px solid var(--bd);border-radius:12px;
  padding:22px;text-align:center;transition:all .2s}
.spc:hover{box-shadow:var(--sh);transform:translateY(-3px);border-color:var(--bds)}
.spc .spi{font-size:30px;margin-bottom:10px}
.spc h3{font-family:'Cinzel',serif;color:#7a4d06;font-size:14px;margin-bottom:8px}
.spc p{font-size:12.5px;color:var(--txm);line-height:1.8}

/* TESTIMONIALS */
.tegr{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.tec{background:var(--surf2);border:1px solid var(--bd);border-radius:12px;padding:22px;transition:box-shadow .2s}
.tec:hover{box-shadow:var(--sh)}
.tec-qm{font-family:'Cinzel Decorative',serif;font-size:54px;color:var(--gold);
  opacity:.15;line-height:.75;margin-bottom:6px}
.tec-text{font-style:italic;color:var(--txm);font-size:13.5px;line-height:1.85;margin-bottom:10px}
.tec-by{font-family:'Cinzel',serif;font-size:12px;color:#7a4d06;margin-bottom:2px}
.tec-role{font-size:11.5px;color:var(--txs);font-style:italic}

/* YOUTUBE */
.yt-ch{display:flex;align-items:center;gap:10px;background:var(--surf2);
  border:1.5px solid var(--bds);border-radius:12px;padding:14px 18px;
  text-decoration:none;color:inherit;margin-bottom:14px;transition:all .2s}
.yt-ch:hover{border-color:var(--gold);transform:translateY(-2px)}
.yt-chn{font-family:'Cinzel',serif;font-size:13.5px;color:#7a4d06;margin-bottom:2px}
.yt-chs{font-size:11.5px;color:var(--txs)}
.yt-bh{display:flex;align-items:center;gap:12px;
  background:linear-gradient(135deg,var(--gold-xl),var(--surf2));
  border:2px solid var(--bds);border-radius:12px;padding:16px 20px;
  text-decoration:none;color:inherit;margin-bottom:22px;transition:all .2s}
.yt-bh:hover{border-color:var(--gold);transform:translateY(-3px)}
.yt-bht{font-family:'Cinzel',serif;font-size:15.5px;color:#7a4d06;margin-bottom:2px}
.yt-bhd{font-size:13px;color:var(--txm)}
.ytgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px}
.yt-card{background:var(--surf2);border:1px solid var(--bd);border-radius:12px;
  overflow:hidden;text-decoration:none;color:inherit;display:block;transition:all .2s}
.yt-card:hover{transform:translateY(-4px);box-shadow:var(--shl)}
.yt-th{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,var(--mar),var(--gold));
  display:flex;align-items:center;justify-content:center;font-size:36px;color:rgba(255,255,255,.85)}
.yt-inf{padding:10px 12px}
.yt-vt{font-family:'Cinzel',serif;font-size:12.5px;color:var(--tx);margin-bottom:3px}
.yt-vm{font-size:11.5px;color:var(--txs)}

/* CONTACT */
.cogr{display:grid;grid-template-columns:1fr 1.1fr;gap:2.75rem}
.cof{display:flex;flex-direction:column;gap:10px}
.cof input,.cof textarea{width:100%;padding:9px 13px;background:var(--surf2);
  border:1.5px solid var(--bd);border-radius:10px;
  font-size:14px;font-family:inherit;color:var(--tx);outline:none;transition:border-color .2s}
.cof input:focus,.cof textarea:focus{border-color:var(--gold)}
.cof textarea{min-height:110px;resize:vertical}

/* FOOTER */
footer{background:var(--surf);border-top:1px solid var(--bd);text-align:center;padding:26px 12px}
.ft-sa{font-family:'Noto Sans Devanagari',sans-serif;font-size:16px;color:#7a4d06;margin-bottom:4px;font-weight:500}
.ft-ia{font-size:12.5px;font-style:italic;color:var(--txs);margin-bottom:6px;letter-spacing:.04em}
.ft-cp{font-size:12px;color:var(--txf)}

/* PHOTO UPLOAD AREA */
.photo-upload{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;cursor:pointer;transition:all .2s}
.photo-upload input[type=file]{position:absolute;width:0;height:0;opacity:0}

/* RESPONSIVE */
@media(max-width:900px){
  .nav-links{display:none}
  .hamburger{display:flex}
  .hero-inner{flex-direction:column;text-align:center;gap:1.75rem;padding:1.5rem 0}
  .avatar-ring{width:200px;height:200px}
  .hbadges,.hcta{justify-content:center}
  .agrid,.cogr{grid-template-columns:1fr}
}
@media(max-width:580px){
  :root{font-size:15px}
  .ct{padding:0 1rem}
  .sec{padding:38px 0}
}
</style>
</head>
<body id="body">

<!-- SETTINGS OVERLAY -->
<div class="s-overlay" id="sOverlay" onclick="closeSett()"></div>
<div class="s-panel" id="sPanel">
  <h3 id="sp-title">⚙ Settings</h3>
  <div class="sg">
    <label id="sp-lang-lbl">Language</label>
    <div class="slang-row" id="slangRow"></div>
  </div>
  <div class="sg">
    <label>Font Size — <span id="fsv">16</span>px</label>
    <input type="range" min="14" max="22" value="16" oninput="setFS(this.value)"/>
  </div>
  <div class="sg">
    <label id="sp-accent-lbl">Accent Colour</label>
    <div class="color-swatches">
      <div class="sw active" style="background:#b8730a" title="Gold"    onclick="setAcc('#b8730a','#e8a830','#faedc8',this)"></div>
      <div class="sw"        style="background:#8b5e06" title="Amber"   onclick="setAcc('#8b5e06','#c8860a','#f5dfa8',this)"></div>
      <div class="sw"        style="background:#6b1528" title="Maroon"  onclick="setAcc('#6b1528','#c4405a','#f5d0dc',this)"></div>
      <div class="sw"        style="background:#1d5c38" title="Forest"  onclick="setAcc('#1d5c38','#3aaa6a','#d0f0e0',this)"></div>
      <div class="sw"        style="background:#1e3a6e" title="Navy"    onclick="setAcc('#1e3a6e','#4a7ec8','#d0def8',this)"></div>
      <div class="sw"        style="background:#5a2d7a" title="Violet"  onclick="setAcc('#5a2d7a','#a06acc','#ead0f8',this)"></div>
    </div>
  </div>
</div>

const ALL = {"en":{"nav":{"home":"Home","about":"About","profile":"Profile","credits":"Credits","events":"Events","parayana":"Pārāyaṇa","support":"Sponsor","testimonials":"Testimonials","contact":"Contact","youtube":"YouTube","logo_name":"Samskruti","logo_tag":"సంస్కృతి • संस्कृति"},"hero":{"greeting":"Śrī Gaṇeśāya Namaḥ","name":"Karthikeya Pidaparthy","age_location":"Age 10 · Sydney, Australia","description":"A young scholar of Sanskrit, Telugu and English — who memorised all 700 verses of the Bhagavad Gītā and received the Gold Medal from Mysore Datta Peetham; laureate of the Sanskrit Olympiad (1st in Australia); devoted pārāyaṇa seeker in the grand tradition of Sanātana Dharma.","btn_achievements":"View Achievements","btn_youtube":"▶ YouTube Channel","badges":["🏅 Gold Medal — Mysore Datta Peetham","🥇 Sanskrit Olympiad — 1st in Australia","📖 Bhagavad Gītā · 700 Verses","🕉 Soundaryalaharī · 100 Verses","🎤 Śivapadams by Samavedam"]},"about":{"section_title":"About Karthikeya","para1":"Born in Sydney, Australia into a family deeply rooted in the Vedic tradition, Karthikeya Pidaparthy has been immersed in the world of Sanskrit, scripture and classical Telugu literature from his earliest years. Far from the land of his ancestors yet firmly anchored in their wisdom, he embodies the living continuity of Sanātana Dharma.","para2":"At the remarkable age of 10, he balances the demands of a modern Australian schooling with daily devotional practice, regular temple pārāyaṇa, and serious academic engagement with Sanskrit — a feat that has drawn the admiration of revered scholars from across India and the diaspora.","quote_sa":"विद्या ददाति विनयम् ।","quote_iast":"vidyā dadāti vinayam","quote_te":"విద్య వినయమిస్తుంది.","quote_en":"Knowledge bestows humility.","cards":[{"title":"Languages","body":"Fluent in Telugu, English and profoundly versed in Sanskrit. He reads and writes in Devanāgarī, Telugu and Roman IAST scripts. His Telugu is so pure that at age 3–4 he won the 'Para Bhāṣa Lekundā Telugu Lo' competition — spoken Telugu free of foreign words."},{"title":"Scriptural Depth","body":"Has listened to the complete Rāmāyaṇa and Mahābhārata pravachanams of Chaganti Koteswara Rao in their entirety. Familiar with stories from the Bhāgavata, Upaniṣads and all major Itihāsas. He has also explored the 'Stories Behind Temples' series by Vyoma Linguistics Labs."},{"title":"Community & Devotion","body":"Regularly performs Viṣṇu Sahasranāma and Lalitā Sahasranāma pārāyaṇa at Sydney Murugan Temple. Performed Soundaryalaharī at Navarātri in Sydney Ayyappa Temple. Chanted the complete Bhagavad Gītā at Helensburgh Temple."}]},"profile":{"section_title":"Profile & Achievements","journey_title":"The Sanskrit Journey","journey":"Karthikeya's love for Sanskrit was kindled at home from a very young age. Long before formal schooling, he was immersed in the sounds and rhythms of Sanskrit verses, listening to his family recite stotras and prayers. This early immersion laid the foundation for what would become an extraordinary academic and spiritual journey.\n\nHis formal Sanskrit examinations through the Saṃskṛta Bhāratī programme trace a remarkable arc of excellence — each year he has not merely passed but mastered each level with distinction:\n\n• Āyanam (2022) — 100%\n• Sāriṇī (2023) — 98%\n• Saralā (2024) — 94%\n• Sugamā (2025) — 98%\n• Sarasā (2026) — 96%\n\nAcross five consecutive years, he has maintained an average of 97.2% — a testament to consistent dedication and genuine love for the language of the Vedas. He also explored the rich 'Stories Behind Temples' video series by Vyoma Linguistics Labs, deepening his understanding of the cultural and mythological heritage woven into India's sacred geography.","achievements":[{"icon":"🥇","title":"Gold Medal — Bhagavad Gītā","desc":"Awarded the prestigious Gold Medal by Mysore Datta Peetham for memorising and flawlessly reciting all 700 verses of the Śrīmad Bhagavad Gītā — a monumental feat of memory, devotion and discipline.","year":"Mysore Datta Peetham","tag":"gold"},{"icon":"📖","title":"Bhagavad Gītā — Helensburgh Temple","desc":"Chanted the complete Śrīmad Bhagavad Gītā (all 18 chapters, 700 verses) at Helensburgh Temple on the auspicious occasion of Paṇḍit Rishikesh Bhattar's Ṣaṣṭipūrti Mahōtsavam — a rare honour and a deeply moving devotional offering.","year":"Helensburgh Temple · Ṣaṣṭipūrti Mahōtsavam","tag":"gold"},{"icon":"🏆","title":"Sanskrit Olympiad — 1st in Australia","desc":"Secured 1st place in Australia in the Central Sanskrit University's National Sanskrit Olympiad for two consecutive years. In the previous year he achieved All India Rank 266 — competing against thousands of students across India.","year":"Central Sanskrit University · 2 consecutive years","tag":"olympiad"},{"icon":"📊","title":"Sanskrit Examinations — 5 Years of Excellence","desc":"Āyanam 2022 (100%) · Sāriṇī 2023 (98%) · Saralā 2024 (94%) · Sugamā 2025 (98%) · Sarasā 2026 (96%). Five years of consecutive excellence with a 97.2% average — each level progressively more advanced.","year":"Saṃskṛta Bhāratī Programme · 2022–2026","tag":"olympiad"},{"icon":"🕉","title":"Soundaryalaharī Pārāyaṇa","desc":"Memorised all 100 verses of Ādi Śaṅkarācārya's Soundaryalaharī — one of the most celebrated Sanskrit hymns on the Divine Mother — and performed the complete pārāyaṇa at Sydney Ayyappa Temple during Navarātri.","year":"Sydney Ayyappa Temple · Navarātri","tag":"parayana"},{"icon":"📜","title":"Viṣṇu & Lalitā Sahasranāma","desc":"Regularly performs the complete Viṣṇu Sahasranāma and Lalitā Sahasranāma pārāyaṇa at Sydney Murugan Temple, contributing to the devotional life of Sydney's Hindu community.","year":"Sydney Murugan Temple · Regular","tag":"parayana"},{"icon":"🎤","title":"Śivapadams — Samavedam Shanmukha Sharma","desc":"Recited 10 Śivapadam poems composed by the renowned scholar Samavedam Shanmukha Sharma in his presence during his Sydney visit. The great scholar was moved and presented Karthikeya with a special memento in appreciation.","year":"Sydney · April · Samavedam Shanmukha Sharma's visit","tag":"scholar"},{"icon":"✍","title":"Saṅkaṭanāśana Ganeśa Stotram — Offered to Scholars","desc":"Personally transcribed and offered a handwritten copy of the Saṅkaṭanāśana Ganeśa Stotram to three eminent scholars: Vaddiparti Padmakar, Samavedam Shanmukha Sharma and Madugula Naga Phani Sharma.","year":"Personal offering to three great scholars","tag":"scholar"},{"icon":"🎭","title":"Avadānam — Aprastuta Prasaṅga","desc":"Participated as the Aprastuta Prasaṅga Pṛcchakudu (off-topic questioner) in the prestigious avadānam performed by the celebrated poet-scholar Taṭavarti Kalyāṇ — a role requiring sharp wit and spontaneous creativity.","year":"Taṭavarti Kalyāṇ Avadānam · Sydney","tag":"scholar"},{"icon":"🏅","title":"Mānava Kathā & Gajendra Mokṣam — Winner","desc":"Won prizes in the Mānava Kathā and Gajendra Mokṣam competitions organised by Pranava Peetham under the guidance of Vaddiparti Padmakar.","year":"Pranava Peetham · Vaddiparti Padmakar","tag":"competition"},{"icon":"🎊","title":"Cultural Competitions — Multiple Prizes","desc":"Won multiple prizes in Rāmāyaṇa and Daśāvatāra storytelling competitions organised by Sydney Jana Ranjani, and in poetry competitions organised by Pranava Peetham.","year":"Sydney Jana Ranjani · Pranava Peetham","tag":"competition"},{"icon":"🗣","title":"'Para Bhāṣa Lekundā Telugu Lo' — Winner","desc":"At the extraordinary age of 3–4 years, won the 'Para Bhāṣa Lekundā Telugu Lo' competition — speaking pure Telugu entirely free of borrowed foreign words. A remarkable early indication of his linguistic gifts.","year":"Age ~3–4 years · Telugu language competition","tag":"competition"},{"icon":"📺","title":"Bhāratam Laghu Prasaṅgālu","desc":"Delivered a published series of short discourses on the Mahābhārata on YouTube, demonstrating a depth of understanding of the great Itihāsa far beyond his years. He has listened to the complete Bhārata and Rāmāyaṇa pravachanams of Chaganti Koteswara Rao.","year":"YouTube Series · samskruti.info.1","tag":"discourse"}],"exam_table_title":"Sanskrit Examination Record","exam_table":[{"year":"2022","exam":"Āyanam","score":"100%","grade":"🌟"},{"year":"2023","exam":"Sāriṇī","score":"98%","grade":"🌟"},{"year":"2024","exam":"Saralā","score":"94%","grade":"⭐"},{"year":"2025","exam":"Sugamā","score":"98%","grade":"🌟"},{"year":"2026","exam":"Sarasā","score":"96%","grade":"🌟"}],"photo_placeholder":"Certificate & Achievement Photos","photo_placeholder_sub":"Certificates and event photographs will be displayed here"},"credits":{"section_title":"Credits & Gratitude","intro":"Karthikeya's remarkable journey has been shaped by the grace and guidance of great scholars, revered organisations and a loving community. With deep gratitude:","list":[{"name":"Mysore Datta Peetham","role":"Gold Medal — Bhagavad Gītā Pārāyaṇa"},{"name":"Central Sanskrit University","role":"Sanskrit Olympiad — organiser & recognition"},{"name":"Samavedam Shanmukha Sharma","role":"Śivapadam composer · Inspiration · Memento"},{"name":"Vaddiparti Padmakar","role":"Pranava Peetham · Poetry mentor · Competitions"},{"name":"Madugula Naga Phani Sharma","role":"Scholar · Blessing · Encouragement"},{"name":"Paṇḍit Rishikesh Bhattar","role":"Ṣaṣṭipūrti Mahōtsavam · Helensburgh Temple"},{"name":"Taṭavarti Kalyāṇ","role":"Avadānam — Aprastuta Prasaṅga honour"},{"name":"Chaganti Koteswara Rao","role":"Rāmāyaṇa & Mahābhārata pravachanams"},{"name":"Vyoma Linguistics Labs","role":"Stories Behind Temples · Sanskrit learning"},{"name":"Sydney Jana Ranjani","role":"Cultural competitions & recognition"},{"name":"Sydney Murugan Temple","role":"Pārāyaṇa venue & spiritual community"},{"name":"Sydney Ayyappa Temple","role":"Soundaryalaharī pārāyaṇa · Navarātri"},{"name":"Helensburgh Temple","role":"Bhagavad Gītā pārāyaṇa venue"},{"name":"Pranava Peetham","role":"Mānava Kathā · Gajendra Mokṣam · Poetry"}]},"events":{"section_title":"Events & Milestones","events_placeholder":"Event photographs will appear here","list":[{"date":"Sydney · April","title":"Śivapadam Recitation — Samavedam Shanmukha Sharma","desc":"Recited 10 Śivapadam poems composed by the renowned scholar in his presence during his Sydney visit. Received a special memento in recognition.","has_photo":true},{"date":"Sydney · Navarātri","title":"Soundaryalaharī Pārāyaṇa — Ayyappa Temple","desc":"Performed the complete pārāyaṇa of Soundaryalaharī (100 verses) at Sydney Ayyappa Temple across the nine sacred nights of Navarātri.","has_photo":true},{"date":"Helensburgh Temple","title":"Bhagavad Gītā — Ṣaṣṭipūrti Mahōtsavam","desc":"Chanted the complete Śrīmad Bhagavad Gītā on the occasion of Paṇḍit Rishikesh Bhattar's Ṣaṣṭipūrti (60th Birthday) Mahōtsavam — all 700 verses as a devotional offering.","has_photo":true},{"date":"Central Sanskrit University · This Year","title":"Sanskrit Olympiad — 1st Place in Australia","desc":"Achieved 1st place in Australia in the National Sanskrit Olympiad. Previously secured All India Rank 266 — two consecutive years of national-level recognition.","has_photo":true},{"date":"Mysore Datta Peetham","title":"Gold Medal — Bhagavad Gītā 700 Verses","desc":"Awarded the Gold Medal for memorising and reciting all 700 verses of the Śrīmad Bhagavad Gītā by the revered Mysore Datta Peetham.","has_photo":true},{"date":"Sydney · Avadānam","title":"Taṭavarti Kalyāṇ Avadānam","desc":"Participated as the Aprastuta Prasaṅga Pṛcchakudu (off-topic questioner) in the celebrated scholar's prestigious avadānam performance.","has_photo":true},{"date":"Pranava Peetham","title":"Mānava Kathā & Gajendra Mokṣam — Winner","desc":"Won prizes in both Mānava Kathā and Gajendra Mokṣam competitions under the guidance of Vaddiparti Padmakar.","has_photo":false},{"date":"Sydney Jana Ranjani","title":"Rāmāyaṇa & Daśāvatāra — Prizes","desc":"Multiple prizes in Rāmāyaṇa and Daśāvatāra storytelling competitions, and poetry competitions by Pranava Peetham.","has_photo":false},{"date":"Age ~3–4 years","title":"'Para Bhāṣa Lekundā Telugu Lo' — Winner","desc":"Won this Telugu language purity competition at the remarkable age of 3–4 — the earliest sign of his extraordinary linguistic gift.","has_photo":false}]},"parayana":{"section_title":"Pārāyaṇa","intro":"Karthikeya regularly performs these sacred pārāyaṇas. Each Sanskrit verse is displayed in three scripts — select your preferred script using the tabs below.","tab_te":"Telugu","tab_dev":"Devanāgarī","tab_iast":"IAST","stotras":[{"id":"bg","title":"Bhagavad Gītā · 700 Verses","te":"యదా యదా హి ధర్మస్య గ్లానిర్భవతి భారత ।\nఅభ్యుత్థానమధర్మస్య తదాత్మానం సృజామ్యహమ్ ॥","dev":"यदा यदा हि धर्मस्य ग्लानिर्भवति भारत ।\nअभ्युत्थानमधर्मस्य तदात्मानं सृजाम्यहम् ॥","iast":"yadā yadā hi dharmasya glānir bhavati bhārata |\nabhyutthānam adharmasya tadātmānaṁ sṛjāmy aham ||","attribution":"Bhagavad Gītā 4.7 — \"Whenever righteousness declines, I manifest myself.\" Memorised all 700 verses; Gold Medal, Mysore Datta Peetham."},{"id":"vs","title":"Viṣṇu Sahasranāma","te":"విశ్వం విష్ణుర్వషట్కారో భూతభవ్యభవత్ప్రభుః ।\nభూతకృద్భూతభృద్భావో భూతాత్మా భూతభావనః ॥","dev":"विश्वं विष्णुर्वषट्कारो भूतभव्यभवत्प्रभुः ।\nभूतकृद्भूतभृद्भावो भूतात्मा भूतभावनः ॥","iast":"viśvaṁ viṣṇur vaṣaṭkāro bhūtabhavyabhavatprabhuḥ |\nbhūtakṛd bhūtabhṛd bhāvo bhūtātmā bhūtabhāvanaḥ ||","attribution":"Opening śloka — performed regularly at Sydney Murugan Temple."},{"id":"ls","title":"Lalitā Sahasranāma","te":"శ్రీమాతా శ్రీమహారాజ్ఞీ శ్రీమత్సింహాసనేశ్వరీ ।\nచిదగ్నికుండసంభూతా దేవకార్యసముద్యతా ॥","dev":"श्रीमाता श्रीमहाराज्ञी श्रीमत्सिंहासनेश्वरी ।\nचिदग्निकुण्डसम्भूता देवकार्यसमुद्यता ॥","iast":"śrīmātā śrīmahārājñī śrīmatsinhāsaneśvarī |\ncidagnikuṇḍasambhūtā devakāryasamudyatā ||","attribution":"Opening nāmas — performed regularly at Sydney Murugan Temple."},{"id":"sl","title":"Soundaryalaharī · 100 Verses","te":"శివః శక్త్యా యుక్తో యది భవతి శక్తః ప్రభవితుం\nన చేదేవం దేవో న ఖలు కుశలః స్పందితుమపి ।","dev":"शिवः शक्त्या युक्तो यदि भवति शक्तः प्रभवितुं\nन चेदेवं देवो न खलु कुशलः स्पन्दितुमपि ।","iast":"śivaḥ śaktyā yukto yadi bhavati śaktaḥ prabhavituṁ\nna cedevaṁ devo na khalu kuśalaḥ spanditum api |","attribution":"Opening verse of Soundaryalaharī by Ādi Śaṅkarācārya — all 100 verses memorised and performed at Navarātri, Sydney Ayyappa Temple."},{"id":"sg","title":"Saṅkaṭanāśana Ganeśa Stotram","te":"ప్రణమ్య శిరసా దేవం గౌరీపుత్రం వినాయకమ్ ।\nభక్తావాసం స్మరేన్నిత్యమాయుఃకామార్థసిద్ధయే ॥","dev":"प्रणम्य शिरसा देवं गौरीपुत्रं विनायकम् ।\nभक्तावासं स्मरेन्नित्यमायुःकामार्थसिद्धये ॥","iast":"praṇamya śirasā devaṁ gaurīputraṁ vināyakam |\nbhaktāvāsaṁ smaren nityam āyuḥkāmārthasiddhaye ||","attribution":"Handwritten copy offered personally to Vaddiparti Padmakar, Samavedam Shanmukha Sharma and Madugula Naga Phani Sharma."}]},"support":{"section_title":"Support & Sponsor","intro":"Encouraging Karthikeya's spiritual and academic journey is a noble act of dharma. Your support enables him to participate in competitions, travel to events and produce more devotional and educational content.","cards":[{"icon":"🙏","title":"Blessings & Encouragement","desc":"Send your blessings, words of encouragement, or share his achievements within your community. Every message of support inspires him to continue forward."},{"icon":"📚","title":"Sponsor His Education","desc":"Support Sanskrit exam registrations, study materials, books, and his participation in competitions across Australia and India."},{"icon":"🎬","title":"Subscribe & Share","desc":"Subscribe to his YouTube channel @samskruti.info.1 and share his videos to help spread the beauty of Sanskrit and the living tradition of Sanātana Dharma."},{"icon":"🤝","title":"Invite to Your Event","desc":"Invite Karthikeya to perform pārāyaṇa, deliver a discourse, or participate in competitions and festivals at your temple, school or cultural organisation."}]},"testimonials":{"section_title":"Testimonials","list":[{"text":"Karthikeya's recitation of the Śivapadams was truly remarkable. The clarity of pronunciation, the depth of feeling, and the devotion in one so young is a rare and precious gift. May he continue to illuminate the tradition.","by":"Samavedam Shanmukha Sharma","role":"Renowned Telugu Scholar & Poet · Sydney Visit"},{"text":"It is heartening to see the next generation embrace Sanskrit with such commitment and joy. His performance in the Olympiad reflects both extraordinary natural talent and deeply disciplined practice.","by":"Central Sanskrit University","role":"Sanskrit Olympiad — 1st Place in Australia"},{"text":"During Navarātri, Karthikeya's pārāyaṇa of Soundaryalaharī filled our temple with a truly sacred vibration. Such devotion and memorisation from a 10-year-old is nothing short of divine grace.","by":"Sydney Ayyappa Temple","role":"Navarātri Soundaryalaharī Pārāyaṇa"}]},"youtube":{"section_title":"YouTube Channel","channel_name":"Samskruti · @samskruti.info.1","channel_sub":"Sanskrit · Telugu · Devotional · Pārāyaṇa · Discourses","channel_url":"https://www.youtube.com/@samskruti.info.1","bharatam_title":"Bhāratam Laghu Prasaṅgālu","bharatam_desc":"A YouTube series of short discourses on the Mahābhārata — watch the full playlist","bharatam_url":"https://www.youtube.com/watch?v=xB1CT8539J0&list=PL-V59KU-Q6hdZckKaiR-W8U7WNjyCiUiZ","videos":[{"title":"Bhagavad Gītā Pārāyaṇa","meta":"700 Verses · Karthikeya Pidaparthy"},{"title":"Sanskrit Recitations","meta":"Stotras · Sahasranāmas · Devotional Hymns"},{"title":"Bhāratam Laghu Prasaṅgālu","meta":"Mahābhārata Discourses · Full Series"}]},"contact":{"section_title":"Contact","intro":"To invite Karthikeya for events, pārāyaṇa, competitions or discourses — or simply to send your blessings and enquiries — please write to us.","location_city":"Sydney, New South Wales","location_country":"Australia","youtube_label":"YouTube Channel","form_name":"Your Name","form_email":"Your Email","form_subject":"Subject","form_message":"Your message, blessings "quote_iast":"vidyā dadāti vinayam","quote_te":"విద్య వినయమిస్తుంది.","quote_en":"జ్ఞానం వినయాన్ని ప్రసాదిస్తుంది.","cards":[{"title":"భాషలు","body":"తెలుగు, ఇంగ్లీషులో ప్రవాహంగా మాట్లాడతాడు; సంస్కృతంలో అపారమైన పాండిత్యం ఉంది. దేవనాగరి, తెలుగు మరియు Roman IAST లిపులు చదువుతాడు. 3-4 ఏళ్ళకే 'పర భాష లేకుండా తెలుగులో' పోటీ గెలుచుకున్నాడు."},{"title":"శాస్త్రజ్ఞానం","body":"చాగంటి కోటేశ్వర రావు గారి పూర్తి రామాయణ మరియు మహాభారత ప్రవచనాలు మొత్తం విన్నాడు. భాగవత, ఉపనిషత్తులు, ఇతిహాసాల కథలు తెలుసు. వ్యోమ లింగ్విస్టిక్స్ లాబ్స్ 'ఆలయాల వెనుక కథలు' శ్రేణిని కూడా అభ్యసించాడు."},{"title":"సమాజ సేవ & భక్తి","body":"సిడ్నీ మురుగన్ ఆలయంలో విష్ణు సహస్రనామ, లలితా సహస్రనామ పారాయణ నిత్యం నిర్వహిస్తాడు. నవరాత్రిలో సిడ్నీ అయ్యప్ప ఆలయంలో సౌందర్యలహరి పారాయణ చేశాడు. హెలెన్స్‌బర్గ్ ఆలయంలో సమగ్ర భగవద్గీత పఠించాడు."}]},"profile":{"section_title":"విజయాలు & ప్రొఫైల్","journey_title":"సంస్కృత యాత్ర","journey":"కార్తికేయ సంస్కృతంపై ప్రేమ చాలా చిన్న వయసులోనే ఇంట్లో మొదలైంది. అతను పాఠశాలకు వెళ్ళే ముందే, సంస్కృత శ్లోకాల శబ్దాలు మరియు లయలతో నిండిపోయాడు — కుటుంబసభ్యులు స్తోత్రాలు మరియు ప్రార్థనలు పఠించడం వినేవాడు. ఈ ప్రారంభ నిమజ్జనం అసాధారణమైన ఆధ్యాత్మిక మరియు విద్యా ప్రయాణానికి పునాది వేసింది.\n\nసంస్కృత భారతీ పరీక్షా కార్యక్రమం ద్వారా అతని అధికారిక సంస్కృత పరీక్షలు అద్భుతమైన శ్రేష్ఠతను సాధించాయి:\n\n• ఆయనమ్ (2022) — 100%\n• సారిణీ (2023) — 98%\n• సరళా (2024) — 94%\n• సుగమా (2025) — 98%\n• సరసా (2026) — 96%\n\nవరుసగా ఐదు సంవత్సరాల పాటు 97.2% సగటుతో విజయం సాధించాడు — వేదాల భాషపై నిజమైన ప్రేమకు నిదర్శనం. వ్యోమ లింగ్విస్టిక్స్ లాబ్స్ వారి 'ఆలయాల వెనుక కథలు' వీడియో శ్రేణిని చూసి భారతదేశ పవిత్ర భూగోళంతో ముడిపడిన సాంస్కృతిక మరియు పౌరాణిక వారసత్వాన్ని లోతుగా అర్థం చేసుకున్నాడు.","achievements":[{"icon":"🥇","title":"స్వర్ణపతకం — భగవద్గీత","desc":"శ్రీమద్భగవద్గీత 700 శ్లోకాలు కంఠస్థం చేసి అప్రమేయంగా పఠించినందుకు మైసూర్ దత్త పీఠం నుండి ప్రతిష్ఠాత్మక స్వర్ణపతకం అందుకున్నాడు — జ్ఞాపకశక్తి, భక్తి మరియు శిక్షణకు మహాసాధన.","year":"మైసూర్ దత్త పీఠం","tag":"gold"},{"icon":"📖","title":"భగవద్గీత — హెలెన్స్‌బర్గ్ ఆలయం","desc":"పండిట్ రిషికేష్ భట్టర్ గారి షష్టిపూర్తి మహోత్సవం శుభ సందర్భంగా హెలెన్స్‌బర్గ్ ఆలయంలో సమగ్ర శ్రీమద్భగవద్గీత (18 అధ్యాయాలు, 700 శ్లోకాలు) పఠించాడు — అపూర్వమైన గౌరవం మరియు హృదయస్పర్శి భక్తి నివేదన.","year":"హెలెన్స్‌బర్గ్ ఆలయం · షష్టిపూర్తి మహోత్సవం","tag":"gold"},{"icon":"🏆","title":"సంస్కృత ఒలింపియాడ్ — ఆస్ట్రేలియా ప్రథమ","desc":"కేంద్ర సంస్కృత విశ్వవిద్యాలయం జాతీయ సంస్కృత ఒలింపియాడ్‌లో వరుసగా రెండు సంవత్సరాలు ఆస్ట్రేలియాలో ప్రథమ స్థానం. గత సంవత్సరం భారతదేశంలో వేలాది విద్యార్థులతో పోటీపడి అఖిల భారత స్థానం 266.","year":"కేంద్ర సంస్కృత విశ్వవిద్యాలయం · వరుసగా 2 సంవత్సరాలు","tag":"olympiad"},{"icon":"📊","title":"సంస్కృత పరీక్షలు — 5 సంవత్సరాల శ్రేష్ఠత","desc":"ఆయనమ్ 2022 (100%) · సారిణీ 2023 (98%) · సరళా 2024 (94%) · సుగమా 2025 (98%) · సరసా 2026 (96%). వరుసగా ఐదు సంవత్సరాలు 97.2% సగటుతో — ప్రతి స్థాయి మరింత అభివృద్ధి చెందిన కోర్సు.","year":"సంస్కృత భారతీ కార్యక్రమం · 2022–2026","tag":"olympiad"},{"icon":"🕉","title":"సౌందర్యలహరి పారాయణ","desc":"ఆదిశంకరాచార్యుల సౌందర్యలహరి 100 శ్లోకాలు కంఠస్థం చేసి — దైవమాతపై అత్యంత ప్రశస్తమైన సంస్కృత స్తోత్రాలలో ఒకటి — నవరాత్రి సందర్భంగా సిడ్నీ అయ్యప్ప ఆలయంలో పూర్తి పారాయణ చేశాడు.","year":"సిడ్నీ అయ్యప్ప ఆలయం · నవరాత్రి","tag":"parayana"},{"icon":"📜","title":"విష్ణు & లలితా సహస్రనామ","desc":"సిడ్నీ మురుగన్ ఆలయంలో విష్ణు సహస్రనామ మరియు లలితా సహస్రనామ పారాయణ నిత్యం నిర్వహిస్తాడు — సిడ్నీ హిందూ సమాజ ఆధ్యాత్మిక జీవనానికి సేవ.","year":"సిడ్నీ మురుగన్ ఆలయం · నిత్యం","tag":"parayana"},{"icon":"🎤","title":"శివపదాలు — సమవేదం శంఖముఖ శర్మ","desc":"ప్రఖ్యాత పండితుడు సమవేదం శంఖముఖ శర్మ గారి సిడ్నీ సందర్శన సందర్భంలో వారి సమక్షంలో వారు రచించిన 10 శివపదాలు పఠించాడు. మహాపండితుడు హృదయపూర్వకంగా స్వాగతించి ప్రత్యేక స్మారక చిహ్నం అందించారు.","year":"సిడ్నీ · ఏప్రిల్ · సమవేదం శంఖముఖ శర్మ సందర్శన","tag":"scholar"},{"icon":"✍","title":"సంకటనాశన గణేశ స్తోత్రం — పండితులకు అర్పణ","desc":"సంకటనాశన గణేశ స్తోత్రం స్వహస్తాలతో లిఖించి ముగ్గురు విద్వాంసులకు — వద్దిపర్తి పద్మకర్, సమవేదం శంఖముఖ శర్మ మరియు మడుగుల నాగఫణి శర్మలకు — వ్యక్తిగతంగా అర్పించాడు.","year":"ము const LANGS=["en","te","sa"];

const NAVKEYS=["about","profile","credits","events","parayana","support","testimonials","contact","youtube"];

let CL="en",T={};

function s(id,v){const e=document.getElementById(id);if(e&&v!=null)e.innerHTML=v;}
function ph(id,v){const e=document.getElementById(id);if(e)e.placeholder=v||"";}

// ── LANGUAGE SWITCH ───────────────────────────────────────────────────────────
function setLang(lang){
  CL=lang;
  T=ALL[lang]||ALL.en;
  // Body font class
  const b=document.getElementById("body");
  b.classList.remove("te","sa");
  if(lang==="te") b.classList.add("te");
  if(lang==="sa") b.classList.add("sa");
  // Lang pill highlight
  document.querySelectorAll(".lbtn").forEach(btn=>
    btn.classList.toggle("active", btn.dataset.lang===lang));
  // Settings panel lang highlight
  document.querySelectorAll(".slb").forEach((btn,i)=>
    btn.classList.toggle("active", LANGS[i]===lang));
  document.documentElement.lang={en:"en",te:"te",sa:"sa"}[lang]||"en";
  renderAll();
  try{localStorage.setItem("kp-lang",lang);}catch(e){}
}

      </div>
      <div id="vd${st.id}0" class="sv sv-te" >${(st.te||"").replace(/\n/g,"<br>")}</div>
      <div id="vd${st.id}1" class="sv sv-dev" style="display:none">${(st.dev||"").replace(/\n/g,"<br>")}</div>
      <div id="vd${st.id}2" class="sv sv-iast" style="display:none">${(st.iast||"").replace(/\n/g,"<br>")}</div>
      <div class="sattr">${st.attribution}</div>
    </div>`).join("");

  // Support
  s("sp-ti",support.section_title); s("sp-in",support.intro);
  const spg=document.getElementById("spGr");
  if(spg) spg.innerHTML=(support.cards||[]).map(c=>
    `<div class="spc"><div class="spi">${c.icon}</div><h3>${c.title}</h3><p>${c.desc}</p></div>`).join("");

  // Testimonials
  s("te-ti",testimonials.section_title);
  const teg=document.getElementById("teGr");
  if(teg) teg.innerHTML=(testimonials.list||[]).map(item=>
    `<div class="tec">
      <div class="tec-qm">"</div>
      <p class="tec-text">${item.text}</p>
      <div class="tec-by">${item.by}</div>
      <div class="tec-role">${item.role}</div>
    </div>`).join("");

  // YouTube
  s("yt-ti",youtube.section_title);
  const ytc=document.getElementById("ytCt");
  if(ytc) ytc.innerHTML=`
    <a href="${youtube.channel_url||"#"}" target="_blank" rel="noopener" class="yt-ch">
      <span style="font-size:25px;flex-shrink:0">▶</span>
      <div><div class="yt-chn">${youtube.channel_name||""}</div>
           <div class="yt-chs">${youtube.channel_sub||""}</div></div>
      <span style="margin-left:auto;color:var(--gold);font-size:17px">↗</span>
    </a>
    <a href="${youtube.bharatam_url||"#"}" target="_blank" rel="noopener" class="yt-bh">
      <span style="font-size:32px;flex-shrink:0">📜</span>
      <div><div class="yt-bht">${youtube.bharatam_title||""}</div>
           <div class="yt-bhd">${youtube.bharatam_desc||""}</div></div>
      <span style="margin-left:auto;color:var(--gold);font-size:17px">↗</span>
    </a>
    <div class="ytgr">${(youtube.videos||[]).map(v=>
      `<a href="${youtube.channel_url||"#"}" target="_blank" rel="noopener" class="yt-card">
        <div class="yt-th">▶</div>
        <div class="yt-inf">
          <div class="yt-vt">${v.title}</div>
          <div class="yt-vm">${v.meta}</div>
        </div>
      </a>`).join("")}</div>`;

  // Contact
  s("co-ti",contact.section_title); s("co-in",contact.intro);
  s("co-cy",contact.location_city); s("co-cn",contact.location_country);
  s("co-yl",contact.youtube_label); s("co-qs",contact.quote_sa); s("co-qe",contact.quote_en);
  ph("fn",contact.form_name); ph("fe",contact.form_email);
  ph("fs2",contact.form_subject); ph("fm",contact.form_message);
  s("fbt",contact.form_submit);
  s("ftk",contact.form_thanks);

  // Footer
  s("ft-sa",footer.sa); s("ft-ia",footer.iast);
  const ftcp=document.getElementById("ft-cp");
  if(ftcp) ftcp.innerHTML=`${footer.copy||""} · <a href="https://www.youtube.com/@samskruti.info.1" target="_blank" rel="noopener" style="color:var(--gold);text-decoration:none">YouTube</a>`;
}

// ── PARAYANA SCRIPT SWITCHER ──────────────────────────────────────────────────
function showVerse(id,idx,tabsEl){
  tabsEl.querySelectorAll(".stab").forEach((t,i)=>t.classList.toggle("active",i===idx));
  [0,1,2].forEach(i=>{
    const v=document.getElementById("vd"+id+i);
    if(v) v.style.display=i===idx?"":"none";
  });
}

// ── NAVIGATION ────────────────────────────────────────────────────────────────
function goTo(id){document.getElementById(id)?.scrollIntoView({behavior:"smooth"});}
function mNav(id){document.getElementById("mobNav").classList.remove("open");setTimeout(()=>goTo(id),80);}
function toggleMob(){document.getElementById("mobNav").classList.toggle("open");}

// Active nav highlight via IntersectionObserver
const secIds=["home","about","profile","credits","events","parayana","support","testimonials","youtube","contact"];
secIds.forEach(id=>{
  const el=document.getElementById(id);
  if(!el) return;
  new IntersectionObserver(entries=>{
    if(entries[0].isIntersecting)
      document.querySelectorAll(".nl").forEach((a,i)=>
        a.classList.toggle("active", a.getAttribute("data-nav")===id));
  },{threshold:.3}).observe(el);
});

// ── SETTINGS ─────────────────────────────────────────────────────────────────
function toggleSett(){
  document.getElementById("sPanel").classList.toggle("open");
  document.getElementById("sOverlay").classList.toggle("open");
}
function closeSett(){
  document.getElementById("sPanel").classList.remove("open");
  document.getElementById("sOverlay").classList.remove("open");
}

// ── FONT SIZE ────────────────────────────────────────────────────────────────
function setFS(v){
  document.documentElement.style.fontSize=v+"px";
  document.getElementById("fsv").textContent=v;
  try{localStorage.setItem("kp-fs",v);}catch(e){}
}

// ── ACCENT COLOUR ─────────────────────────────────────────────────────────────
function setAcc(gold,goldL,goldXL,el){
  const r=document.documentElement;
  r.style.setProperty("--gold",gold);
  r.style.setProperty("--gold-l",goldL);
  r.style.setProperty("--gold-xl",goldXL);
  document.querySelectorAll(".sw").forEach(s=>s.classList.remove("active"));
  if(el) el.classList.add("active");
}

// ── PHOTO UPLOAD (for future use) ─────────────────────────────────────────────
function handlePhoto(input, idx){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const cards=document.querySelectorAll(".cert-ph");
    if(cards[idx]){
      cards[idx].innerHTML=`<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:8px"/>`;
    }
  };
  reader.readAsDataURL(file);
}

// ── CONTACT FORM ──────────────────────────────────────────────────────────────
function submitForm(e){
  e.preventDefault();
  const tk=document.getElementById("ftk");
  if(tk) tk.style.display="block";
  e.target.reset();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
window.addEventListener("DOMContentLoaded",()=>{
  try{
    const fs=localStorage.getItem("kp-fs");
    if(fs){setFS(fs);const sl=document.querySelector("input[type=range]");if(sl)sl.value=fs;}
    const lg=localStorage.getItem("kp-lang")||"en";
    setLang(lg);
  } catch(e){
    setLang("en");
  }
});
</script>
