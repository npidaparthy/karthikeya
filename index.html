<script>
const ALL = {"en":{"nav":{"home":"Home","about":"About","profile":"Profile","credits":"Credits","events":"Events","parayana":"Pārāyaṇa","support":"Sponsor","testimonials":"Testimonials","contact":"Contact","youtube":"YouTube","logo_name":"Samskruti","logo_tag":"సంస్కృతి • संस्कृति"},"hero":{"greeting":"Śrī Gaṇeśāya Namaḥ","name":"Karthikeya Pidaparthy","age_location":"Age 10 · Sydney, Australia","description":"A young scholar of Sanskrit, Telugu and English — who memorised all 700 verses of the Bhagavad Gītā and received the Gold Medal from Mysore Datta Peetham; laureate of the Sanskrit Olympiad (1st in Australia); devoted pārāyaṇa seeker in the grand tradition of Sanātana Dharma.","btn_achievements":"View Achievements","btn_youtube":"▶ YouTube Channel","badges":["🏅 Gold Medal — Mysore Datta Peetham","🥇 Sanskrit Olympiad — 1st in Australia","📖 Bhagavad Gītā · 700 Verses","🕉 Soundaryalaharī · 100 Verses","🎤 Śivapadams by Samavedam"]},"about":{"section_title":"About Karthikeya","para1":"Born in Sydney, Australia into a family deeply rooted in the Vedic tradition, Karthikeya Pidaparthy has been immersed in the world of Sanskrit, scripture and classical Telugu literature from his earliest years. Far from the land of his ancestors yet firmly anchored in their wisdom, he embodies the living continuity of Sanātana Dharma.","para2":"At the remarkable age of 10, he balances the demands of a modern Australian schooling with daily devotional practice, regular temple pārāyaṇa, and serious academic engagement with Sanskrit — a feat that has drawn the admiration of revered scholars from across India and the diaspora.","quote_sa":"विद्या ददाति विनयम् ।","quote_iast":"vidyā dadāti vinayam","quote_te":"విద్య వినయమిస్తుంది.","quote_en":"Knowledge bestows humility.","cards":[{"title":"Languages","body":"Fluent in Telugu, English and profoundly versed in Sanskrit. He reads and writes in Devanāgarī, Telugu and Roman IAST scripts. His Telugu is so pure that at age 3–4 he won the 'Para Bhāṣa Lekundā Telugu Lo' competition — spoken Telugu free of foreign words."},{"title":"Scriptural Depth","body":"Has listened to the complete Rāmāyaṇa and Mahābhārata pravachanams of Chaganti Koteswara Rao in their entirety. Familiar with stories from the Bhāgavata, Upaniṣads and all major Itihāsas. He has also explored the 'Stories Behind Temples' series by Vyoma Linguistics Labs."},{"title":"Community & Devotion","body":"Regularly performs Viṣṇu Sahasranāma and Lalitā Sahasranāma pārāyaṇa at Sydney Murugan Temple. Performed Soundaryalaharī at Navarātri in Sydney Ayyappa Temple. Chanted the complete Bhagavad Gītā at Helensburgh Temple."}]},"profile":{"section_title":"Profile & Achievements","journey_title":"The Sanskrit Journey","journey":"Karthikeya's love for Sanskrit was kindled at home from a very young age. Long before formal schooling, he was immersed in the sounds and rhythms of Sanskrit verses, listening to his family recite stotras and prayers. This early immersion laid the foundation for what would become an extraordinary academic and spiritual journey.\n\nHis formal Sanskrit examinations through the Saṃskṛta Bhāratī programme trace a remarkable arc of excellence — each year he has not merely passed but mastered each level with distinction:\n\n• Āyanam (2022) — 100%\n• Sāriṇī (2023) — 98%\n• Saralā (2024) — 94%\n• Sugamā (2025) — 98%\n• Sarasā (2026) — 96%\n\nAcross five consecutive years, he has maintained an average of 97.2% — a testament to consistent dedication and genuine love for the language of the Vedas. He also explored the rich 'Stories Behind Temples' video series by Vyoma Linguistics Labs, deepening his understanding of the cultural and mythological heritage woven into India's sacred geography.","achievements":[{"icon":"🥇","title":"Gold Medal — Bhagavad Gītā","desc":"Awarded the prestigious Gold Medal by Mysore Datta Peetham for memorising and flawlessly reciting all 700 verses of the Śrīmad Bhagavad Gītā — a monumental feat of memory, devotion and discipline.","year":"Mysore Datta Peetham","tag":"gold","cert_url":"assets/docs/gold-medal-certificate-bhagavad-gita.pdf"},{"icon":"📖","title":"Bhagavad Gītā — Helensburgh Temple","desc":"Chanted the complete Śrīmad Bhagavad Gītā (all 18 chapters, 700 verses) at Helensburgh Temple on the auspicious occasion of Paṇḍit Rishikesh Bhattar's Ṣaṣṭipūrti Mahōtsavam — a rare honour and a deeply moving devotional offering.","year":"Helensburgh Temple · Ṣaṣṭipūrti Mahōtsavam","tag":"gold"},{"icon":"🏆","title":"Sanskrit Olympiad — AIR 266 (2024) · 1st in Australia (2025)","desc":"2024 — All India Rank 266 in the Central Sanskrit University National Sanskrit Olympiad, competing in the 13–17 age category while he was just 8 years old. 2025 — 1st place in Australia in the General Category (Indian Knowledge Systems · IKS), competing as an open-category participant at the age of 9. Two years of extraordinary national-level achievement — age never a barrier.","year":"Central Sanskrit University · 2024 & 2025","tag":"olympiad","cert_url":"assets/docs/sanskrit-olympiad-certificate-2024.pdf","cert_url2":"assets/docs/sanskrit-olympiad-certificate-2025.pdf"},{"icon":"📊","title":"Sanskrit Examinations — 5 Years of Excellence","desc":"Āyanam 2022 (100%) · Sāriṇī 2023 (98%) · Saralā 2024 (94%) · Sugamā 2025 (98%) · Sarasā 2026 (96%). Five years of consecutive excellence with a 97.2% average — each level progressively more advanced.","year":"Saṃskṛta Bhāratī Programme · 2022–2026","tag":"olympiad"},{"icon":"🕉","title":"Soundaryalaharī Pārāyaṇa","desc":"Memorised all 100 verses of Ādi Śaṅkarācārya's Soundaryalaharī — one of the most celebrated Sanskrit hymns on the Divine Mother — and performed the complete pārāyaṇa at Sydney Ayyappa Temple during Navarātri.","year":"Sydney Ayyappa Temple · Navarātri","tag":"parayana"},{"icon":"📜","title":"Viṣṇu & Lalitā Sahasranāma","desc":"Regularly performs the complete Viṣṇu Sahasranāma and Lalitā Sahasranāma pārāyaṇa at Sydney Murugan Temple, contributing to the devotional life of Sydney's Hindu community.","year":"Sydney Murugan Temple · Regular","tag":"parayana"},{"icon":"🎤","title":"Śivapadams — Samavedam Shanmukha Sharma","desc":"Recited 10 Śivapadam poems composed by the renowned scholar Samavedam Shanmukha Sharma in his presence during his Sydney visit. The great scholar was moved and presented Karthikeya with a special memento in appreciation.","year":"Sydney · April · Samavedam Shanmukha Sharma's visit","tag":"scholar"},{"icon":"✍","title":"Saṅkaṭanāśana Ganeśa Stotram — Offered to Scholars","desc":"Personally transcribed and offered a handwritten copy of the Saṅkaṭanāśana Ganeśa Stotram to three eminent scholars: Vaddiparti Padmakar, Samavedam Shanmukha Sharma and Madugula Naga Phani Sharma.","year":"Personal offering to three great scholars","tag":"scholar"},{"icon":"🎭","title":"Avadānam — Aprastuta Prasaṅga","desc":"Participated as the Aprastuta Prasaṅga Pṛcchakudu (off-topic questioner) in the prestigious avadānam performed by the celebrated poet-scholar Taṭavarti Kalyāṇ — a role requiring sharp wit and spontaneous creativity.","year":"Taṭavarti Kalyāṇ Avadānam · Sydney","tag":"scholar"},{"icon":"🏅","title":"Mānava Kathā & Gajendra Mokṣam — Winner","desc":"Won prizes in the Mānava Kathā and Gajendra Mokṣam competitions organised by Pranava Peetham under the guidance of Vaddiparti Padmakar.","year":"Pranava Peetham · Vaddiparti Padmakar","tag":"competition"},{"icon":"🎊","title":"Cultural Competitions — Multiple Prizes","desc":"Won multiple prizes in Rāmāyaṇa and Daśāvatāra storytelling competitions organised by Sydney Jana Ranjani, and in poetry competitions organised by Pranava Peetham.","year":"Sydney Jana Ranjani · Pranava Peetham","tag":"competition"},{"icon":"🗣","title":"'Para Bhāṣa Lekundā Telugu Lo' — Winner","desc":"At the extraordinary age of 3–4 years, won the 'Para Bhāṣa Lekundā Telugu Lo' competition — speaking pure Telugu entirely free of borrowed foreign words. A remarkable early indication of his linguistic gifts.","year":"Age ~3–4 years · Telugu language competition","tag":"competition"},{"icon":"📺","title":"Bhāratam Laghu Prasaṅgālu","desc":"Delivered a published series of short discourses on the Mahābhārata on YouTube, demonstrating a depth of understanding of the great Itihāsa far beyond his years. He has listened to the complete Bhārata and Rāmāyaṇa pravachanams of Chaganti Koteswara Rao.","year":"YouTube Series · samskruti.info.1","tag":"discourse"}],"exam_table_title":"Sanskrit Examination Record","exam_table":[{"year":"2022","exam":"Āyanam","score":"100%","grade":"🌟","doc_url":"assets/docs/exam-ayanam-2022.pdf"},{"year":"2023","exam":"Sāriṇī","score":"98%","grade":"🌟","doc_url":"assets/docs/exam-sarani-2023.pdf"},{"year":"2024","exam":"Saralā","score":"94%","grade":"⭐","doc_url":"assets/docs/exam-sarala-2024.pdf"},{"year":"2025","exam":"Sugamā","score":"98%","grade":"🌟","doc_url":"assets/docs/exam-sugama-2025.pdf"},{"year":"2026","exam":"Sarasā","score":"96%","grade":"🌟","doc_url":"assets/docs/exam-sarasa-2026.pdf"}],"photo_placeholder":"Certificate & Achievement Photos","photo_placeholder_sub":"Certificates and event photographs will be displayed here"},"credits":{"section_title":"Credits & Gratitude","intro":"Karthikeya's remarkable journey has been shaped by the grace and guidance of great scholars, revered organisations and a loving community. With deep gratitude:","list":[{"name":"Mysore Datta Peetham","role":"Gold Medal — Bhagavad Gītā Pārāyaṇa"},{"name":"Central Sanskrit University","role":"Sanskrit Olympiad — organiser & recognition"},{"name":"Samavedam Shanmukha Sharma","role":"Śivapadam composer · Inspiration · Memento"},{"name":"Vaddiparti Padmakar","role":"Pranava Peetham · Poetry mentor · Competitions"},{"name":"Madugula Naga Phani Sharma","role":"Scholar · Blessing · Encouragement"},{"name":"Paṇḍit Rishikesh Bhattar","role":"Ṣaṣṭipūrti Mahōtsavam · Helensburgh Temple"},{"name":"Taṭavarti Kalyāṇ","role":"Avadānam — Aprastuta Prasaṅga honour"},{"name":"Chaganti Koteswara Rao","role":"Rāmāyaṇa & Mahābhārata pravachanams"},{"name":"Vyoma Linguistics Labs","role":"Stories Behind Temples · Sanskrit learning"},{"name":"Sydney Jana Ranjani","role":"Cultural competitions & recognition"},{"name":"Sydney Murugan Temple","role":"Pārāyaṇa venue & spiritual community"},{"name":"Sydney Ayyappa Temple","role":"Soundaryalaharī pārāyaṇa · Navarātri"},{"name":"Helensburgh Temple","role":"Bhagavad Gītā pārāyaṇa venue"},{"name":"Pranava Peetham","role":"Mānava Kathā · Gajendra Mokṣam · Poetry"}]},"events":{"section_title":"Events & Milestones","events_placeholder":"Event photographs will appear here","list":[{"date":"Sydney · April","title":"Śivapadam Recitation — Samavedam Shanmukha Sharma","desc":"Recited 10 Śivapadam poems composed by the renowned scholar in his presence during his Sydney visit. Received a special memento in recognition.","has_photo":true},{"date":"Sydney · Navarātri","title":"Soundaryalaharī Pārāyaṇa — Ayyappa Temple","desc":"Performed the complete pārāyaṇa of Soundaryalaharī (100 verses) at Sydney Ayyappa Temple across the nine sacred nights of Navarātri.","has_photo":true},{"date":"Helensburgh Temple","title":"Bhagavad Gītā — Ṣaṣṭipūrti Mahōtsavam","desc":"Chanted the complete Śrīmad Bhagavad Gītā on the occasion of Paṇḍit Rishikesh Bhattar's Ṣaṣṭipūrti (60th Birthday) Mahōtsavam — all 700 verses as a devotional offering.","has_photo":true},{"date":"Central Sanskrit University · This Year","title":"Sanskrit Olympiad — 1st Place in Australia","desc":"Achieved 1st place in Australia in the National Sanskrit Olympiad. Previously secured All India Rank 266 — two consecutive years of national-level recognition.","has_photo":true},{"date":"Mysore Datta Peetham","title":"Gold Medal — Bhagavad Gītā 700 Verses","desc":"Awarded the Gold Medal for memorising and reciting all 700 verses of the Śrīmad Bhagavad Gītā by the revered Mysore Datta Peetham.","has_photo":true},{"date":"Sydney · Avadānam","title":"Taṭavarti Kalyāṇ Avadānam","desc":"Participated as the Aprastuta Prasaṅga Pṛcchakudu (off-topic questioner) in the celebrated scholar's prestigious avadānam performance.","has_photo":true},{"date":"Pranava Peetham","title":"Mānava Kathā & Gajendra Mokṣam — Winner","desc":"Won prizes in both Mānava Kathā and Gajendra Mokṣam competitions under the guidance of Vaddiparti Padmakar.","has_photo":false},{"date":"Sydney Jana Ranjani","title":"Rāmāyaṇa & Daśāvatāra — Prizes","desc":"Multiple prizes in Rāmāyaṇa and Daśāvatāra storytelling competitions, and poetry competitions by Pranava Peetham.","has_photo":false},{"date":"Age ~3–4 years","title":"'Para Bhāṣa Lekundā Telugu Lo' — Winner","desc":"Won this Telugu language purity competition at the remarkable age of 3–4 — the earliest sign of his extraordinary linguistic gift.","has_photo":false}]},"parayana":{"section_title":"Pārāyaṇa","intro":"Karthikeya regularly performs these sacred pārāyaṇas. Each Sanskrit verse is displayed in three scripts — select your preferred script using the tabs below.","tab_te":"Telugu","tab_dev":"Devanāgarī","tab_iast":"IAST","stotras":[{"id":"bg","title":"Bhagavad Gītā · 700 Verses","te":"యదా యదా హి ధర్మస్య గ్లానిర్భవతి భారత ।\nఅభ్యుత్థానమధర్మస్య తదాత్మానం సృజామ్యహమ్ ॥","dev":"यदा यदा हि धर्मस्य ग्लानिर्भवति भारत ।\nअभ्युत्थानमधर्मस्य तदात्मानं सृजाम्यहम् ॥","iast":"yadā yadā hi dharmasya glānir bhavati bhārata |\nabhyutthānam adharmasya tadātmānaṁ sṛjāmy aham ||","attribution":"Bhagavad Gītā 4.7 — \"Whenever righteousness declines, I manifest myself.\" Memorised all 700 verses; Gold Medal, Mysore Datta Peetham."},{"id":"vs","title":"Viṣṇu Sahasranāma","te":"విశ్వం విష్ణుర్వషట్కారో భూతభవ్యభవత్ప్రభుః ।\nభూతకృద్భూతభృద్భావో భూతాత్మా భూతభావనః ॥","dev":"विश्वं विष्णुर्वषट्कारो भूतभव्यभवत्प्रभुः ।\nभूतकृद्भूतभृद्भावो भूतात्मा भूतभावनः ॥","iast":"viśvaṁ viṣṇur vaṣaṭkāro bhūtabhavyabhavatprabhuḥ |\nbhūtakṛd bhūtabhṛd bhāvo bhūtātmā bhūtabhāvanaḥ ||","attribution":"Opening śloka — performed regularly at Sydney Murugan Temple."},{"id":"ls","title":"Lalitā Sahasranāma","te":"శ్రీమాతా శ్రీమహారాజ్ఞీ శ్రీమత్సింహాసనేశ్వరీ ।\nచిదగ్నికుండసంభూతా దేవకార్యసముద్యతా ॥","dev":"श्रीमाता श्रीमहाराज्ञी श्रीमत्सिंहासनेश्वरी ।\nचिदग्निकुण्डसम्भूता देवकार्यसमुद्यता ॥","iast":"śrīmātā śrīmahārājñī śrīmatsinhāsaneśvarī |\ncidagnikuṇḍasambhūtā devakāryasamudyatā ||","attribution":"Opening nāmas — performed regularly at Sydney Murugan Temple."},{"id":"sl","title":"Soundaryalaharī · 100 Verses","te":"శివః శక్త్యా యుక్తో యది భవతి శక్తః ప్రభవితుం\nన చేదేవం దేవో న ఖలు కుశలః స్పందితుమపి ।","dev":"शिवः शक्त्या युक्तो यदि भवति शक्तः प्रभवितुं\nन चेदेवं देवो न खलु कुशलः स्पन्दितुमपि ।","iast":"śivaḥ śaktyā yukto yadi bhavati śaktaḥ prabhavituṁ\nna cedevaṁ devo na khalu kuśalaḥ spanditum api |","attribution":"Opening verse of Soundaryalaharī by Ādi Śaṅkarācārya — all 100 verses memorised and performed at Navarātri, Sydney Ayyappa Temple."},{"id":"sg","title":"Saṅkaṭanāśana Ganeśa Stotram","te":"ప్రణమ్య శిరసా దేవం గౌరీపుత్రం వినాయకమ్ ।\nభక్తావాసం స్మరేన్నిత్యమాయుఃకామార్థసిద్ధయే ॥","dev":"प्रणम्य शिरसा देवं गौरीपुत्रं विनायकम् ।\nभक्तावासं स्मरेन्नित्यमायुःकामार्थसिद्धये ॥","iast":"praṇamya śirasā devaṁ gaurīputraṁ vināyakam |\nbhaktāvāsaṁ smaren nityam āyuḥkāmārthasiddhaye ||","attribution":"Handwritten copy offered personally to Vaddiparti Padmakar, Samavedam Shanmukha Sharma and Madugula Naga Phani Sharma."}]},"support":{"section_title":"Support & Sponsor","intro":"Encouraging Karthikeya's spiritual and academic journey is a noble act of dharma. Your support enables him to participate in competitions, travel to events and produce more devotional and educational content.","cards":[{"icon":"🙏","title":"Blessings & Encouragement","desc":"Send your blessings, words of encouragement, or share his achievements within your community. Every message of support inspires him to continue forward."},{"icon":"📚","title":"Sponsor His Education","desc":"Support Sanskrit exam registrations, study materials, books, and his participation in competitions across Australia and India."},{"icon":"🎬","title":"Subscribe & Share","desc":"Subscribe to his YouTube channel @samskruti.info.1 and share his videos to help spread the beauty of Sanskrit and the living tradition of Sanātana Dharma."},{"icon":"🤝","title":"Invite to Your Event","desc":"Invite Karthikeya to perform pārāyaṇa, deliver a discourse, or participate in competitions and festivals at your temple, school or cultural organisation."}]},"testimonials":{"section_title":"Testimonials","list":[{"text":"Karthikeya's recitation of the Śivapadams was truly remarkable. The clarity of pronunciation, the depth of feeling, and the devotion in one so young is a rare and precious gift. May he continue to illuminate the tradition.","by":"Samavedam Shanmukha Sharma","role":"Renowned Telugu Scholar & Poet · Sydney Visit"},{"text":"It is heartening to see the next generation embrace Sanskrit with such commitment and joy. His performance in the Olympiad reflects both extraordinary natural talent and deeply disciplined practice.","by":"Central Sanskrit University","role":"Sanskrit Olympiad — 1st Place in Australia"},{"text":"During Navarātri, Karthikeya's pārāyaṇa of Soundaryalaharī filled our temple with a truly sacred vibration. Such devotion and memorisation from a 10-year-old is nothing short of divine grace.","by":"Sydney Ayyappa Temple","role":"Navarātri Soundaryalaharī Pārāyaṇa"}]},"youtube":{"section_title":"YouTube Channel","channel_name":"Samskruti · @samskruti.info.1","channel_sub":"Sanskrit · Telugu · Devotional · Pārāyaṇa · Discourses","channel_url":"https://www.youtube.com/@samskruti.info.1","bharatam_title":"Bhāratam Laghu Prasaṅgālu","bharatam_desc":"A YouTube series of short discourses on the Mahābhārata — watch the full playlist","bharatam_url":"https://www.youtube.com/playlist?list=PL-V59KU-Q6hdZckKaiR-W8U7WNjyCiUiZ","videos":[{"title":"Bhagavad Gītā Pārāyaṇa","meta":"700 Verses · Karthikeya Pidaparthy","url":"https://youtu.be/naVikkxGtw0"},{"title":"Sanskrit Recitations","meta":"Stotras · Sahasranāmas · Devotional Hymns","url":"https://www.youtube.com/playlist?list=PL-V59KU-Q6hdWl7wLk2336J2QeSe9B-1p"},{"title":"Bhāratam Laghu Prasaṅgālu","meta":"Mahābhārata Discourses · Full Series","url":"https://www.youtube.com/playlist?list=PL-V59KU-Q6hdZckKaiR-W8U7WNjyCiUiZ"}]},"contact":{"section_title":"Contact","intro":"To invite Karthikeya for events, pārāyaṇa, competitions or discourses — or simply to send your blessings and enquiries — please write to us.","location_city":"Sydney, New South Wales","location_country":"Australia","youtube_label":"YouTube Channel","form_name":"Your Name","form_email":"Your Email","form_subject":"Subject","form_message":"Your message, blessings or enquiry…","form_submit":"Send Message ✉","form_thanks":"🙏 Thank you! We will respond soon.","quote_sa":"सर्वे भवन्तु सुखिनः ।","quote_en":"May all be happy.","quote_iast":"sarve bhavantu sukhinaḥ | sarve santu nirāmayāḥ |","quote_te":"సర్వే భవంతు సుఖినః । సర్వే సంతు నిరామయాః ।"},"footer":{"sa":"ॐ तत्सत् । श्रीकृष्णार्पणमस्तु ।","iast":"Oṃ tat sat · Śrī Kṛṣṇārpaṇam astu","copy":"© 2025 Karthikeya Pidaparthy · Sydney, Australia"},"settings":{"title":"Settings","theme":"Theme","theme_light":"☀ Light","theme_dark":"☽ Dark","font_size":"Font Size","accent":"Accent Colour","language":"Language"},"wisdom":{"section_title":"Wisdom","nav_label":"Wisdom","subtitle":"The Sacred Knowledge Behind This Site","intro":"Every section of this website was designed with a purpose rooted in the ancient scriptures that Karthikeya himself studies and recites. The background patterns, the colours, the structure — all draw from the Vedic tradition. This page explains those choices, and invites you to explore the wisdom that inspired them.","bg_inspirations_title":"Background Inspirations","bg_inspirations_subtitle":"Each section carries a verse from the ancient scriptures — whispered in the background, available for those who look.","backgrounds":[{"id":"home","section":"Home","pattern_name":"Lotus Mandala","pattern_why":"The eight-petalled lotus (aṣṭadala padma) is the most sacred symbol of purity and divine unfolding in the Vedic tradition. It opens from muddy water into pristine beauty — just as Karthikeya has unfolded his gifts from an ordinary childhood into extraordinary scholarship, thousands of miles from the land of this tradition.","sloka_dev":"पद्मं पवित्रं पवितान् पुनीहि ।\nतव लक्ष्मी राजसि मातरिश्वन् ॥","sloka_te":"పద్మం పవిత్రం పవితాన్ పునీహి ।\nతవ లక్ష్మీ రాజసి మాతరిశ్వన్ ॥","sloka_iast":"padmaṃ pavitraṃ pavitān punīhi |\ntava lakṣmī rājasi mātariśvan ||","meaning_en":"O pure lotus, purify the pure ones. Your radiance, O divine wind, reigns supreme.","meaning_te":"ఓ పవిత్రమైన పద్మా, పవిత్రులను మరింత పవిత్రం చేయి. ఓ దైవీయ గాలీ, నీ తేజస్సు సర్వోన్నతంగా ఉంది.","meaning_sa":"हे पवित्रपद्म, पवित्रान् पुनर्विशुद्धान् कुरु। हे मातरिश्वन्, तव लक्ष्मीः श्रेष्ठत्वेन विराजते।","source_en":"Ṛgveda — the lotus as symbol of creation and purity appears throughout the Vedic corpus","source_te":"ఋగ్వేదం — పద్మం సృష్టి మరియు పవిత్రతకు చిహ్నంగా వేద సాహిత్యమంతటా కనిపిస్తుంది","source_sa":"ऋग्वेदः — सृष्टेः पवित्रतायाश्च प्रतीकरूपेण पद्मः समग्रे वेदसाहित्ये दृश्यते","scripture_intro":"The Ṛgveda is the oldest of the four Vedas and among the oldest sacred texts in the world, composed over 3,500 years ago. It contains 1,028 hymns (sūktas) addressed to the divine forces of nature."},{"id":"about","section":"About","pattern_name":"Stellar Field (Nakṣatra)","pattern_why":"The 27 nakṣatras (lunar mansions) of Vedic astrology represent one's birth-nature, destiny and gifts. A child's story — who they are, where they came from — is written in the stars. This pattern honours the idea that Karthikeya's remarkable gifts were not accidental but destined.","sloka_dev":"जन्म कर्म च मे दिव्यम् एवं यो वेत्ति तत्त्वतः ।\nत्यक्त्वा देहं पुनर्जन्म नैति मामेति सोऽर्जुन ॥","sloka_te":"జన్మ కర్మ చ మే దివ్యమ్ ఏవం యో వేత్తి తత్త్వతః ।\nత్యక్త్వా దేహం పునర్జన్మ నైతి మామేతి సోఽర్జున ॥","sloka_iast":"janma karma ca me divyam evaṃ yo vetti tattvataḥ |\ntyaktvā dehaṃ punarjanma naiti māmeti so'rjuna ||","meaning_en":"One who truly understands the divine nature of My birth and actions, O Arjuna, does not take birth again upon leaving the body — they come to Me.","meaning_te":"ఓ అర్జునా, నా జన్మ మరియు కర్మల దివ్య స్వభావాన్ని నిజంగా అర్థం చేసుకున్నవాడు, శరీరాన్ని వదిలిన తర్వాత మళ్ళీ జన్మించడు — వారు నన్నే చేరుకుంటారు.","meaning_sa":"हे अर्जुन, यः मम जन्मकर्मणोः दिव्यस्वरूपं तत्त्वतः जानाति, सः देहत्यागानन्तरं पुनर्जन्म न लभते — मामेव प्राप्नोति।","source_en":"Bhagavad Gītā 4.9 — Jñāna Karma Sannyāsa Yoga","source_te":"భగవద్గీత 4.9 — జ్ఞాన కర్మ సంన్యాస యోగం","source_sa":"भगवद्गीता ४.९ — ज्ञानकर्मसंन्यासयोगः","scripture_intro":"The Bhagavad Gītā (Song of the Lord) is a 700-verse dialogue between Arjuna and Kṛṣṇa on the battlefield of Kurukṣetra. It forms part of the Mahābhārata (Book VI) and is one of the most widely read and studied spiritual texts in the world. Karthikeya has memorised all 700 verses."},{"id":"profile","section":"Profile","pattern_name":"Sanskrit Verse Lines","pattern_why":"The background carries faint lines of Sanskrit verse — honouring the fact that Karthikeya's greatest achievement is the living knowledge he carries in his memory. In the Vedic tradition, knowledge transmitted orally (śruti) is considered more sacred than written knowledge, because it must live in a human being.","sloka_dev":"विद्या ददाति विनयं विनयाद् याति पात्रताम् ।\nपात्रत्वात् धनमाप्नोति धनात् धर्मं ततः सुखम् ॥","sloka_te":"విద్యా దదాతి వినయం వినయాద్ యాతి పాత్రతామ్ ।\nపాత్రత్వాత్ ధనమాప్నోతి ధనాత్ ధర్మం తతః సుఖమ్ ॥","sloka_iast":"vidyā dadāti vinayaṃ vinayād yāti pātratām |\npātratāt dhanamāpnoti dhanāt dharmaṃ tataḥ sukham ||","meaning_en":"Knowledge gives humility; from humility comes worthiness; from worthiness one gains wealth; from wealth, dharma; from dharma, happiness.","meaning_te":"విద్య వినయాన్ని ఇస్తుంది; వినయం నుండి పాత్రత వస్తుంది; పాత్రత నుండి సంపద లభిస్తుంది; సంపద నుండి ధర్మం; ధర్మం నుండి సుఖం.","meaning_sa":"विद्या विनयं ददाति; विनयात् पात्रता जायते; पात्रतायाः धनं लभ्यते; धनात् धर्मः; धर्मात् सुखम्।","source_en":"Hitopadeśa 1.1 — the opening verse of the Hitopadeśa, a collection of Sanskrit fables and wisdom literature","source_te":"హితోపదేశ 1.1 — హితోపదేశం తొలి శ్లోకం, సంస్కృత కథలు మరియు జ్ఞాన సాహిత్య సంకలనం","source_sa":"हितोपदेशः १.१ — संस्कृतकथानां ज्ञानसाहित्यस्य च संकलनस्य प्रारम्भश्लोकः","scripture_intro":"The Hitopadeśa (Beneficial Advice) is a Sanskrit work by Nārāyaṇa Paṇḍita, containing animal fables and wisdom verses. It is one of the most widely read Sanskrit texts for teaching values and practical wisdom. Its opening verse on vidyā is among the most quoted Sanskrit sayings."},{"id":"credits","section":"Credits","pattern_name":"Interlocking Rings","pattern_why":"The gurukula tradition recognises that no student learns alone. The guru's knowledge, the parents' support, the community's encouragement — all are interlocked rings in the chain of transmission. This section honours every person who has been a link in that chain for Karthikeya.","sloka_dev":"सं गच्छध्वं सं वदध्वं सं वो मनांसि जानताम् ।\nदेवा भागं यथा पूर्वे सञ्जानाना उपासते ॥","sloka_te":"సం గచ్ఛధ్వం సం వదధ్వం సం వో మనాంసి జానతామ్ ।\nదేవా భాగం యథా పూర్వే సఞ్జానానా ఉపాసతే ॥","sloka_iast":"saṃ gacchadhvaṃ saṃ vadadhvaṃ saṃ vo manāṃsi jānatām |\ndevā bhāgaṃ yathā pūrve sañjānānā upāsate ||","meaning_en":"Come together, speak together, let your minds be in harmony. As the gods of old, knowing their share, united in worship.","meaning_te":"కలిసి రండి, కలిసి మాట్లాడండి, మీ మనసులు సమరసంగా ఉండనీయండి. పూర్వ కాలపు దేవతలు తమ వంతు తెలుసుకుని ఒక్కటై ఆరాధించినట్లు.","meaning_sa":"एकत्र आगच्छत, एकत्र वदत, यूयं मनसा सह जानीत। यथा पूर्वे देवाः स्वभागं जानन्तः एकत्र उपासन्ते।","source_en":"Ṛgveda X.191.2 — the Saṃjñāna Sūkta (Hymn of Harmony), one of the most beloved unity verses of the Vedas","source_te":"ఋగ్వేదం X.191.2 — సంజ్ఞాన సూక్తం (సమరస స్తోత్రం), వేదాలలో అత్యంత ప్రియమైన ఐక్య శ్లోకాలలో ఒకటి","source_sa":"ऋग्वेदः X.१९१.२ — सञ्ज्ञानसूक्तम्, वेदेषु अत्यन्तप्रियाणाम् ऐक्यश्लोकानाम् अन्यतमम्","scripture_intro":"The Ṛgveda's Saṃjñāna Sūkta (X.191) is a hymn of profound social harmony, calling people to unity of mind, speech and action. It is recited at the close of many traditional gatherings and assemblies, and remains one of the most quoted Vedic verses on community and togetherness."},{"id":"events","section":"Events","pattern_name":"Kāla Chakra (Wheel of Time)","pattern_why":"Every milestone in Karthikeya's journey is a moment in the great wheel of time (kāla chakra). The Gītā teaches that time is the most powerful force — and yet, within it, each moment of dharmic action is eternal. His Gold Medal, his recitations, his performances — each is a spoke in this wheel.","sloka_dev":"कालोऽस्मि लोकक्षयकृत् प्रवृद्धो\nलोकान् समाहर्तुमिह प्रवृत्तः ।","sloka_te":"కాలోఽస్మి లోకక్షయకృత్ ప్రవృద్ధో\nలోకాన్ సమాహర్తుమిహ ప్రవృత్తః ।","sloka_iast":"kālo'smi lokakṣayakṛt pravṛddho\nlokān samāhartum iha pravṛttaḥ |","meaning_en":"I am Time, the great destroyer of worlds, fully developed, and I have come to consume all these worlds.","meaning_te":"నేను కాలాన్ని, లోకాలను నాశనం చేయు మహాశక్తిని, పరిపక్వమైనాను, ఇక్కడ ఈ లోకాలన్నింటినీ సంహరించడానికి వచ్చాను.","meaning_sa":"अहं कालः, लोकानां क्षयकर्ता, सम्पूर्णतया परिणतः, एतान् सर्वान् लोकान् संहर्तुम् इह प्रवृत्तः अस्मि।","source_en":"Bhagavad Gītā 11.32 — Kṛṣṇa's cosmic Viśvarūpa declaration, from the Viśvarūpa Darśana Yoga","source_te":"భగవద్గీత 11.32 — కృష్ణుని విశ్వరూప ప్రకటన, విశ్వరూప దర్శన యోగం నుండి","source_sa":"भगवद्गीता ११.३२ — विश्वरूपदर्शनयोगात् कृष्णस्य विश्वरूपप्रकटनम्","scripture_intro":"Chapter 11 of the Bhagavad Gītā contains the most awe-inspiring moment in the text — Arjuna's vision of Kṛṣṇa's cosmic form (Viśvarūpa). In verse 32, Kṛṣṇa declares himself as Time itself, the ultimate force that moves all events and beings. It is one of the most dramatic verses in all of Sanskrit literature."},{"id":"parayana","section":"Pārāyaṇa","pattern_name":"OM Ripple Rings","pattern_why":"The sacred syllable OM (praṇava) is said to be the primordial sound from which all creation emerged. When Karthikeya performs pārāyaṇa — whether Viṣṇu Sahasranāma, Lalitā Sahasranāma or the Bhagavad Gītā — he is re-establishing that connection between the human voice and the cosmic sound. The ripple rings represent sound propagating outward into the universe.","sloka_dev":"ॐ तत्सदिति निर्देशो ब्रह्मणस्त्रिविधः स्मृतः ।\nब्राह्मणास्तेन वेदाश्च यज्ञाश्च विहिताः पुरा ॥","sloka_te":"ఓం తత్సదితి నిర్దేశో బ్రహ్మణస్త్రివిధః స్మృతః ।\nబ్రాహ్మణాస్తేన వేదాశ్చ యజ్ఞాశ్చ విహితాః పురా ॥","sloka_iast":"oṃ tat sad iti nirdeśo brahmaṇas trividhaḥ smṛtaḥ |\nbrāhmaṇās tena vedāś ca yajñāś ca vihitāḥ purā ||","meaning_en":"OM, TAT, SAT — these are said to be the three-fold designation of Brahman (the Absolute). By these were the Vedic teachers, the Vedas themselves, and the sacred rites established from the beginning.","meaning_te":"ఓం, తత్, సత్ — ఇవి బ్రహ్మనకు మూడు రకాల సంకేతాలుగా చెప్పబడ్డాయి. వీటి ద్వారానే పూర్వకాలంలో వేదపారగులు, వేదాలు మరియు యజ్ఞాలు ఏర్పాటు చేయబడ్డాయి.","meaning_sa":"ओम्, तत्, सत् — इति ब्रह्मणः त्रिविधः निर्देशः स्मृतः। एतैरेव पुरा ब्राह्मणाः वेदाः यज्ञाश्च विहिताः।","source_en":"Bhagavad Gītā 17.23 — Śraddhātraya Vibhāga Yoga","source_te":"భగవద్గీత 17.23 — శ్రద్ధాత్రయ విభాగ యోగం","source_sa":"भगवद्गीता १७.२३ — श्रद्धात्रयविभागयोगः","scripture_intro":"The Vedic tradition holds that the universe itself was created from the sound OM — the praṇava. Pārāyaṇa (sacred recitation) is the practice of reconnecting the individual voice with this cosmic sound. The Upaniṣads describe OM as 'all this is OM' (sarvam hy etad brahma, ayam ātmā brahma — Māṇḍūkya Up. 1)."},{"id":"support","section":"Support","pattern_name":"Floral Yajña Pattern","pattern_why":"In the Vedic tradition, yajña (sacred offering) is not only the fire ritual — it is any act performed with devotion for the benefit of others. Supporting a young scholar's journey is itself a yajña. Those who encourage Karthikeya are participants in the ancient tradition of pōṣaṇa — the nurturing of knowledge.","sloka_dev":"सहयज्ञाः प्रजाः सृष्ट्वा पुरोवाच प्रजापतिः ।\nअनेन प्रसविष्यध्वम् एष वोऽस्त्विष्टकामधुक् ॥","sloka_te":"సహయజ్ఞాః ప్రజాః సృష్ట్వా పురోవాచ ప్రజాపతిః ।\nఅనేన ప్రసవిష్యధ్వమ్ ఏష వోఽస్త్విష్టకామధుక్ ॥","sloka_iast":"sahayajñāḥ prajāḥ sṛṣṭvā purovāca prajāpatiḥ |\nanena prasaviṣyadhvam eṣa vo'stv iṣṭakāmadhuk ||","meaning_en":"Having created humanity together with yajña, the Lord of Creation declared: 'By this shall you flourish; may this be the fulfiller of your desires.'","meaning_te":"యజ్ఞముతో కలిసి ప్రజలను సృష్టించి, ప్రజాపతి ముందే ఇలా చెప్పాడు: 'దీని ద్వారా మీరు వర్ధిల్లండి; ఇది మీ కోరికలను తీర్చే కల్పవృక్షం అవుతుంది.'","meaning_sa":"यज्ञेन सह प्रजाः सृष्ट्वा प्रजापतिः पुरा उक्तवान्: 'अनेन यूयं समृद्धिं प्राप्स्यथ; एषः वः इष्टकामधुक् भवतु।'","source_en":"Bhagavad Gītā 3.10 — Karma Yoga, on the cycle of mutual nourishment through yajña","source_te":"భగవద్గీత 3.10 — కర్మ యోగం, యజ్ఞం ద్వారా పరస్పర పోషణ చక్రంపై","source_sa":"भगवद्गीता ३.१० — कर्मयोगः, यज्ञेन परस्परपोषणचक्रस्य वर्णनम्","scripture_intro":"Chapter 3 of the Bhagavad Gītā expounds Karma Yoga — the path of selfless action. Verses 10–16 describe the cosmic principle of yajña: that the universe is sustained by a mutual cycle of giving and receiving. Supporting Karthikeya's education is participation in this ancient cycle."},{"id":"testimonials","section":"Testimonials","pattern_name":"Soft Quote Arches","pattern_why":"In the Vedic tradition, the word of a realised teacher (guru-vākya) is itself a form of scripture. When scholars like Samavedam Shanmukha Sharma speak of Karthikeya, their words carry the weight of the sampradāya. The arch pattern evokes the traditional dvaara (gateway) through which blessings enter.","sloka_dev":"सत्यमेव जयते नानृतं\nसत्येन पन्था विततो देवयानः ।","sloka_te":"సత్యమేవ జయతే నానృతం\nసత్యేన పంథా వితత్ దేవయానః ।","sloka_iast":"satyam eva jayate nānṛtaṃ\nsatyena panthā vitato devayānaḥ |","meaning_en":"Truth alone triumphs, not falsehood. Through truth is laid the path that leads to the divine.","meaning_te":"సత్యమే జయిస్తుంది, అసత్యం కాదు. సత్యం ద్వారానే దైవానికి చేరే మార్గం వేయబడింది.","meaning_sa":"सत्यमेव विजयते, न असत्यम्। सत्येन एव देवयानः मार्गः विस्तृतः।","source_en":"Muṇḍaka Upaniṣad 3.1.6 — this verse is the motto of the Government of India","source_te":"ముండక ఉపనిషత్ 3.1.6 — ఈ శ్లోకం భారత ప్రభుత్వ నినాదం","source_sa":"मुण्डकोपनिषत् ३.१.६ — एषः श्लोकः भारतसर्वकारस्य आदर्शवाक्यम् अस्ति","scripture_intro":"The Muṇḍaka Upaniṣad is one of the principal (mukhya) Upaniṣads, forming part of the Atharvaveda. It distinguishes between 'lower knowledge' (aparā vidyā — sciences, grammar, etc.) and 'higher knowledge' (parā vidyā — knowledge of the Self). Its famous verse on truth became the national motto of India."},{"id":"youtube","section":"YouTube","pattern_name":"Śruti Waves","pattern_why":"The word 'Veda' comes from the root vid (to know). The Vedas were śruti — that which was heard, transmitted orally for thousands of years before writing. Karthikeya's YouTube channel is a modern continuation of this śruti tradition — his voice carrying ancient knowledge to new ears across the world.","sloka_dev":"श्रुतिः स्मृतिश्च वेदोक्तं धर्मं विद्यां तथैव च ।\nसर्वं वेदात् प्रसिद्ध्यति वेदो हि परमं प्रमाणम् ॥","sloka_te":"శ్రుతిః స్మృతిశ్చ వేదోక్తం ధర్మం విద్యాం తథైవ చ ।\nసర్వం వేదాత్ ప్రసిద్ధ్యతి వేదో హి పరమం ప్రమాణమ్ ॥","sloka_iast":"śrutiḥ smṛtiś ca vedoktaṃ dharmaṃ vidyāṃ tathaiva ca |\nsarvaṃ vedāt prasiddhyati vedo hi paramaṃ pramāṇam ||","meaning_en":"Śruti (heard scripture) and Smṛti (remembered tradition), the dharma and knowledge declared in the Veda — all this is known through the Veda. Indeed the Veda is the supreme authority.","meaning_te":"శ్రుతి (వినబడిన శాస్త్రం) మరియు స్మృతి (స్మరించబడిన సంప్రదాయం), వేదం చెప్పిన ధర్మం మరియు విద్య — ఇవన్నీ వేదం ద్వారా తెలుసుకోబడతాయి. నిజంగా వేదమే అత్యున్నత ప్రమాణం.","meaning_sa":"श्रुतिः स्मृतिश्च, वेदोक्तं धर्मं विद्यां च — सर्वमेतत् वेदात् ज्ञायते। वेदः एव परमं प्रमाणम् अस्ति।","source_en":"Based on Manusmṛti 2.10 — on the authority of Veda as the ultimate source of dharma and knowledge","source_te":"మనుస్మృతి 2.10 ఆధారంగా — ధర్మం మరియు జ్ఞానానికి అంతిమ మూలంగా వేదం యొక్క అధికారంపై","source_sa":"मनुस्मृतेः २.१० आधारेण — धर्मस्य ज्ञानस्य च परमप्रमाणरूपेण वेदस्य अधिकारविषये","scripture_intro":"The Vedic tradition distinguishes between śruti ('that which is heard' — the eternal Vedas) and smṛti ('that which is remembered' — the Upāṅgas, Itihāsas, Purāṇas). Both are valid channels of knowledge. Karthikeya's YouTube channel honours both: his recitations are śruti in action; his Mahābhārata discourses are smṛti in the making."},{"id":"contact","section":"Contact","pattern_name":"Gentle Envelope (Sandhi)","pattern_why":"In Sanskrit grammar, sandhi means the joining of sounds — the beautiful way two words merge when they meet. Contact is the sandhi of two lives briefly touching. Every message sent to Karthikeya is a small connection in the great web of the sampradāya — the tradition of passing knowledge person to person.","sloka_dev":"सर्वे भवन्तु सुखिनः । सर्वे सन्तु निरामयाः ।\nसर्वे भद्राणि पश्यन्तु । मा कश्चिद्दुःखभाग् भवेत् ॥","sloka_te":"సర్వే భవంతు సుఖినః । సర్వే సంతు నిరామయాః ।\nసర్వే భద్రాణి పశ్యంతు । మా కశ్చిద్దుఃఖభాగ్ భవేత్ ॥","sloka_iast":"sarve bhavantu sukhinaḥ | sarve santu nirāmayāḥ |\nsarve bhadrāṇi paśyantu | mā kaścid duḥkhabhāg bhavet ||","meaning_en":"May all be happy. May all be free from disease. May all see what is auspicious. May none suffer.","meaning_te":"అందరూ సుఖంగా ఉండుగాక. అందరూ రోగరహితంగా ఉండుగాక. అందరూ శుభాలను చూడుగాక. ఎవ్వరూ దుఃఖం పొందకుండుగాక.","meaning_sa":"सर्वे सुखिनः भवन्तु। सर्वे निरामयाः भवन्तु। सर्वे भद्राणि पश्यन्तु। कोऽपि दुःखभाक् न भवेत्।","source_en":"Bṛhadāraṇyaka Upaniṣad — universal peace prayer (śānti mantra), recited at the close of all traditional gatherings","source_te":"బృహదారణ్యక ఉపనిషత్ — విశ్వ శాంతి ప్రార్థన (శాంతి మంత్రం), సమస్త సంప్రదాయ సమావేశాల చివర పఠించబడేది","source_sa":"बृहदारण्यकोपनिषत् — सर्वलोककल्याणप्रार्थना (शान्तिमन्त्रः), समस्तपारम्परिकसमावेशानाम् अन्ते पठ्यमानः","scripture_intro":"The Bṛhadāraṇyaka Upaniṣad is the largest of all Upaniṣads and one of the most ancient, forming part of the Śukla Yajurveda. It contains some of the most profound teachings on the nature of the Self (Ātman) and Brahman. Its Śānti Mantra — 'Sarve bhavantu sukhinaḥ' — is one of the most universally beloved Sanskrit prayers."}],"scriptures_title":"Scriptures Referenced","scriptures_subtitle":"A brief introduction to the sacred texts quoted on this website","scriptures":[{"id":"gita","name":"Śrīmad Bhagavad Gītā","name_te":"శ్రీమద్ భగవద్గీత","name_dev":"श्रीमद्भगवद्गीता","verses":"700 verses · 18 chapters","part_of":"Mahābhārata, Book VI (Bhīṣma Parva)","period":"Composed c. 400 BCE – 200 CE","intro_en":"The Bhagavad Gītā is a 700-verse dialogue between the warrior prince Arjuna and his charioteer Kṛṣṇa on the battlefield of Kurukṣetra. Arjuna is paralysed by doubt before the battle; Kṛṣṇa's response becomes one of humanity's greatest spiritual teachings — covering duty, action, devotion, knowledge and liberation. Karthikeya has memorised all 700 verses and received the Gold Medal from Mysore Datta Peetham for this achievement.","intro_te":"భగవద్గీత యుద్ధభూమిలో యోధుడైన అర్జునుడు మరియు అతని సారథి కృష్ణుడి మధ్య జరిగిన 700 శ్లోకాల సంభాషణ. కర్తవ్యం, కర్మ, భక్తి, జ్ఞానం మరియు మోక్షాన్ని కవర్ చేస్తూ మానవజాతి యొక్క గొప్ప ఆధ్యాత్మిక బోధనలలో ఒకటిగా నిలిచింది. కార్తికేయ 700 శ్లోకాలు మొత్తం కంఠస్థం చేసాడు.","key_teachings":["Karma Yoga — selfless action","Jñāna Yoga — path of knowledge","Bhakti Yoga — path of devotion","Rāja Yoga — path of meditation","Dharma — righteous duty"],"quoted_verses":["4.7 — Whenever righteousness declines, I manifest (Home)","4.9 — My birth and actions are divine (About)","11.32 — I am Time, the destroyer (Events)","17.23 — OM TAT SAT (Pārāyaṇa)","3.10 — Creation with yajña (Support)"]},{"id":"rigveda","name":"Ṛgveda","name_te":"ఋగ్వేదం","name_dev":"ऋग्वेदः","verses":"10,552 mantras · 1,028 hymns · 10 Maṇḍalas","part_of":"The oldest of the four Vedas","period":"Composed c. 1500–1200 BCE (among the oldest religious texts in the world)","intro_en":"The Ṛgveda is the world's oldest collection of sacred hymns, composed in Vedic Sanskrit. Its 1,028 sūktas (hymns) are addressed to 33 deities representing the forces of nature — Agni (fire), Indra (thunder), Sūrya (sun), Varuṇa (cosmic order) and others. The Ṛgveda is the foundation of all Vedic knowledge.","intro_te":"ఋగ్వేదం ప్రపంచంలో పురాతనమైన పవిత్ర సూక్తాల సంకలనం, వైదిక సంస్కృతంలో రచించబడింది. దాని 1,028 సూక్తాలు ప్రకృతి శక్తులను సూచించే 33 దేవతలకు అంకితం చేయబడ్డాయి.","key_teachings":["Agni Sūkta — the sacred fire","Puruṣa Sūkta — cosmic creation","Nāsadīya Sūkta — origin of the universe","Saṃjñāna Sūkta — unity and harmony (X.191)"],"quoted_verses":["X.191.2 — Come together, speak together (Credits)","Lotus imagery — purity and creation (Home)"]},{"id":"upanishads","name":"The Upaniṣads","name_te":"ఉపనిషత్తులు","name_dev":"उपनिषदः","verses":"108 Upaniṣads · 13 principal (mukhya) Upaniṣads","part_of":"The concluding sections of the Vedas (Vedānta)","period":"Composed c. 800–200 BCE","intro_en":"The Upaniṣads are the philosophical heart of the Vedas — 108 texts that explore the deepest questions: What is the Self? What is Brahman? How do we achieve liberation? The word 'Upaniṣad' means 'sitting near' — as a student sits near a teacher. The three most quoted on this site are the Māṇḍūkya (on OM), the Muṇḍaka (on truth) and the Bṛhadāraṇyaka (on universal peace).","intro_te":"ఉపనిషత్తులు వేదాల తాత్విక హృదయం — ఆత్మ ఏమిటి? బ్రహ్మం ఏమిటి? విముక్తి ఎలా సాధించాలి? వంటి లోతైన ప్రశ్నలను అన్వేషించే 108 గ్రంథాలు.","key_teachings":["Tat tvam asi — Thou art That (Chāndogya Up.)","Aham brahmāsmi — I am Brahman (Bṛhadāraṇyaka Up.)","Satyam jñānam anantam brahma — Brahman is Truth, Knowledge, Infinity (Taittirīya Up.)","Oṃ iti etat akṣaram — OM is that imperishable (Māṇḍūkya Up.)"],"quoted_verses":["Muṇḍaka 3.1.6 — Truth alone triumphs (Testimonials)","Bṛhadāraṇyaka — Sarve bhavantu sukhinaḥ (Contact)","Māṇḍūkya — OM as the cosmic sound (Pārāyaṇa)"]},{"id":"hitopadesha","name":"Hitopadeśa","name_te":"హితోపదేశం","name_dev":"हितोपदेशः","verses":"c. 43 stories · hundreds of verses","part_of":"Sanskrit kāvya and nītiśāstra (wisdom literature)","period":"Composed c. 800–1200 CE by Nārāyaṇa Paṇḍita","intro_en":"The Hitopadeśa (Beneficial Advice) is a collection of Sanskrit prose and verse, structured as animal fables to teach practical wisdom and ethical conduct. It is based partly on the Pañcatantra. Its opening verse — 'vidyā dadāti vinayam' — is perhaps the most widely known Sanskrit saying on the value of education.","intro_te":"హితోపదేశం (మేలైన సలహా) సంస్కృత గద్య పద్యాల సంకలనం, ఆచరణాత్మక జ్ఞానం మరియు నైతిక ప్రవర్తన నేర్పడానికి జంతు కథలు నిర్మించింది. దాని తొలి శ్లోకం 'విద్యా దదాతి వినయం' విద్య విలువపై అత్యంత ప్రసిద్ధమైన సంస్కృత సూక్తి.","key_teachings":["Vidyā — the supreme wealth","Vinaya — humility as the fruit of learning","Nīti — practical ethics in governance and life"],"quoted_verses":["1.1 — vidyā dadāti vinayam (Profile)"]}],"primer_title":"Sanskrit Scripts Primer","primer_subtitle":"Three scripts, one language — how to read this site","primer_intro":"Sanskrit is written in many scripts across India. This website displays every Sanskrit verse in three scripts simultaneously — because our visitors come from different traditions and comfort levels.","scripts":[{"name":"Devanāgarī","name_local":"देवनागरी","used_in":"Hindi, Sanskrit, Marathi, Nepali","direction":"Left to right","example":"यदा यदा हि धर्मस्य","note":"The script of the Sanskrit scholarly tradition. Named 'divine city script'. Each syllable is formed below a horizontal bar (mātrā). Karthikeya writes Sanskrit in this script for his examinations."},{"name":"Telugu Script","name_local":"తెలుగు లిపి","used_in":"Telugu language, also used for Sanskrit in Andhra & Telangana","direction":"Left to right","example":"యదా యదా హి ధర్మస్య","note":"One of the oldest scripts in India, derived from the Brāhmī script. Known for its rounded, flowing curves. Karthikeya's mother tongue is Telugu and he is equally fluent reciting Sanskrit in Telugu script."},{"name":"IAST — International Alphabet of Sanskrit Transliteration","name_local":"IAST","used_in":"Academic publications, international Sanskrit scholarship","direction":"Left to right (Roman alphabet with diacritical marks)","example":"yadā yadā hi dharmasya","note":"IAST uses the Roman alphabet plus special marks (diacritics) to represent every Sanskrit sound precisely. ā = long a, ṭ = retroflex t, ṅ = nasal n, ś/ṣ = two types of sh. It allows anyone worldwide to pronounce Sanskrit correctly without knowing any Indian script."}]}},"te":{"nav":{"home":"హోమ్","about":"పరిచయం","profile":"ప్రొఫైల్","credits":"కృతజ్ఞతలు","events":"కార్యక్రమాలు","parayana":"పారాయణ","support":"సహకారం","testimonials":"అభిప్రాయాలు","contact":"సంప్రదించండి","youtube":"యూట్యూబ్","logo_name":"సంస్కృతి","logo_tag":"Samskruti • संस्कृति"},"hero":{"greeting":"శ్రీ గణేశాయ నమః","name":"కార్తికేయ పీడపర్తి","age_location":"వయసు 10 · సిడ్నీ, ఆస్ట్రేలియా","description":"సంస్కృతం, తెలుగు మరియు ఇంగ్లీషులో అసమాన పాండిత్యం కలిగిన యువ విద్వాంసుడు — భగవద్గీత 700 శ్లోకాలు కంఠస్థం చేసి మైసూర్ దత్త పీఠం నుండి స్వర్ణపతకం అందుకున్నాడు; సంస్కృత ఒలింపియాడ్‌లో ఆస్ట్రేలియా ప్రథముడు; సనాతన ధర్మ మహాసంప్రదాయంలో నిష్ఠావంతమైన పారాయణ సాధకుడు.","btn_achievements":"విజయాలు చూడండి","btn_youtube":"▶ యూట్యూబ్ చానెల్","badges":["🏅 స్వర్ణపతకం — మైసూర్ దత్త పీఠం","🥇 సంస్కృత ఒలింపియాడ్ — ఆస్ట్రేలియా ప్రథమ","📖 భగవద్గీత · 700 శ్లోకాలు","🕉 సౌందర్యలహరి · 100 శ్లోకాలు","🎤 సమవేదం రచించిన శివపదాలు"]},"about":{"section_title":"కార్తికేయ గురించి","para1":"సిడ్నీ, ఆస్ట్రేలియాలో వేద సంప్రదాయాన్ని లాలించే కుటుంబంలో జన్మించిన కార్తికేయ పీడపర్తి, చిన్నప్పటి నుండే సంస్కృతం, శాస్త్రం మరియు శాస్త్రీయ తెలుగు సాహిత్య ప్రపంచంలో నిమగ్నమయ్యాడు. పితరుల భూమికి దూరంగా ఉన్నా వారి జ్ఞానంలో దృఢంగా నిలబడి, సనాతన ధర్మ జీవన్ నిరంతరతకు మూర్తీభవించాడు.","para2":"10 సంవత్సరాల అద్భుతమైన వయసులో, ఆధునిక ఆస్ట్రేలియా పాఠశాల విద్యతోపాటు నిత్య భక్తి సాధన, నిత్య ఆలయ పారాయణ మరియు సంస్కృతంలో తీవ్ర విద్యా ప్రమేయం సమతుల్యంగా నిర్వహిస్తున్నాడు — భారతదేశం నలుమూలల విద్వాంసుల మన్ననలు అందుకుంటున్నాడు.","quote_sa":"विद्या ददाति विनयम् ।","quote_iast":"vidyā dadāti vinayam","quote_te":"విద్య వినయమిస్తుంది.","quote_en":"జ్ఞానం వినయాన్ని ప్రసాదిస్తుంది.","cards":[{"title":"భాషలు","body":"తెలుగు, ఇంగ్లీషులో ప్రవాహంగా మాట్లాడతాడు; సంస్కృతంలో అపారమైన పాండిత్యం ఉంది. దేవనాగరి, తెలుగు మరియు Roman IAST లిపులు చదువుతాడు. 3-4 ఏళ్ళకే 'పర భాష లేకుండా తెలుగులో' పోటీ గెలుచుకున్నాడు."},{"title":"శాస్త్రజ్ఞానం","body":"చాగంటి కోటేశ్వర రావు గారి పూర్తి రామాయణ మరియు మహాభారత ప్రవచనాలు మొత్తం విన్నాడు. భాగవత, ఉపనిషత్తులు, ఇతిహాసాల కథలు తెలుసు. వ్యోమ లింగ్విస్టిక్స్ లాబ్స్ 'ఆలయాల వెనుక కథలు' శ్రేణిని కూడా అభ్యసించాడు."},{"title":"సమాజ సేవ & భక్తి","body":"సిడ్నీ మురుగన్ ఆలయంలో విష్ణు సహస్రనామ, లలితా సహస్రనామ పారాయణ నిత్యం నిర్వహిస్తాడు. నవరాత్రిలో సిడ్నీ అయ్యప్ప ఆలయంలో సౌందర్యలహరి పారాయణ చేశాడు. హెలెన్స్‌బర్గ్ ఆలయంలో సమగ్ర భగవద్గీత పఠించాడు."}]},"profile":{"section_title":"విజయాలు & ప్రొఫైల్","journey_title":"సంస్కృత యాత్ర","journey":"కార్తికేయ సంస్కృతంపై ప్రేమ చాలా చిన్న వయసులోనే ఇంట్లో మొదలైంది. అతను పాఠశాలకు వెళ్ళే ముందే, సంస్కృత శ్లోకాల శబ్దాలు మరియు లయలతో నిండిపోయాడు — కుటుంబసభ్యులు స్తోత్రాలు మరియు ప్రార్థనలు పఠించడం వినేవాడు. ఈ ప్రారంభ నిమజ్జనం అసాధారణమైన ఆధ్యాత్మిక మరియు విద్యా ప్రయాణానికి పునాది వేసింది.\n\nసంస్కృత భారతీ పరీక్షా కార్యక్రమం ద్వారా అతని అధికారిక సంస్కృత పరీక్షలు అద్భుతమైన శ్రేష్ఠతను సాధించాయి:\n\n• ఆయనమ్ (2022) — 100%\n• సారిణీ (2023) — 98%\n• సరళా (2024) — 94%\n• సుగమా (2025) — 98%\n• సరసా (2026) — 96%\n\nవరుసగా ఐదు సంవత్సరాల పాటు 97.2% సగటుతో విజయం సాధించాడు — వేదాల భాషపై నిజమైన ప్రేమకు నిదర్శనం. వ్యోమ లింగ్విస్టిక్స్ లాబ్స్ వారి 'ఆలయాల వెనుక కథలు' వీడియో శ్రేణిని చూసి భారతదేశ పవిత్ర భూగోళంతో ముడిపడిన సాంస్కృతిక మరియు పౌరాణిక వారసత్వాన్ని లోతుగా అర్థం చేసుకున్నాడు.","achievements":[{"icon":"🥇","title":"స్వర్ణపతకం — భగవద్గీత","desc":"శ్రీమద్భగవద్గీత 700 శ్లోకాలు కంఠస్థం చేసి అప్రమేయంగా పఠించినందుకు మైసూర్ దత్త పీఠం నుండి ప్రతిష్ఠాత్మక స్వర్ణపతకం అందుకున్నాడు — జ్ఞాపకశక్తి, భక్తి మరియు శిక్షణకు మహాసాధన.","year":"మైసూర్ దత్త పీఠం","tag":"gold"},{"icon":"📖","title":"భగవద్గీత — హెలెన్స్‌బర్గ్ ఆలయం","desc":"పండిట్ రిషికేష్ భట్టర్ గారి షష్టిపూర్తి మహోత్సవం శుభ సందర్భంగా హెలెన్స్‌బర్గ్ ఆలయంలో సమగ్ర శ్రీమద్భగవద్గీత (18 అధ్యాయాలు, 700 శ్లోకాలు) పఠించాడు — అపూర్వమైన గౌరవం మరియు హృదయస్పర్శి భక్తి నివేదన.","year":"హెలెన్స్‌బర్గ్ ఆలయం · షష్టిపూర్తి మహోత్సవం","tag":"gold"},{"icon":"🏆","title":"సంస్కృత ఒలింపియాడ్ — అఖిల భారత 266వ స్థానం (2024) · ఆస్ట్రేలియాలో 1వ స్థానం (2025)","desc":"2024 — కేంద్ర సంస్కృత విశ్వవిద్యాలయం జాతీయ సంస్కృత ఒలింపియాడ్‌లో అఖిల భారత 266వ స్థానం — 13–17 సంవత్సరాల వయసు విభాగంలో పాల్గొని, అప్పటికి అతని వయసు కేవలం 8 సంవత్సరాలు. 2025 — జనరల్ కేటగిరీలో (భారతీయ జ్ఞాన వ్యవస్థలు · IKS) ఆస్ట్రేలియాలో మొదటి స్థానం, 9 సంవత్సరాల వయసులో ఓపెన్ కేటగిరీ పోటీదారుగా. రెండు సంవత్సరాలు అసాధారణ జాతీయ స్థాయి విజయాలు — వయసు ఎన్నడూ అడ్డంకి కాలేదు.","year":"కేంద్ర సంస్కృత విశ్వవిద్యాలయం · 2024 & 2025","tag":"olympiad"},{"icon":"📊","title":"సంస్కృత పరీక్షలు — 5 సంవత్సరాల శ్రేష్ఠత","desc":"ఆయనమ్ 2022 (100%) · సారిణీ 2023 (98%) · సరళా 2024 (94%) · సుగమా 2025 (98%) · సరసా 2026 (96%). వరుసగా ఐదు సంవత్సరాలు 97.2% సగటుతో — ప్రతి స్థాయి మరింత అభివృద్ధి చెందిన కోర్సు.","year":"సంస్కృత భారతీ కార్యక్రమం · 2022–2026","tag":"olympiad"},{"icon":"🕉","title":"సౌందర్యలహరి పారాయణ","desc":"ఆదిశంకరాచార్యుల సౌందర్యలహరి 100 శ్లోకాలు కంఠస్థం చేసి — దైవమాతపై అత్యంత ప్రశస్తమైన సంస్కృత స్తోత్రాలలో ఒకటి — నవరాత్రి సందర్భంగా సిడ్నీ అయ్యప్ప ఆలయంలో పూర్తి పారాయణ చేశాడు.","year":"సిడ్నీ అయ్యప్ప ఆలయం · నవరాత్రి","tag":"parayana"},{"icon":"📜","title":"విష్ణు & లలితా సహస్రనామ","desc":"సిడ్నీ మురుగన్ ఆలయంలో విష్ణు సహస్రనామ మరియు లలితా సహస్రనామ పారాయణ నిత్యం నిర్వహిస్తాడు — సిడ్నీ హిందూ సమాజ ఆధ్యాత్మిక జీవనానికి సేవ.","year":"సిడ్నీ మురుగన్ ఆలయం · నిత్యం","tag":"parayana"},{"icon":"🎤","title":"శివపదాలు — సమవేదం శంఖముఖ శర్మ","desc":"ప్రఖ్యాత పండితుడు సమవేదం శంఖముఖ శర్మ గారి సిడ్నీ సందర్శన సందర్భంలో వారి సమక్షంలో వారు రచించిన 10 శివపదాలు పఠించాడు. మహాపండితుడు హృదయపూర్వకంగా స్వాగతించి ప్రత్యేక స్మారక చిహ్నం అందించారు.","year":"సిడ్నీ · ఏప్రిల్ · సమవేదం శంఖముఖ శర్మ సందర్శన","tag":"scholar"},{"icon":"✍","title":"సంకటనాశన గణేశ స్తోత్రం — పండితులకు అర్పణ","desc":"సంకటనాశన గణేశ స్తోత్రం స్వహస్తాలతో లిఖించి ముగ్గురు విద్వాంసులకు — వద్దిపర్తి పద్మకర్, సమవేదం శంఖముఖ శర్మ మరియు మడుగుల నాగఫణి శర్మలకు — వ్యక్తిగతంగా అర్పించాడు.","year":"ముగ్గురు మహాపండితులకు వ్యక్తిగత అర్పణ","tag":"scholar"},{"icon":"🎭","title":"అవధానం — అప్రస్తుత ప్రసంగ పృచ్ఛకుడు","desc":"ప్రఖ్యాత కవి-పండితుడు తటవర్తి కళ్యాణ్ గారి ప్రతిష్ఠాత్మక అవధానంలో అప్రస్తుత ప్రసంగ పృచ్ఛకునిగా పాల్గొన్నాడు — తక్షణ తెలివి మరియు సృజనాత్మకత అవసరమైన పాత్ర.","year":"తటవర్తి కళ్యాణ్ అవధానం · సిడ్నీ","tag":"scholar"},{"icon":"🏅","title":"మానవ కథ & గజేంద్ర మోక్షం — విజేత","desc":"వద్దిపర్తి పద్మకర్ మార్గదర్శనంలో ప్రణవ పీఠం నిర్వహించిన మానవ కథ మరియు గజేంద్ర మోక్షం రెండు పోటీలలో బహుమతులు గెలుచుకున్నాడు.","year":"ప్రణవ పీఠం · వద్దిపర్తి పద్మకర్","tag":"competition"},{"icon":"🎊","title":"సాంస్కృతిక పోటీలు — అనేక బహుమతులు","desc":"సిడ్నీ జన రంజని నిర్వహించిన రామాయణ మరియు దశావతార కథా పోటీలలో, ప్రణవ పీఠం కవిత్వ పోటీలలో అనేక బహుమతులు గెలుచుకున్నాడు.","year":"సిడ్నీ జన రంజని · ప్రణవ పీఠం","tag":"competition"},{"icon":"🗣","title":"'పర భాష లేకుండా తెలుగులో' — విజేత","desc":"3-4 సంవత్సరాల అద్భుతమైన వయసులో 'పర భాష లేకుండా తెలుగులో' పోటీలో విజేతగా నిలిచాడు — విదేశీ పదాలు లేకుండా స్వచ్ఛమైన తెలుగులో మాట్లాడడం. అతని అసాధారణ భాషా ప్రతిభకు తొలి నిదర్శనం.","year":"వయసు ~3–4 సంవత్సరాలు · తెలుగు భాషా పోటీ","tag":"competition"},{"icon":"📺","title":"భారతం లఘు ప్రసంగాలు","desc":"మహాభారతంపై ింది. నేపథ్య నమూనాలు, రంగులు, నిర్మాణం — అన్నీ వేద సంప్రదాయం నుండి తీసుకోబడ్డాయి. ఈ పేజీ ఆ ఎంపికలను వివరిస్తుంది మరియు వాటికి స్ఫూర్తినిచ్చిన జ్ఞానాన్ని అన్వేషించమని మిమ్మల్ని ఆహ్వానిస్తుంది.","bg_inspirations_title":"నేపథ్య స్ఫూర్తులు","bg_inspirations_subtitle":"ప్రతి విభాగంలో పురాతన శాస్త్రాల నుండి ఒక శ్లోకం నేపథ్యంలో ఉంటుంది — చూసేవారికోసం అక్కడే ఉంటుంది.","scriptures_title":"ఉదహరించిన శాస్త్రాలు","scriptures_subtitle":"ఈ వెబ్‌సైట్‌లో ఉదహరించిన పవిత్ర గ్రంథాలకు సంక్షిప్త పరిచయం","primer_title":"సంస్కృత లిపుల పరిచయం","primer_subtitle":"మూడు లిపులు, ఒకే భాష — ఈ వెబ్‌సైట్ ఎలా చదవాలి","primer_intro":"సంస్కృతం భారతదేశంలో అనేక లిపులలో రాయబడుతుంది. ఈ వెబ్‌సైట్ ప్రతి సంస్కృత శ్లోకాన్ని ఏకకాలంలో మూడు లిపులలో చూపిస్తుంది — ఎందుకంటే మన సందర్శకులు వివిధ సంప్రదాయాల నుండి మరియు వివిధ అవగాహన స్థాయులతో వస్తారు.","backgrounds":[{"id":"home","section":"హోమ్","pattern_name":"పద్మ మండలం","pattern_why":"అష్టదళ పద్మం (ఎనిమిది రేకుల తామరపువ్వు) వేద సంప్రదాయంలో పవిత్రత మరియు దైవీయ వికాసానికి అత్యంత పవిత్రమైన చిహ్నం. అది బురద నుండి నిష్కళంక సౌందర్యంగా వికసిస్తుంది — అదేవిధంగా కార్తికేయ తన సాధారణ బాల్యం నుండి అసాధారణ పాండిత్యంగా వికసించాడు.","sloka_dev":"पद्मं पवित्रं पवितान् पुनीहि ।\nतव लक्ष्मी राजसि मातरिश्वन् ॥","sloka_te":"పద్మం పవిత్రం పవితాన్ పునీహి ।\nతవ లక్ష్మీ రాజసి మాతరిశ్వన్ ॥","sloka_iast":"padmaṃ pavitraṃ pavitān punīhi |\ntava lakṣmī rājasi mātariśvan ||","meaning_en":"O pure lotus, purify the pure ones. Your radiance, O divine wind, reigns supreme.","meaning_te":"ఓ పవిత్రమైన పద్మా, పవిత్రులను మరింత పవిత్రం చేయి. ఓ దైవీయ గాలీ, నీ తేజస్సు సర్వోన్నతంగా ఉంది.","meaning_sa":"हे पवित्रपद्म, पवित्रान् पुनर्विशुद्धान् कुरु। हे मातरिश्वन्, तव लक्ष्मीः श्रेष्ठत्वेन विराजते।","source_en":"Ṛgveda — the lotus as symbol of creation and purity","source_te":"ఋగ్వేదం — సృష్టి మరియు పవిత్రతకు పద్మం చిహ్నంగా","source_sa":"ऋग्वेदः — सृष्टेः पवित्रतायाश्च प्रतीकरूपेण पद्मः","scripture_intro":"ఋగ్వేదం ప్రపంచంలో పురాతనమైన పవిత్ర గ్రంథాలలో ఒకటి, 3,500 సంవత్సరాల కంటే పూర్వం రచించబడింది. దానిలో 1,028 సూక్తాలు ఉన్నాయి."},{"id":"about","section":"పరిచయం","pattern_name":"నక్షత్ర క్షేత్రం","pattern_why":"వైదిక జ్యోతిష్యంలోని 27 నక్షత్రాలు ఒక వ్యక్తి యొక్క జన్మ స్వభావం, విధి మరియు ప్రతిభలను సూచిస్తాయి. ఒక బిడ్డ కథ — వారు ఎవరు, ఎక్కడ నుండి వచ్చారు — నక్షత్రాలలో రాయబడింది. ఈ నమూనా కార్తికేయ అసాధారణ ప్రతిభలు యాదృచ్ఛికం కాదు, విధి నిర్ణయించినవి అనే భావనను గౌరవిస్తుంది.","sloka_dev":"जन्म कर्म च मे दिव्यम् एवं यो वेत्ति तत्त्वतः ।\nत्यक्त्वा देहं पुनर्जन्म नैति मामेति सोऽर्जुन ॥","sloka_te":"జన్మ కర్మ చ మే దివ్యమ్ ఏవం యో వేత్తి తత్త్వతః ।\nత్యక్త్వా దేహం పునర్జన్మ నైతి మామేతి సోఽర్జున ॥","sloka_iast":"janma karma ca me divyam evaṃ yo vetti tattvataḥ |\ntyaktvā dehaṃ punarjanma naiti māmeti so'rjuna ||","meaning_en":"One who truly understands the divine nature of My birth and actions does not take birth again — they come to Me.","meaning_te":"నా జన్మ మరియు కర్మల దివ్య స్వభావాన్ని నిజంగా అర్థం చేసుకున్నవాడు, మళ్ళీ జన్మించడు — వారు నన్నే చేరుకుంటారు.","meaning_sa":"यः मम जन्मकर्मणोः दिव्यस्वरूपं तत्त्वतः जानाति, सः पुनर्जन्म न लभते।","source_en":"Bhagavad Gītā 4.9","source_te":"భగవద్గీత 4.9","source_sa":"भगवद्गीता ४.९","scripture_intro":"భగవద్గీత అర్జునుడు మరియు కృష్ణుడి మధ్య యుద్ధభూమిలో జరిగిన 700 శ్లోకాల సంభాషణ. కార్తికేయ 700 శ్లోకాలు మొత్తం కంఠస్థం చేసి మైసూర్ దత్త పీఠం నుండి స్వర్ణపతకం అందుకున్నాడు."},{"id":"profile","section":"ప్రొఫైల్","pattern_name":"సంస్కృత శ్లోక రేఖలు","pattern_why":"నేపథ్యంలో సంస్కృత శ్లోకాల మసక రేఖలు ఉన్నాయి — కార్తికేయ యొక్క అతిగొప్ప సాధన అతను జ్ఞాపకంలో మోస్తున్న జీవన్త జ్ఞానం అనే సత్యాన్ని గౌరవిస్తూ. వేద సంప్రదాయంలో, మౌఖికంగా ప్రసారమయ్యే జ్ఞానం (శ్రుతి) లిఖిత జ్ఞానం కంటే పవిత్రమైనది.","sloka_dev":"विद्या ददाति विनयं विनयाद् याति पात्रताम् ।\nपात्रत्वात् धनमाप्नोति धनात् धर्मं ततः सुखम् ॥","sloka_te":"విద్యా దదాతి వినయం వినయాద్ యాతి పాత్రతామ్ ।\nపాత్రత్వాత్ ధనమాప్నోతి ధనాత్ ధర్మం తతః సుఖమ్ ॥","sloka_iast":"vidyā dadāti vinayaṃ vinayād yāti pātratām |\npātratāt dhanamāpnoti dhanāt dharmaṃ tataḥ sukham ||","meaning_en":"Knowledge gives humility; from humility comes worthiness; from worthiness one gains wealth; from wealth, dharma; from dharma, happiness.","meaning_te":"విద్య వినయాన్ని ఇస్తుంది; వినయం నుండి పాత్రత వస్తుంది; పాత్రత నుండి సంపద; సంపద నుండి ధర్మం; ధర్మం నుండి సుఖం.","meaning_sa":"विद्या विनयं ददाति; विनयात् पात्रता; पात्रतायाः धनम्; धनात् धर्मः; धर्मात् सुखम्।","source_en":"Hitopadeśa 1.1","source_te":"హితోపదేశ 1.1","source_sa":"हितोपदेशः १.१","scripture_intro":"హితోపదేశం నారాయణ పండిత రచించిన సంస్కృత రచన, జంతు కథలు మరియు జ్ఞాన శ్లోకాలు కలిగి ఉంది. దాని తొలి శ్లోకం విద్య విలువపై అత్యంత ప్రసిద్ధమైన సంస్కృత సూక్తి."},{"id":"credits","section":"కృతజ్ఞతలు","pattern_name":"పరస్పర వలయాలు","pattern_why":"గురుకుల సంప్రదాయం గుర్తిస్తుంది — విద్యార్థి ఒంటరిగా నేర్చుకోడు. గురువు జ్ఞానం, తల్లిదండ్రుల మద్దతు, సమాజ ప్రోత్సాహం — అన్నీ జ్ఞాన ప్రసారం యొక్క గొలుసులో పరస్పర అనుసంధానమైన వలయాలు.","sloka_dev":"सं गच्छध्वं सं वदध्वं सं वो मनांसि जानताम् ।\nदेवा भागं यथा पूर्वे सञ्जानाना उपासते ॥","sloka_te":"సం గచ్ఛధ్వం సం వదధ్వం సం వో మనాంసి జానతామ్ ।\nదేవా భాగం యథా పూర్వే సఞ్జానానా ఉపాసతే ॥","sloka_iast":"saṃ gacchadhvaṃ saṃ vadadhvaṃ saṃ vo manāṃsi jānatām |\ndevā bhāgaṃ yathā pūrve sañjānānā upāsate ||","meaning_en":"Come together, speak together, let your minds be in harmony.","meaning_te":"కలిసి రండి, కలిసి మాట్లాడండి, మీ మనసులు సమరసంగా ఉండనీయండి.","meaning_sa":"एकत्र आगच्छत, एकत्र वदत, यूयं मनसा सह जानीत।","source_en":"Ṛgveda X.191.2 — Saṃjñāna Sūkta","source_te":"ఋగ్వేదం X.191.2 — సంజ్ఞాన సూక్తం","source_sa":"ऋग्वेदः X.१९१.२ — सञ्ज्ञानसूक्तम्","scripture_intro":"ఋగ్వేద సంజ్ఞాన సూక్తం (X.191) మనస్సు, వాక్కు మరియు కర్మలో ఐక్యతను పిలుపు ఇచ్చే సామాజిక సమరసత యొక్క స్తోత్రం."},{"id":"events","section":"కార్యక్రమాలు","pattern_name":"కాల చక్రం","pattern_why":"కార్తికేయ ప్రయాణంలోని ప్రతి మైలురాయి మహాకాల చక్రంలో ఒక క్షణం. స్వర్ణపతకం, పఠనాలు, ప్రదర్శనలు — ఈ చక్రంలో అన్నీ ఒక్కో ఆకు.","sloka_dev":"कालोऽस्मि लोकक्षयकृत् प्रवृद्धो\nलोकान् समाहर्तुमिह प्रवृत्तः ।","sloka_te":"కాలోఽస్మి లోకక్షయకృత్ ప్రవృద్ధో\nలోకాన్ సమాహర్తుమిహ ప్రవృత్తః ।","sloka_iast":"kālo'smi lokakṣayakṛt pravṛddho\nlokān samāhartum iha pravṛttaḥ |","meaning_en":"I am Time, the great destroyer of worlds, fully developed, and I have come here to consume all these worlds.","meaning_te":"నేను కాలాన్ని, లోకాలను నాశనం చేయు మహాశక్తిని, పరిపక్వమైనాను, ఇక్కడ ఈ లోకాలన్నింటినీ సంహరించడానికి వచ్చాను.","meaning_sa":"अहं कालः, लोकानां क्षयकर्ता, एतान् सर्वान् लोकान् संहर्तुम् प्रवृत्तः।","source_en":"Bhagavad Gītā 11.32","source_te":"భగవద్గీత 11.32","source_sa":"भगवद्गीता ११.३२","scripture_intro":"భగవద్గీత 11వ అధ్యాయంలో అత్యంత విస్మయకరమైన క్షణం ఉంది — అర్జునుడు కృష్ణుని విశ్వరూపాన్ని దర్శించడం."},{"id":"parayana","section":"పారాయణ","pattern_name":"OM తరంగ వలయాలు","pattern_why":"పవిత్ర అక్షరం OM (ప్రణవ) సమస్త సృష్టి ఉద్భవించిన ఆదిమ శబ్దం అని చెప్పబడింది. కార్తికేయ పారాయణ చేసినప్పుడు — విష్ణు సహస్రనామ, లలితా సహస్రనామ లేదా భగవద్గీత — అతడు మానవ కంఠం మరియు విశ్వ శబ్దం మధ్య ఆ సంబంధాన్ని పునఃస్థాపిస్తున్నాడు.","sloka_dev":"ॐ तत्सदिति निर्देशो ब्रह्मणस्त्रिविधः स्मृतः ।\nब्राह्मणास्तेन वेदाश्च यज्ञाश्च विहिताः पुरा ॥","sloka_te":"ఓం తత్సదితి నిర్దేశో బ్రహ్మణస్త్రివిధః స్మృతః ।\nబ్రాహ్మణాస్తేన వేదాశ్చ యజ్ఞాశ్చ విహితాః పురా ॥","sloka_iast":"oṃ tat sad iti nirdeśo brahmaṇas trividhaḥ smṛtaḥ |\nbrāhmaṇās tena vedāś ca yajñāś ca vihitāḥ purā ||","meaning_en":"OM, TAT, SAT — these three are the designation of Brahman. By these the Vedas and sacred rites were established.","meaning_te":"ఓం, తత్, సత్ — ఇవి బ్రహ్మనకు మూడు సంకేతాలు. వీటి ద్వారానే వేదాలు మరియు యజ్ఞాలు ఏర్పాటు చేయబడ్డాయి.","meaning_sa":"ओम्, तत्, सत् — इति ब्रह्मणः त्रिविधः निर्देशः। एतैः वेदाः यज्ञाश्च विहिताः।","source_en":"Bhagavad Gītā 17.23","source_te":"భగవద్గీత 17.23","source_sa":"भगवद्गीता १७.२३","scripture_intro":"వేద సంప్రదాయం OM శబ్దం నుండే విశ్వం సృష్టించబడిందని భావిస్తుంది — ప్రణవం. పారాయణ (పవిత్ర పఠనం) అనేది వ్యక్తిగత కంఠాన్ని ఈ విశ్వ శబ్దంతో మళ్ళీ అనుసంధానించే సాధన."},{"id":"support","section":"సహకారం","pattern_name":"పుష్ప యజ్ఞ నమూనా","pattern_why":"వేద సంప్రదాయంలో, యజ్ఞం అంటే కేవలం అగ్ని వేడుక మాత్రమే కాదు — ఇతరుల మేలుకోసం భక్తితో చేసే ఏ పని అయినా యజ్ఞమే. ఒక యువ విద్వాంసుని ప్రయాణానికి మద్దతు ఇవ్వడం స్వయంగా ఒక యజ్ఞం.","sloka_dev":"सहयज्ञाः प्रजाः सृष्ट्वा पुरोवाच प्रजापतिः ।\nअनेन प्रसविष्यध्वम् एष वोऽस्त्विष्टकामधुक् ॥","sloka_te":"సహయజ్ఞాః ప్రజాః సృష్ట్వా పురోవాచ ప్రజాపతిః ।\nఅనేన ప్రసవిష్యధ్వమ్ ఏష వోఽస్త్విష్టకామధుక్ ॥","sloka_iast":"sahayajñāḥ prajāḥ sṛṣṭvā purovāca prajāpatiḥ |\nanena prasaviṣyadhvam eṣa vo'stv iṣṭakāmadhuk ||","meaning_en":"Having created humanity with yajña, the Creator declared: By this shall you flourish; may this be the fulfiller of your desires.","meaning_te":"యజ్ఞముతో కలిసి ప్రజలను సృష్టించి, ప్రజాపతి ఇలా చెప్పాడు: 'దీని ద్వారా మీరు వర్ధిల్లండి; ఇది మీ కోరికలను తీర్చే కల్పవృక్షం అవుతుంది.'","meaning_sa":"यज्ञेन सह प्रजाः सृष्ट्वा प्रजापतिः उक्तवान्: 'अनेन समृद्धिं प्राप्स्यथ।'","source_en":"Bhagavad Gītā 3.10","source_te":"భగవద్గీత 3.10","source_sa":"भगवद्गीता ३.१०","scripture_intro":"భగవద్గీత 3వ అధ్యాయం కర్మ యోగాన్ని — నిస్వార్థ కర్మ మార్గాన్ని — వివరిస్తుంది. శ్లోకాలు 10-16 యజ్ఞం యొక్క విశ్వ సూత్రాన్ని వివరిస్తాయి."},{"id":"testimonials","section":"అభిప్రాయాలు","pattern_name":"సున్నితమైన కోట్ ఆర్చ్‌లు","pattern_why":"వేద సంప్రదాయంలో, సాక్షాత్కారమైన గురువు మాట (గురు-వాక్య) స్వయంగా శాస్త్రం యొక్క ఒక రూపం. సమవేదం శంఖముఖ శర్మ వంటి పండితులు కార్తికేయ గురించి మాట్లాడినప్పుడు, వారి మాటలు సంప్రదాయం యొక్క బరువును మోస్తాయి.","sloka_dev":"सत्यमेव जयते नानृतं\nसत्येन पन्था विततो देवयानः ।","sloka_te":"సత్యమేవ జయతే నానృతం\nసత్యేన పంథా వితత్ దేవయానః ।","sloka_iast":"satyam eva jayate nānṛtaṃ\nsatyena panthā vitato devayānaḥ |","meaning_en":"Truth alone triumphs, not falsehood. Through truth is laid the path that leads to the divine.","meaning_te":"సత్యమే జయిస్తుంది, అసత్యం కాదు. సత్యం ద్వారానే దైవానికి చేరే మార్గం వేయబడింది.","meaning_sa":"सत्यमेव विजयते, न असत्यम्। सत्येन एव देवयानः मार्गः।","source_en":"Muṇḍaka Upaniṣad 3.1.6 — motto of the Government of India","source_te":"ముండక ఉపనిషత్ 3.1.6 — భారత ప్రభుత్వ నినాదం","source_sa":"मुण्डकोपनिषत् ३.१.६ — भारतसर्वकारस्य आदर्शवाक्यम्","scripture_intro":"ముండక ఉపనిషత్ ప్రధాన ఉపనిషత్తులలో ఒకటి, అథర్వ వేదంలో భాగం. 'పరా విద్య' (ఆత్మ జ్ఞానం) మరియు 'అపరా విద్య' (ప్రాపంచిక జ్ఞానం) మధ్య తేడాను వివరిస్తుంది."},{"id":"youtube","section":"యూట్యూబ్","pattern_name":"శ్రుతి తరంగాలు","pattern_why":"'వేదం' అనే పదం 'విద్' (తెలుసుకోవడం) అనే మూలం నుండి వచ్చింది. వేదాలు శ్రుతి — వేలాది సంవత్సరాల పాటు రాతకు ముందే మౌఖికంగా ప్రసారమయ్యాయి. కార్తికేయ యొక్క యూట్యూబ్ ఛానెల్ ఈ శ్రుతి సంప్రదాయం యొక్క ఆధునిక కొనసాగింపు.","sloka_dev":"श्रुतिः स्मृतिश्च वेदोक्तं धर्मं विद्यां तथैव च ।\nसर्वं वेदात् प्रसिद्ध्यति वेदो हि परमं प्रमाणम् ॥","sloka_te":"శ్రుతిః స్మృతిశ్చ వేదోక్తం ధర్మం విద్యాం తథైవ చ ।\nసర్వం వేదాత్ ప్రసిద్ధ్యతి వేదో హి పరమం ప్రమాణమ్ ॥","sloka_iast":"śrutiḥ smṛtiś ca vedoktaṃ dharmaṃ vidyāṃ tathaiva ca |\nsarvaṃ vedāt prasiddhyati vedo hi paramaṃ pramāṇam ||","meaning_en":"Śruti and Smṛti, dharma and knowledge — all this is known through the Veda. The Veda is the supreme authority.","meaning_te":"శ్రుతి మరియు స్మృతి, ధర్మం మరియు విద్య — ఇవన్నీ వేదం ద్వారా తెలుసుకోబడతాయి. వేదమే అత్యున్నత ప్రమాణం.","meaning_sa":"श्रुतिः स्मृतिश्च, धर्मं विद्यां च — सर्वं वेदात् ज्ञायते। वेदः परमं प्रमाणम्।","source_en":"Based on Manusmṛti 2.10","source_te":"మనుస్మృతి 2.10 ఆధారంగా","source_sa":"मनुस्मृतेः २.१० आधारेण","scripture_intro":"వేద సంప్రదాయం శ్రుతి (వినబడినది — శాశ్వత వేదాలు) మరియు స్మృతి (స్మరించబడినది — ఇతిహాసాలు, పురాణాలు) మధ్య తేడాను చేస్తుంది."},{"id":"contact","section":"సంప్రదించండి","pattern_name":"సంధి నమూనా","pattern_why":"సంస్కృత వ్యాకరణంలో, సంధి అంటే శబ్దాల అనుసంధానం — రెండు పదాలు కలిసినప్పుడు జరిగే అందమైన విలీనం. సంప్రదింపు అనేది రెండు జీవితాల సంధి. కార్తికేయకు పంపిన ప్రతి సందేశం సంప్రదాయం యొక్క మహా వలలో ఒక చిన్న అనుసంధానం.","sloka_dev":"सर्वे भवन्तु सुखिनः । सर्वे सन्तु निरामयाः ।\nसर्वे भद्राणि पश्यन्तु । मा कश्चिद्दुःखभाग् भवेत् ॥","sloka_te":"సర్వే భవంతు సుఖినః । సర్వే సంతు నిరామయాః ।\nసర్వే భద్రాణి పశ్యంతు । మా కశ్చిద్దుఃఖభాగ్ భవేత్ ॥","sloka_iast":"sarve bhavantu sukhinaḥ | sarve santu nirāmayāḥ |\nsarve bhadrāṇi paśyantu | mā kaścid duḥkhabhāg bhavet ||","meaning_en":"May all be happy. May all be free from disease. May all see what is auspicious. May none suffer.","meaning_te":"అందరూ సుఖంగా ఉండుగాక. అందరూ రోగరహితంగా ఉండుగాక. అందరూ శుభాలను చూడుగాక. ఎవ్వరూ దుఃఖం పొందకుండుగాక.","meaning_sa":"सर्वे सुखिनः भवन्तु। सर्वे निरामयाः भवन्तु। सर्वे भद्राणि पश्यन्तु। कोऽपि दुःखभाक् न भवेत्।","source_en":"Bṛhadāraṇyaka Upaniṣad — universal peace prayer","source_te":"బృహదారణ్యక ఉపనిషత్ — విశ్వ శాంతి ప్రార్థన","source_sa":"बृहदारण्यकोपनिषत् — सर्वलोककल्याणप्रार्थना","scripture_intro":"బృహదారణ్యక ఉపనిషత్ అన్నింటిలోకెల్లా పెద్దది మరియు పురాతనమైన ఉపనిషత్తులలో ఒకటి. దాని శాంతి మంత్రం — 'సర్వే భవంతు సుఖినః' — అత్యంత విస్తృతంగా ప్రేమించబడే సంస్కృత ప్రార్థనలలో ఒకటి."}],"scriptures":[{"id":"gita","name":"శ్రీమద్ భగవద్గీత","name_te":"శ్రీమద్ భగవద్గీత","name_dev":"श्रीमद्भगवद्गीता","verses":"700 శ్లోకాలు · 18 అధ్యాయాలు","part_of":"మహాభారతం, షష్ఠ పర్వం (భీష్మ పర్వం)","period":"క్రీ.పూ. 400 – క్రీ.శ. 200 మధ్య రచించబడింది","intro_en":"The Bhagavad Gītā is a 700-verse dialogue between Arjuna and Kṛṣṇa. Karthikeya has memorised all 700 verses and received the Gold Medal from Mysore Datta Peetham.","intro_te":"భగవద్గీత అర్జునుడు మరియు కృష్ణుడి మధ్య యుద్ధభూమిలో జరిగిన 700 శ్లోకాల సంభాషణ. కర్తవ్యం, కర్మ, భక్తి, జ్ఞానం మరియు మోక్షంపై మానవజాతి యొక్క గొప్ప ఆధ్యాత్మిక బోధనలలో ఒకటి. కార్తికేయ 700 శ్లోకాలు మొత్తం కంఠస్థం చేసి మైసూర్ దత్త పీఠం నుండి స్వర్ణపతకం అందుకున్నాడు.","key_teachings":["కర్మ యోగం — నిస్వార్థ కర్మ","జ్ఞాన యోగం — జ్ఞాన మార్గం","భక్తి యోగం — భక్తి మార్గం","రాజ యోగం — ధ్యాన మార్గం","ధర్మం — ధర్మబద్ధ కర్తవ్యం"],"quoted_verses":["4.7 — ధర్మ క్షీణించినప్పుడు నేను అవతరిస్తాను (హోమ్)","4.9 — నా జన్మ మరియు కర్మలు దివ్యమైనవి (పరిచయం)","11.32 — నేను కాలాన్ని (కార్యక్రమాలు)","17.23 — OM TAT SAT (పారాయణ)","3.10 — యజ్ఞముతో సృష్టి (సహకారం)"]},{"id":"rigveda","name":"ఋగ్వేదం","name_te":"ఋగ్వేదం","name_dev":"ऋग्वेदः","verses":"10,552 మంత్రాలు · 1,028 సూక్తాలు · 10 మండలాలు","part_of":"నాలుగు వేదాలలో పురాతనమైనది","period":"క్రీ.పూ. 1500–1200 (ప్రపంచంలో పురాతన మత గ్రంథాలలో ఒకటి)","intro_en":"The Ṛgveda is the world's oldest collection of sacred hymns.","intro_te":"ఋగ్వేదం ప్రపంచంలో పురాతనమైన పవిత్ర సూక్తాల సంకలనం, వైదిక సంస్కృతంలో రచించబడింది. దాని 1,028 సూక్తాలు ప్రకృతి శక్తులను సూచించే 33 దేవతలకు అంకితం చేయబడ్డాయి — అగ్ని, ఇంద్రుడు, సూర్యుడు, వరుణుడు మరియు ఇతరులు.","key_teachings":["అగ్ని సూక్తం — పవిత్ర అగ్ని","పురుష సూక్తం — విశ్వ సృష్టి","నాసదీయ సూక్తం — విశ్వ ఉద్భవం","సంజ్ఞాన సూక్తం — ఐక్యత మరియు సమరసత (X.191)"],"quoted_verses":["X.191.2 — కలిసి రండి, కలిసి మాట్లాడండి (కృతజ్ఞతలు)","పద్మ ప్రతీకాత్మకత — పవిత్రత మరియు సృష్టి (హోమ్)"]},{"id":"upanishads","name":"ఉపనిషత్తులు","name_te":"ఉపనిషత్తులు","name_dev":"उपनिषदः","verses":"108 ఉపనిషత్తులు · 13 ముఖ్యమైనవి","part_of":"వేదాల తాత్విక భాగం (వేదాంతం)","period":"క్రీ.పూ. 800–200 మధ్య రచించబడ్డాయి","intro_en":"The Upaniṣads are the philosophical heart of the Vedas.","intro_te":"ఉపనిషత్తులు వేదాల తాత్విక హృదయం — 'ఆత్మ ఏమిటి? బ్రహ్మం ఏమిటి? విముక్తి ఎలా సాధించాలి?' వంటి లోతైన ప్రశ్నలను అన్వేషించే 108 గ్రంథాలు. 'ఉపనిషత్' అంటే 'సమీపంలో కూర్చోవడం' — విద్యార్థి గురువు సమీపంలో కూర్చున్నట్లు.","key_teachings":["తత్ త్వమ్ అసి — నువ్వు అదే (ఛాందోగ్య)","అహం బ్రహ్మాస్మి — నేను బ్రహ్మాన్ని (బృహదారణ్యక)","సత్యం జ్ఞానం అనంతం బ్రహ్మ (తైత్తిరీయ)","OM ఇతి ఏతత్ అక్షరం — OM శాశ్వతం (మాండూక్య)"],"quoted_verses":["ముండక 3.1.6 — సత్యమేవ జయతే (అభిప్రాయాలు)","బృహదారణ్యక — సర్వే భవంతు సుఖినః (సంప్రదించండి)","మాండూక్య — OM విశ్వ శబ్దంగా (పారాయణ)"]},{"id":"hitopadesha","name":"హితోపదేశం","name_te":"హితోపదేశం","name_dev":"हितोपदेशः","verses":"దాదాపు 43 కథలు · వందలాది శ్లోకాలు","part_of":"సంస్కృత కావ్యం మరియు నీతి శాస్త్రం","period":"నారాయణ పండిత రచించింది, క్రీ.శ. 800–1200","intro_en":"The Hitopadeśa contains animal fables and wisdom verses.","intro_te":"హితోపదేశం (మేలైన సలహా) ఆచరణాత్మక జ్ఞానం మరియు నైతిక ప్రవర్తన నేర్పడానికి జంతు కథలతో రూపొందించిన సంస్కృత రచన. దాని తొలి
