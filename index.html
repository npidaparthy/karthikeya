<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Karthikeya Pidaparthy — Samskruti</title>
  <meta name="description" content="Karthikeya Pidaparthy — Sanskrit scholar, Bhagavad Gita memoriser, Sanskrit Olympiad winner. Sydney, Australia."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:#fdf8f0; --surface:#fff9ef; --gold:#c8860a; --gold-light:#f0c84a;
      --gold-dark:#8b5e06; --maroon:#7a1a2e; --maroon-light:#c4405a;
      --text:#2c1a0e; --text-muted:#6b4c30; --text-subtle:#a07850;
      --border:rgba(200,134,10,0.25); --border-strong:rgba(200,134,10,0.5);
      --shadow:0 4px 24px rgba(122,26,46,0.08); --shadow-lg:0 12px 48px rgba(122,26,46,0.15);
      --nav-h:72px; --fs:16px; --radius:12px; --tr:0.28s cubic-bezier(0.4,0,0.2,1);
    }
    [data-theme="dark"]{
      --bg:#1a0f07; --surface:#231408; --gold:#f0c84a; --gold-light:#fde68a;
      --gold-dark:#c8860a; --maroon:#e06080; --maroon-light:#f4a0b8;
      --text:#fdf0d8; --text-muted:#d4a870; --text-subtle:#a07850;
      --border:rgba(240,200,74,0.2); --border-strong:rgba(240,200,74,0.4);
      --shadow:0 4px 24px rgba(0,0,0,0.4); --shadow-lg:0 12px 48px rgba(0,0,0,0.6);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;font-size:var(--fs)}
    body{font-family:'EB Garamond',Georgia,serif;background:var(--bg);color:var(--text);line-height:1.7;transition:background var(--tr),color var(--tr)}
    .te{font-family:'Noto Sans Telugu',sans-serif}
    .dev{font-family:'Noto Sans Devanagari',sans-serif}
    .cinzel{font-family:'Cinzel',serif}

    /* NAV */
    nav#mainNav{position:fixed;top:0;left:0;right:0;z-index:1000;height:var(--nav-h);background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow);display:flex;align-items:center;padding:0 1.5rem;transition:background var(--tr)}
    .logo-btn{display:flex;align-items:center;gap:.75rem;text-decoration:none;color:var(--text);cursor:pointer;border:none;background:none;padding:0;flex-shrink:0}
    .logo-svg{width:44px;height:44px;flex-shrink:0}
    .logo-text{display:flex;flex-direction:column;line-height:1.1}
    .logo-text .ln{font-family:'Cinzel',serif;font-size:15px;font-weight:600;color:var(--gold);letter-spacing:.04em}
    .logo-text .lt{font-size:11px;color:var(--text-subtle);font-style:italic;letter-spacing:.05em}
    .nav-links{display:flex;gap:0;list-style:none;margin-left:auto;align-items:center}
    .nav-links li a{display:block;padding:.35rem .65rem;font-family:'Cinzel',serif;font-size:11.5px;color:var(--text-muted);text-decoration:none;letter-spacing:.04em;white-space:nowrap;transition:color var(--tr);border-bottom:2px solid transparent}
    .nav-links li a:hover,.nav-links li a.active{color:var(--gold);border-bottom-color:var(--gold)}
    .nav-right{display:flex;align-items:center;gap:.4rem;margin-left:.75rem;flex-shrink:0}
    .icon-btn{background:none;border:1px solid var(--border);border-radius:8px;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:15px;transition:all var(--tr)}
    .icon-btn:hover{border-color:var(--gold);color:var(--gold)}
    .lang-sel{background:none;border:1px solid var(--border);border-radius:8px;padding:.25rem .5rem;cursor:pointer;font-family:'Cinzel',serif;font-size:11px;color:var(--text-muted);letter-spacing:.04em;transition:all var(--tr)}
    .lang-sel:hover,.lang-sel.active{border-color:var(--gold);color:var(--gold);background:rgba(200,134,10,.07)}
    .hamburger{display:none}

    /* SETTINGS */
    .s-overlay{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.45)}
    .s-overlay.open{display:block}
    .s-panel{position:fixed;top:var(--nav-h);right:0;bottom:0;width:300px;background:var(--surface);border-left:1px solid var(--border-strong);padding:1.75rem 1.5rem;overflow-y:auto;z-index:2001;transform:translateX(100%);transition:transform var(--tr)}
    .s-panel.open{transform:translateX(0)}
    .s-panel h3{font-family:'Cinzel',serif;font-size:15px;color:var(--gold);margin-bottom:1.5rem;letter-spacing:.05em}
    .s-group{margin-bottom:1.5rem}
    .s-group label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:.4rem;font-style:italic}
    .s-group input[type=range]{width:100%;accent-color:var(--gold)}
    .swatches{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.4rem}
    .sw{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .2s}
    .sw:hover,.sw.active{transform:scale(1.2);border-color:var(--text)}
    .theme-row{display:flex;gap:.4rem;margin-top:.4rem}
    .t-opt{flex:1;padding:.35rem;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:11px;text-align:center;color:var(--text-muted);background:none;font-family:'Cinzel',serif;transition:all var(--tr)}
    .t-opt.active,.t-opt:hover{border-color:var(--gold);color:var(--gold);background:rgba(200,134,10,.07)}
    .lang-btns{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.4rem}
    .l-btn{padding:.25rem .6rem;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:12px;color:var(--text-muted);background:none;font-family:'Cinzel',serif;transition:all var(--tr)}
    .l-btn.active,.l-btn:hover{border-color:var(--gold);color:var(--gold);background:rgba(200,134,10,.07)}

    /* LAYOUT */
    main{padding-top:var(--nav-h)}
    .section{padding:5rem 0}
    .alt{background:var(--surface)}
    .container{max-width:1100px;margin:0 auto;padding:0 2rem}
    .sec-title{font-family:'Cinzel',serif;font-size:clamp(22px,3vw,30px);color:var(--gold-dark);margin-bottom:.4rem;letter-spacing:.03em}
    [data-theme="dark"] .sec-title{color:var(--gold)}
    .sec-sub{color:var(--text-subtle);font-style:italic;margin-bottom:2rem}
    .divider{width:56px;height:3px;background:linear-gradient(90deg,var(--gold),transparent);margin:.6rem 0 2.2rem;border-radius:2px}

    /* HERO */
    #home{min-height:100vh;display:flex;align-items:center;background:var(--surface);position:relative;overflow:hidden}
    .hero-pat{position:absolute;inset:0;opacity:.04;background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l4 12h12l-10 8 4 12-10-8-10 8 4-12-10-8h12z' fill='%23c8860a'/%3E%3C/svg%3E")}
    .hero-inner{display:flex;align-items:center;gap:4rem;position:relative}
    .hero-photo{flex-shrink:0;width:280px;height:280px;border-radius:50%;border:4px solid var(--gold);box-shadow:0 0 0 8px rgba(200,134,10,.1),var(--shadow-lg);overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gold-light) 0%,var(--maroon) 100%)}
    .hero-photo svg{width:100%;height:100%}
    .hero-greeting{font-size:12px;letter-spacing:.14em;color:var(--maroon);text-transform:uppercase;margin-bottom:.65rem;font-family:'Cinzel',serif}
    [data-theme="dark"] .hero-greeting{color:var(--maroon-light)}
    .hero-name{font-family:'Cinzel',serif;font-size:clamp(32px,5vw,52px);font-weight:700;color:var(--gold-dark);line-height:1.1;margin-bottom:.4rem}
    [data-theme="dark"] .hero-name{color:var(--gold-light)}
    .hero-sub2{font-size:1.1rem;color:var(--maroon);font-style:italic;margin-bottom:1.25rem}
    [data-theme="dark"] .hero-sub2{color:var(--maroon-light)}
    .hero-desc{max-width:520px;color:var(--text-muted);font-size:1.05rem;margin-bottom:1.75rem}
    .hero-badges{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.75rem}
    .badge{padding:.28rem .85rem;border-radius:100px;border:1px solid var(--border-strong);font-size:11.5px;color:var(--gold-dark);background:rgba(200,134,10,.07);font-family:'Cinzel',serif;letter-spacing:.04em}
    [data-theme="dark"] .badge{color:var(--gold-light)}
    .hero-cta{display:flex;gap:.9rem;flex-wrap:wrap}
    .btn-p{padding:.72rem 1.9rem;border-radius:var(--radius);background:var(--gold);color:#fff;font-family:'Cinzel',serif;font-size:12.5px;letter-spacing:.07em;text-decoration:none;border:none;cursor:pointer;transition:all var(--tr)}
    .btn-p:hover{background:var(--gold-dark);transform:translateY(-2px);box-shadow:var(--shadow)}
    .btn-o{padding:.72rem 1.9rem;border-radius:var(--radius);border:1px solid var(--border-strong);color:var(--gold);font-family:'Cinzel',serif;font-size:12.5px;letter-spacing:.07em;text-decoration:none;background:none;cursor:pointer;transition:all var(--tr)}
    .btn-o:hover{background:rgba(200,134,10,.08);transform:translateY(-2px)}
    .scroll-hint{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text-subtle);letter-spacing:.1em;display:flex;flex-direction:column;align-items:center;gap:.3rem;animation:bounce 2s infinite}
    @keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(6px)}}

    /* ABOUT */
    .about-grid{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:start}
    .quote-block{border-left:3px solid var(--gold);padding-left:1.1rem;margin:1.4rem 0}
    .q-sa{font-size:1.05rem;color:var(--gold-dark);margin-bottom:.2rem}
    [data-theme="dark"] .q-sa{color:var(--gold)}
    .q-te{font-family:'Noto Sans Telugu',sans-serif;font-size:.85rem;color:var(--text-muted)}
    .q-en{font-style:italic;font-size:.85rem;color:var(--text-subtle)}
    .about-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.35rem;margin-bottom:.9rem;transition:box-shadow var(--tr)}
    .about-card:hover{box-shadow:var(--shadow)}
    .about-card h4{font-family:'Cinzel',serif;color:var(--gold-dark);font-size:13px;margin-bottom:.6rem;letter-spacing:.04em}
    [data-theme="dark"] .about-card h4{color:var(--gold)}
    .about-card p{font-size:.88rem;color:var(--text-muted);line-height:1.8}

    /* PROFILE */
    .ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.35rem}
    .ach-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem 1.6rem;transition:all var(--tr);position:relative;overflow:hidden}
    .ach-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--maroon))}
    .ach-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
    .ach-icon{font-size:28px;margin-bottom:.6rem}
    .ach-title{font-family:'Cinzel',serif;font-size:14px;color:var(--gold-dark);margin-bottom:.35rem}
    [data-theme="dark"] .ach-title{color:var(--gold)}
    .ach-desc{font-size:13px;color:var(--text-muted);line-height:1.7}
    .ach-year{margin-top:.6rem;font-size:11px;color:var(--text-subtle);font-style:italic}

    /* CREDITS */
    .credits-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.9rem}
    .credit-item{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem 1.1rem}
    .credit-name{font-family:'Cinzel',serif;font-size:13.5px;color:var(--gold-dark)}
    [data-theme="dark"] .credit-name{color:var(--gold)}
    .credit-role{font-size:12px;color:var(--text-subtle);font-style:italic;margin-top:.15rem}

    /* EVENTS TIMELINE */
    .timeline{position:relative;padding-left:2rem}
    .timeline::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--gold),transparent)}
    .tl-item{position:relative;margin-bottom:2.25rem}
    .tl-dot{position:absolute;left:-2rem;top:.3rem;width:14px;height:14px;border-radius:50%;background:var(--gold);border:2px solid var(--surface);box-shadow:0 0 0 3px rgba(200,134,10,.2)}
    .tl-date{font-size:11.5px;color:var(--text-subtle);font-style:italic;margin-bottom:.2rem}
    .tl-title{font-family:'Cinzel',serif;font-size:14.5px;color:var(--gold-dark);margin-bottom:.35rem}
    [data-theme="dark"] .tl-title{color:var(--gold)}
    .tl-desc{font-size:13.5px;color:var(--text-muted)}

    /* PARAYANA */
    .para-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.35rem}
    .para-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:1.6rem;transition:box-shadow var(--tr)}
    .para-card:hover{box-shadow:var(--shadow)}
    .para-card h3{font-family:'Cinzel',serif;color:var(--gold-dark);font-size:15px;margin-bottom:.65rem}
    [data-theme="dark"] .para-card h3{color:var(--gold)}
    .script-tabs{display:flex;gap:.35rem;margin-bottom:.65rem}
    .s-tab{padding:.2rem .55rem;border-radius:6px;font-size:11px;border:1px solid var(--border);cursor:pointer;color:var(--text-subtle);background:none;transition:all var(--tr)}
    .s-tab.active,.s-tab:hover{border-color:var(--gold);color:var(--gold);background:rgba(200,134,10,.07)}
    .sa-verse{font-size:14.5px;color:var(--maroon);line-height:2;white-space:pre-line}
    [data-theme="dark"] .sa-verse{color:var(--maroon-light)}
    .sa-verse.iast{font-style:italic;font-size:13px;color:var(--text-muted)}
    .attr{font-size:12px;color:var(--text-subtle);font-style:italic;margin-top:.6rem}

    /* TESTIMONIALS */
    .testi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.35rem}
    .testi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.6rem;transition:box-shadow var(--tr)}
    .testi-card:hover{box-shadow:var(--shadow)}
    .q-mark{font-family:'Cinzel',serif;font-size:56px;color:var(--gold);opacity:.18;line-height:.8;margin-bottom:.4rem}
    .testi-text{font-style:italic;color:var(--text-muted);font-size:.98rem;line-height:1.8;margin-bottom:.9rem}
    .testi-by{font-family:'Cinzel',serif;font-size:12.5px;color:var(--gold-dark)}
    [data-theme="dark"] .testi-by{color:var(--gold)}
    .testi-role{font-size:11.5px;color:var(--text-subtle);font-style:italic}

    /* YOUTUBE */
    .yt-channel-link{display:flex;align-items:center;gap:.75rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.4rem;text-decoration:none;color:var(--text);transition:all var(--tr);margin-bottom:1.5rem}
    .yt-channel-link:hover{border-color:var(--gold);box-shadow:var(--shadow)}
    .yt-ch-name{font-family:'Cinzel',serif;font-size:14px;color:var(--gold-dark)}
    [data-theme="dark"] .yt-ch-name{color:var(--gold)}
    .yt-ch-sub{font-size:11.5px;color:var(--text-subtle)}
    .yt-bharatam{display:flex;align-items:center;gap:1rem;background:var(--surface);border:2px solid var(--border-strong);border-radius:var(--radius);padding:1.25rem 1.5rem;text-decoration:none;color:var(--text);transition:all var(--tr);margin-bottom:1.75rem}
    .yt-bharatam:hover{border-color:var(--gold);box-shadow:var(--shadow-lg)}
    .yt-bharatam-icon{font-size:36px}
    .yt-bharatam-title{font-family:'Cinzel',serif;font-size:16px;color:var(--gold-dark);margin-bottom:.2rem}
    [data-theme="dark"] .yt-bharatam-title{color:var(--gold)}
    .yt-bharatam-desc{font-size:13px;color:var(--text-muted)}
    .yt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.35rem}
    .yt-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all var(--tr)}
    .yt-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
    .yt-thumb{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,var(--maroon) 0%,var(--gold-dark) 100%);display:flex;align-items:center;justify-content:center;font-size:42px;color:rgba(255,255,255,.85)}
    .yt-info{padding:.9rem 1.1rem}
    .yt-vtitle{font-family:'Cinzel',serif;font-size:13.5px;color:var(--text);margin-bottom:.3rem}
    .yt-vmeta{font-size:12px;color:var(--text-subtle)}

    /* SUPPORT */
    .supp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.35rem}
    .supp-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.75rem;text-align:center;transition:all var(--tr)}
    .supp-card:hover{box-shadow:var(--shadow);transform:translateY(-3px)}
    .supp-icon{font-size:32px;margin-bottom:.9rem}
    .supp-card h3{font-family:'Cinzel',serif;color:var(--gold-dark);font-size:15px;margin-bottom:.65rem}
    [data-theme="dark"] .supp-card h3{color:var(--gold)}
    .supp-card p{font-size:13px;color:var(--text-muted);line-height:1.75}

    /* CONTACT */
    .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:3rem}
    .contact-form{display:flex;flex-direction:column;gap:.85rem}
    .contact-form input,.contact-form textarea{width:100%;padding:.7rem .95rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'EB Garamond',serif;font-size:var(--fs);outline:none;transition:border-color var(--tr)}
    .contact-form input:focus,.contact-form textarea:focus{border-color:var(--gold)}
    .contact-form textarea{min-height:120px;resize:vertical}
    .info-item{display:flex;gap:.65rem;align-items:flex-start;margin-bottom:.9rem}
    .info-icon{color:var(--gold);font-size:17px;margin-top:2px}

    /* FOOTER */
    footer{background:var(--surface);border-top:1px solid var(--border);text-align:center;padding:1.75rem 1rem;font-size:13px;color:var(--text-subtle)}
    footer .f-sa{font-size:15px;color:var(--gold-dark);margin-bottom:.4rem}
    [data-theme="dark"] footer .f-sa{color:var(--gold)}

    /* MOBILE MENU */
    .mob-menu{display:none;position:fixed;inset:0;top:var(--nav-h);z-index:999;background:var(--surface);flex-direction:column;padding:1.75rem;gap:.4rem;overflow-y:auto}
    .mob-menu.open{display:flex}
    .mob-menu a{font-family:'Cinzel',serif;font-size:17px;color:var(--text);text-decoration:none;padding:.65rem 0;border-bottom:1px solid var(--border);letter-spacing:.05em}
    .mob-menu a:hover{color:var(--gold)}

    /* FADE UP */
    .fu{opacity:0;transform:translateY(20px);transition:opacity .55s,transform .55s}
    .fu.vis{opacity:1;transform:none}
    .fu:nth-child(2){transition-delay:.08s}
    .fu:nth-child(3){transition-delay:.16s}
    .fu:nth-child(4){transition-delay:.24s}
    .fu:nth-child(5){transition-delay:.32s}

    /* RESPONSIVE */
    @media(max-width:900px){
      .nav-links,.lang-sel{display:none}
      .hamburger{display:flex}
      .hero-inner{flex-direction:column;text-align:center;gap:2rem}
      .hero-photo{width:200px;height:200px}
      .hero-badges,.hero-cta{justify-content:center}
      .about-grid,.contact-grid{grid-template-columns:1fr}
    }
    @media(max-width:600px){
      .container{padding:0 1rem}
      .section{padding:3.5rem 0}
    }
  </style>
</head>
<body>

<!-- SETTINGS OVERLAY -->
<div class="s-overlay" id="sOverlay" onclick="if(event.target===this)closeSett()"></div>
<div class="s-panel" id="sPanel">
  <h3 id="s-title">⚙ Settings</h3>
  <div class="s-group">
    <label id="s-theme-lbl">Theme</label>
    <div class="theme-row">
      <button class="t-opt active" id="tL" onclick="setTheme('light')" id="s-light">☀ Light</button>
      <button class="t-opt" id="tD" onclick="setTheme('dark')" id="s-dark">☽ Dark</button>
    </div>
  </div>
  <div class="s-group">
    <label id="s-fs-lbl">Font Size — <span id="fsVal">16</span>px</label>
    <input type="range" min="13" max="22" value="16" id="fsSlider" oninput="setFS(this.value)"/>
  </div>
  <div class="s-group">
    <label id="s-accent-lbl">Accent Colour</label>
    <div class="swatches">
      <div class="sw active" style="background:#c8860a" onclick="setAccent('#c8860a','#8b5e06','#f0c84a',this)" title="Gold"></div>
      <div class="sw" style="background:#b07020" onclick="setAccent('#b07020','#7a4e15','#e0a020',this)" title="Amber"></div>
      <div class="sw" style="background:#7a1a2e" onclick="setAccent('#7a1a2e','#55111e','#c4405a',this)" title="Maroon"></div>
      <div class="sw" style="background:#1a5e3a" onclick="setAccent('#1a5e3a','#0f3e28','#3aaa6a',this)" title="Forest"></div>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
let T = {};               // current translations object
let LANG = 'en';
const LANGS = ['en','te','sa'];
const LANG_LABELS = {en:'EN',te:'తె',sa:'सं'};
const CONTENT_BASE = 'content';

// ─── LOAD LANGUAGE ────────────────────────────────────────────────────────────
async function loadLang(lang, btn) {
  LANG = lang;
  // update lang buttons in settings
  document.querySelectorAll('.l-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  // update quick toggle
  document.getElementById('langToggle').textContent = LANG_LABELS[lang];
  // set html lang attribute
  document.documentElement.lang = lang === 'sa' ? 'sa' : lang === 'te' ? 'te' : 'en';

  try {
    const resp = await fetch(`${CONTENT_BASE}/${lang}/strings.json`);
    T = await resp.json();
  } catch(e) {
    // fallback: content files not found (e.g. direct file:// open) — use embedded EN
    T = EN_FALLBACK;
  }
  renderAll();
  localStorage.setItem('kp-lang', lang);
}

// ─── RENDER ALL ───────────────────────────────────────────────────────────────
function renderAll() {
  renderNav();
  renderHero();
  renderAbout();
  renderProfile();
  renderCredits();
  renderEvents();
  renderParayana();
  renderSupport();
  renderTestimonials();
  renderYouTube();
  renderContact();
  renderFooter();
  renderSettings();
  reobserveFadeUp();
}

function t(section, key) { return (T[section] && T[section][key]) || ''; }

// ─── NAV ──────────────────────────────────────────────────────────────────────
function renderNav() {
  const nav = T.nav || {};
  document.getElementById('logo-name').textContent = T.logo?.name || 'Samskruti';
  document.getElementById('logo-tag').textContent = T.logo?.tagline || 'సంస్కృతి • संस्कृति';
  document.querySelectorAll('[data-nav]').forEach(el => {
    const k = el.getAttribute('data-nav');
    if (nav[k]) el.textContent = nav[k];
  });
}

// ─── HERO ─────────────────────────────────────────────────────────────────────
function renderHero() {
  const h = T.hero || {};
  set('h-greeting', h.greeting);
  set('h-name', h.name);
  set('h-age', h.age_location);
  set('h-desc', h.description);
  set('h-btn1', h.btn_achievements);
  set('h-btn2', h.btn_youtube);
  const badges = document.getElementById('h-badges');
  badges.innerHTML = '';
  ['badge_gold','badge_olympiad','badge_gita','badge_saundarya','badge_sivapadam'].forEach(k => {
    if (h[k]) { const s = document.createElement('span'); s.className='badge'; s.textContent=h[k]; badges.appendChild(s); }
  });
}

// ─── ABOUT ───────────────────────────────────────────────────────────────────
function renderAbout() {
  const a = T.about || {};
  set('a-title', a.section_title);
  set('a-p1', a.para1);
  set('a-p2', a.para2);
  set('a-qsa', a.quote_sa);
  set('a-qiast', a.quote_iast);
  set('a-qte', a.quote_te);
  set('a-qen', a.quote_en);
  set('a-c1t', a.card_lang_title);
  set('a-c1b', a.card_lang_body);
  set('a-c2t', a.card_scripture_title);
  set('a-c2b', a.card_scripture_body);
  set('a-c3t', a.card_community_title);
  set('a-c3b', a.card_community_body);
}

// ─── PROFILE ─────────────────────────────────────────────────────────────────
function renderProfile() {
  const p = T.profile || {};
  set('p-title', p.section_title);
  const grid = document.getElementById('achGrid');
  grid.innerHTML = '';
  (p.achievements || []).forEach(a => {
    grid.innerHTML += `<div class="ach-card fu">
      <div class="ach-icon">${a.icon}</div>
      <div class="ach-title">${a.title}</div>
      <div class="ach-desc">${a.desc}</div>
      <div class="ach-year">${a.year}</div>
    </div>`;
  });
}

// ─── CREDITS ─────────────────────────────────────────────────────────────────
function renderCredits() {
  const c = T.credits || {};
  set('cr-title', c.section_title);
  set('cr-intro', c.intro);
  const grid = document.getElementById('creditsGrid');
  grid.innerHTML = '';
  (c.list || []).forEach(item => {
    grid.innerHTML += `<div class="credit-item fu">
      <div class="credit-name">${item.name}</div>
      <div class="credit-role">${item.role}</div>
    </div>`;
  });
}

// ─── EVENTS ──────────────────────────────────────────────────────────────────
function renderEvents() {
  const ev = T.events || {};
  set('ev-title', ev.section_title);
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';
  (ev.list || []).forEach(item => {
    tl.innerHTML += `<div class="tl-item fu">
      <div class="tl-dot"></div>
      <div class="tl-date">${item.date}</div>
      <div class="tl-title">${item.title}</div>
      <div class="tl-desc">${item.desc}</div>

}

// ─── PARAYANA ────────────────────────────────────────────────────────────────
function renderParayana() {
  const pr = T.parayana || {};
  set('pr-title', pr.section_title);
  set('pr-intro', pr.intro);
  const grid = document.getElementById('paraGrid');
  grid.innerHTML = '';
  (pr.stotras || []).forEach(s => {
    grid.innerHTML += `<div class="para-card fu">
      <h3>${s.title}</h3>
      <div class="script-tabs">
        <button class="s-tab active" onclick="showScript(this,'${s.id}',0)">${pr.tab_te||'Telugu'}</button>
        <button class="s-tab" onclick="showScript(this,'${s.id}',1)">${pr.tab_dev||'Devanāgarī'}</button>
        <button class="s-tab" onclick="showScript(this,'${s.id}',2)">${pr.tab_iast||'IAST'}</button>
      </div>
      <div class="sa-verse te" id="v-${s.id}-0">${s.te.replace(/\n/g,'<br>')}</div>
      <div class="sa-verse dev" id="v-${s.id}-1" style="display:none">${s.dev.replace(/\n/g,'<br>')}</div>
      <div class="sa-verse iast" id="v-${s.id}-2" style="display:none">${s.iast.replace(/\n/g,'<br>')}</div>
      <p class="attr">${s.attribution}</p>
    </div>`;
  });
}

function showScript(btn, id, idx) {
  btn.parentElement.querySelectorAll('.s-tab').forEach((t,i) => {
    t.classList.toggle('active', i===idx);
    const v = document.getElementById(`v-${id}-${i}`);
    if(v) v.style.display = i===idx ? '' : 'none';
  });
}

  const sp = T.support || {};

// ─── YOUTUBE ─────────────────────────────────────────────────────────────────
function renderYouTube() {
  const yt = T.youtube || {};
  set('yt-title', yt.section_title);
  const cont = document.getElementById('ytContent');
  const vids = (yt.videos || []).map(v =>
    `<div class="yt-card" onclick="window.open('${yt.channel_url}','_blank')">
      <div class="yt-thumb">▶</div>
      <div class="yt-info">
        <div class="yt-vtitle">${v.title}</div>
        <div class="yt-vmeta">${v.meta}</div>
      </div>
    </div>`
  ).join('');
  cont.innerHTML = `
    <a class="yt-channel-link" href="${yt.channel_url}" target="_blank" rel="noopener">
      <span style="font-size:28px">▶</span>
      <div>
        <div class="yt-ch-name">${yt.channel_name||''}</div>
        <div class="yt-ch-sub">${yt.channel_sub||''}</div>
      </div>
      <span style="margin-left:auto;color:var(--gold);font-size:18px">↗</span>
    </a>
    <a class="yt-bharatam" href="${yt.bharatam_url}" target="_blank" rel="noopener">
      <span class="yt-bharatam-icon">📜</span>
      <div>
        <div class="yt-bharatam-title">${yt.bharatam_title||'Bhāratam Laghu Prasaṅgālu'}</div>
        <div class="yt-bharatam-desc">${yt.bharatam_desc||''}</div>
      </div>
      <span style="margin-left:auto;color:var(--gold);font-size:18px">↗</span>
    </a>
    <div class="yt-grid">${vids}</div>`;
}

function renderContact() {

// ─── FOOTER ──────────────────────────────────────────────────────────────────
function renderFooter() {
  const ft = T.footer || {};
  set('ft-sa', ft.sa);
  set('ft-iast', ft.iast);
  const cp = document.getElementById('ft-copy');
  if (cp) {
    cp.innerHTML = `${ft.copy||'© 2025 Karthikeya Pidaparthy · Sydney, Australia'} ·

// ─── SETTINGS LABELS ─────────────────────────────────────────────────────────
function renderSettings() {
  const s = T.settings || {};
  set('s-title', (s.title ? '⚙ ' + s.title : '⚙ Settings'));
  setOpt('tL', s.theme_light || '☀ Light');
  setOpt('tD', s.theme_dark || '☽ Dark');
}
function setOpt(id, val) { const el=document.getElementById(id); if(el) el.textContent=val; }

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function set(id, val) { const el=document.getElementById(id); if(el && val!=null) el.innerHTML=val; }
function attr(id, a, val) { const el=document.getElementById(id); if(el) el.setAttribute(a, val); }

// ─── SETTINGS PANEL ──────────────────────────────────────────────────────────
function toggleSett() {
  document.getElementById('sPanel').classList.toggle('open');
  document.getElementById('sOverlay').classList.toggle('open');
}
function closeSett() {
  document.getElementById('sPanel').classList.remove('open');
  document.getElementById('sOverlay').classList.remove('open');
}

// ─── THEME ───────────────────────────────────────────────────────────────────
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t==='dark'?'dark':'');
  document.getElementById('tL').classList.toggle('active', t==='light');
  document.getElementById('tD').classList.toggle('active', t==='dark');
  localStorage.setItem('kp-theme', t);
}

// ─── FONT SIZE ───────────────────────────────────────────────────────────────
function setFS(v) {
  document.documentElement.style.setProperty('--fs', v+'px');
  document.getElementById('fsVal').textContent = v;
  localStorage.setItem('kp-fs', v);
}

// ─── ACCENT ──────────────────────────────────────────────────────────────────
function setAccent(g, gd, gl, el) {
  const r = document.documentElement;
  r.style.setProperty('--gold', g);
  r.style.setProperty('--gold-dark', gd);
  r.style.setProperty('--gold-light', gl);
  document.querySelectorAll('.sw').forEach(s => s.classList.remove('active'));
  if(el) el.classList.add('active');
}

// ─── LANGUAGE CYCLE ──────────────────────────────────────────────────────────
function cycleLang() {
  const idx = (LANGS.indexOf(LANG) + 1) % LANGS.length;
  const newLang = LANGS[idx];
  const btn = document.querySelectorAll('.l-btn')[idx];
  loadLang(newLang, btn);
}

// ─── NAV SCROLL ──────────────────────────────────────────────────────────────
function scrollTo(id) { document.getElementById(id)?.scrollIntoView({behavior:'smooth'}); }
function sNav(id) { scrollTo(id); }
function mobNav(id) { document.getElementById('mobMenu').classList.remove('open'); setTimeout(()=>scrollTo(id),80); }
function toggleMob() { document.getElementById('mobMenu').classList.toggle('open'); }

// ─── CONTACT FORM ────────────────────────────────────────────────────────────
function submitForm(e) {
  e.preventDefault();
  const el = document.getElementById('f-thanks');
  if(el) el.style.display='block';
  e.target.reset();
}

// ─── ACTIVE NAV ──────────────────────────────────────────────────────────────
const secs = ['home','about','profile','credits','events','parayana','support','testimonials','contact','youtube'];
const navObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if(e.isIntersecting) {
      document.querySelectorAll('[data-nav]').forEach(a => {
        a.classList.toggle('active', a.getAttribute('data-nav')===e.target.id);
      });
    }
  });
}, {threshold:0.35});
secs.forEach(id => { const el=document.getElementById(id); if(el) navObs.observe(el); });

// ─── FADE UP ─────────────────────────────────────────────────────────────────
function reobserveFadeUp() {
  const fuObs = new IntersectionObserver(entries => {
    entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('vis'); });
  }, {threshold:0.08});
  document.querySelectorAll('.fu').forEach(el => { el.classList.remove('vis'); fuObs.observe(el); });
}

// ─── RESTORE PREFS & INIT ────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  const savedTheme = localStorage.getItem('kp-theme');
  if(savedTheme) setTheme(savedTheme);
  const savedFS = localStorage.getItem('kp-fs');
  if(savedFS) { setFS(savedFS); document.getElementById('fsSlider').value=savedFS; }
  const savedLang = localStorage.getItem('kp-lang') || 'en';
  // find matching lang button
  const lBtns = document.querySelectorAll('.l-btn');
  const idx = LANGS.indexOf(savedLang);
  await loadLang(savedLang, idx>=0 ? lBtns[idx] : lBtns[0]);
});
