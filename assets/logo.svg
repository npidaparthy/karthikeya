<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf8f0"/>
      <stop offset="100%" stop-color="#f0e4c0"/>
    </radialGradient>
    <radialGradient id="glowring" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#c8860a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c8860a" stop-opacity="0.18"/>
    </radialGradient>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="100" cy="100" r="98" fill="url(#glowring)"/>

  <!-- Main circle border -->
  <circle cx="100" cy="100" r="94" fill="url(#bg)" stroke="#c8860a" stroke-width="2.5"/>

  <!-- 8-petal lotus base -->
  <g opacity="0.18">
    <ellipse cx="100" cy="72" rx="9" ry="22" fill="#c8860a"/>
    <ellipse cx="100" cy="72" rx="9" ry="22" fill="#c8860a" transform="rotate(45 100 100)"/>
    <ellipse cx="100" cy="72" rx="9" ry="22" fill="#c8860a" transform="rotate(90 100 100)"/>
    <ellipse cx="100" cy="72" rx="9" ry="22" fill="#c8860a" transform="rotate(135 100 100)"/>
    <ellipse cx="100" cy="72" rx="9" ry="22" fill="#c8860a" transform="rotate(180 100 100)"/>
    <ellipse cx="100" cy="72" rx="9" ry="22" fill="#c8860a" transform="rotate(225 100 100)"/>
    <ellipse cx="100" cy="72" rx="9" ry="22" fill="#c8860a" transform="rotate(270 100 100)"/>
    <ellipse cx="100" cy="72" rx="9" ry="22" fill="#c8860a" transform="rotate(315 100 100)"/>
  </g>

  <!-- Om symbol — centrepiece -->
  <text x="100" y="108" text-anchor="middle" font-size="62" fill="#c8860a"
        font-family="'Noto Sans Devanagari', serif" font-weight="400" opacity="0.95">ॐ</text>

  <!-- Top ornament: bindu + rays -->
  <circle cx="100" cy="16" r="4" fill="#c8860a"/>
  <line x1="100" y1="20" x2="100" y2="32" stroke="#c8860a" stroke-width="1.5" opacity="0.6"/>
  <!-- Cardinal ornament dots -->
  <circle cx="100" cy="188" r="3" fill="#c8860a" opacity="0.7"/>
  <circle cx="12"  cy="100" r="3" fill="#c8860a" opacity="0.7"/>
  <circle cx="188" cy="100" r="3" fill="#c8860a" opacity="0.7"/>
  <!-- Diagonal dots -->
  <circle cx="33"  cy="33"  r="2" fill="#c8860a" opacity="0.4"/>
  <circle cx="167" cy="33"  r="2" fill="#c8860a" opacity="0.4"/>
  <circle cx="33"  cy="167" r="2" fill="#c8860a" opacity="0.4"/>
  <circle cx="167" cy="167" r="2" fill="#c8860a" opacity="0.4"/>

  <!-- Name arc top: "SAMSKRUTI" -->
  <path id="topArc" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
  <text font-family="'Cinzel', 'Georgia', serif" font-size="13" fill="#8b5e06" letter-spacing="4" font-weight="600">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">SAMSKRUTI</textPath>
  </text>

  <!-- Name bottom: Telugu (straight, no arc to avoid ligature distortion) -->
  <text x="100" y="162" text-anchor="middle"
        font-family="'Noto Sans Telugu', sans-serif"
        font-size="13" fill="#8b5e06" opacity="0.85">సంస్కృతి</text>
</svg>
