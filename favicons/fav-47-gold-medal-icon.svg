<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Gold medal — Karthikeya's Bhagavad Gita achievement -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#fdf3d0"/>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="#c07808" stroke-width="1.2"/>
  <!-- Ribbon -->
  <rect x="13" y="4" width="6" height="8" rx="1" fill="#c07808" opacity="0.7"/>
  <!-- Medal circle -->
  <circle cx="16" cy="20" r="8" fill="#f0b030"/>
  <circle cx="16" cy="20" r="7" fill="none" stroke="#c07808" stroke-width="0.8"/>
  <!-- Star on medal -->
  <text x="16" y="24" text-anchor="middle" font-family="serif" font-size="10" fill="#8a4800" font-weight="bold">🥇</text>
</svg>
