<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Vel (spear) of Lord Kārtikeya -->
  <circle cx="16" cy="16" r="16" fill="#fdf3d0"/>
  <circle cx="16" cy="16" r="15" fill="none" stroke="#c07808" stroke-width="1.2"/>
  <!-- Spear shaft -->
  <line x1="16" y1="6" x2="16" y2="27" stroke="#c07808" stroke-width="2" stroke-linecap="round"/>
  <!-- Spear head (diamond tip) -->
  <polygon points="16,4 13,10 16,8 19,10" fill="#c07808"/>
  <!-- Cross guard -->
  <line x1="11" y1="13" x2="21" y2="13" stroke="#c07808" stroke-width="1.5" stroke-linecap="round"/>
</svg>
