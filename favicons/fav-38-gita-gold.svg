<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Open book (Bhagavad Gita) with Om -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#fdf3d0"/>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="#c07808" stroke-width="1.2"/>
  <!-- Book pages -->
  <path d="M7 22 Q16 10 16 10 Q16 10 25 22" fill="#faedc8" stroke="#c07808" stroke-width="0.8"/>
  <line x1="16" y1="10" x2="16" y2="23" stroke="#c07808" stroke-width="0.8"/>
  <!-- Om on spine -->
  <text x="16" y="26" text-anchor="middle" font-family="serif" font-size="7" fill="#c07808" font-weight="bold">गीता</text>
</svg>
